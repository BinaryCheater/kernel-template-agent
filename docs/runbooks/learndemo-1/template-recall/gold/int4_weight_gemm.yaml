moves:
  - id: load_time_prepack
    role: distinctive
    need: Permute and pack constant low-bit weights once at load time so their stored order matches what instruction fragments read.
    source_rule: offline_operand_prepack@1
    accept: []
    equivalent: [mixed_radix_materialization@1, fp4_bf16_bit_interleave@1, bitstream_packing@1, bitstream_packing@2, bitstream_packing@3]
    provenance: "chain key prepack; decomposition T01; marlin review row 1"
  - id: register_dequantization
    role: distinctive
    need: Decode low-bit integers to FP16 in registers right before the contraction with a few bit operations per group of values, folding the zero point.
    source_rule: fused_dequantization@1
    accept: []
    equivalent: [integer_operand_widening@1, fp4_bf16_bit_interleave@1, decoded_tile_materialization@1]
    provenance: "chain key dequant; decomposition T13; marlin review row 3"
  - id: row_chunking
    role: generic
    need: Split M into chunks served by separate launches or by tiles, and split N into output column tiles.
    source_rule: output_tiling@1
    accept: [output_tiling@2]
    equivalent: []
    provenance: "chain key m_split; decomposition T02"
  - id: k_major_stripes
    role: distinctive
    need: When M is small, flatten the tile grid and give each CTA a contiguous stripe of K-major tiles so all SMs stay busy.
    source_rule: linearized_work_partition@1
    accept: []
    equivalent: [contiguous_group_tile_walk@1]
    provenance: "chain key stripes; decomposition T03; marlin review row 2"
  - id: k_partition
    role: generic
    need: Split the K reduction of one output column across CTAs and across warps inside a CTA.
    source_rule: reduction_partition@1
    accept: [reduction_partition@1, reduction_partition@2]
    equivalent: [cyclic_tile_reduction_partition@1]
    provenance: "chain keys k_part, warp_k; decomposition T05"
  - id: ordered_cross_cta_combine
    role: distinctive
    need: Add partial results from several CTAs into the same output region in a fixed order, without numerical atomics, using a lock word in caller workspace.
    source_rule: ordered_global_combine@1
    accept: []
    equivalent: [ordered_workspace_combine@1, first_writer_atomic_combine@1, partial_grid_join_placement@1]
    provenance: "chain key global_combine; decomposition T17; marlin review row 5"
  - id: shared_memory_warp_tree
