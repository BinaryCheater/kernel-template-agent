    equivalent: [contraction_numeric_recipe@1]
    provenance: "chain key p_convert; decomposition T09"
  - id: accumulator_as_operand
    role: distinctive
    need: Reuse the registers that hold the score accumulator directly as the left operand of the next contraction instead of loading it again.
    source_rule: accumulator_operand_reuse@1
    accept: []
