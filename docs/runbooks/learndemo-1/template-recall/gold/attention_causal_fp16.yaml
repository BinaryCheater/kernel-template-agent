moves:
  - id: streamed_normalization
    role: distinctive
    need: Compute softmax over a long key axis in tiles without storing the whole score or probability matrix, keeping a running reference for the row maximum.
    source_rule: online_rescaled_reduction@1
    accept: [online_rescaled_reduction@2]
    equivalent: []
    provenance: "chain key online; decomposition T06, T12; trace-cuda-fa2 row online_rescaled_reduction@2"
  - id: fuse_score_softmax_pv
    role: distinctive
    need: Merge the score product, the softmax and the value product into one kernel so scores and probabilities never reach global memory.
    source_rule: operator_fusion@1
    accept: [operator_fusion@2, operator_fusion@3, operator_fusion@4]
    equivalent: []
    provenance: "chain key fuse; decomposition step fuse"
  - id: query_row_tiles
    role: generic
    need: Split output rows into tiles owned by one CTA per batch and head, and split further among warps along rows.
    source_rule: output_tiling@1
    accept: [output_tiling@2]
    equivalent: []
    provenance: "chain keys out_cta, out_warp; decomposition T01, T04"
  - id: key_block_partition
    role: generic
    need: Break the reduction over keys into contiguous key blocks consumed one after another by the same executor.
    source_rule: reduction_partition@1
    accept: [reduction_partition@1, reduction_partition@2]
    equivalent: []
    provenance: "chain key kv_part; decomposition T13"
  - id: causal_tile_pruning
    role: distinctive
    need: Use the known triangular mask to skip key blocks that are fully masked and to run mask-free code on blocks that are fully visible.
    source_rule: masked_tile_pruning@1
    accept: [masked_tile_pruning@2]
    equivalent: []
    provenance: "chain key causal_prune; decomposition T14, T15"
  - id: matrix_instruction
    role: generic
    need: Issue the score and value contractions with fixed-shape matrix instructions rather than scalar loops.
    source_rule: compute_instruction_selection@1
    accept: [compute_instruction_selection@2]
    equivalent: []
    provenance: "chain key mma; decomposition T05, T11"
  - id: probability_precision
    role: distinctive
    need: Convert FP32 probabilities to FP16 just before the value contraction, because that instruction takes FP16 operands.
    source_rule: operand_precision_conversion@1
