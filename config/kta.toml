# KTA configuration. Paths come from here, never from code (spec/conventions.md §3.1).

[impl]
# interface = "implementation name"; empty until WP1+ register implementations.

[toolchain]
cuda_home = "/usr/local/cuda"

[api]
# The API listens on the control host only; other machines reach it through an SSH tunnel.
host = "127.0.0.1"
port = 7310

[agents]
# Concurrent agent slots (docs/design/11 §2, default 2); the frontend draws one lane per slot.
slots = 2
