# KTA configuration. Paths come from here, never from code (spec/conventions.md §3.1).

[impl]
# interface = "implementation name"; empty until WP1+ register implementations.

[toolchain]
cuda_home = "/usr/local/cuda"

[api]
# The API listens on the control host only; other machines reach it through an SSH tunnel.
host = "127.0.0.1"
port = 7310

[knowledge]
# Seed knowledge imported by `kta init` (relative to the source tree root).
seed_dir = "knowledge/seed"

[executor]
# A job no registered worker can take fails as `infra` after this long (decision D184).
queue_timeout_s = 3600

# Compute workers (spec/conventions.md §6). Labels are probed at registration
# (`kta worker register`, `scripts/worker-setup`); `pools` sets each pool's concurrency.
[workers.spark]
transport = "ssh"
ssh = "spark"
root = "~/kta-work"
path = ["~/.local/bin", "/usr/local/cuda/bin"]
cuda_home = "/usr/local/cuda"
image = "kta-worker:tilelang-0.1.15"
pools = { cpu = 18, "gpu-shared" = 2, "gpu-exclusive" = 1, agent = 2 }

[workers.slai]
transport = "ssh"
ssh = "slai"
# The root filesystem on slai is full: uv, its cache and interpreters stay under /storage.
root = "/storage/kta-work"
path = ["/storage/kta-work/.uv/bin"]
env = { UV_CACHE_DIR = "/storage/kta-work/.uv/cache", UV_PYTHON_INSTALL_DIR = "/storage/kta-work/.uv/python", TMPDIR = "/storage/kta-work/tmp" }
pools = { cpu = 16 }

# Runtime agents (spec/modules/agents.md, decision D300): agent CLIs run as Executor jobs
# in the `agent` pool of this worker; workspaces and CLI homes live in its data directory.
[agents]
# Concurrent agent slots (docs/design/11 §2, default 2); the frontend draws one lane per slot.
slots = 2
worker = "spark"
pool = "agent"
batch = ""                          # default batch: kta agents env build <batch> --profile <id>
agent_user = "kta-agent"            # created by scripts/kta-agent-setup (needs approval)
token_key_file = "~/.config/kta/task-token.key"
api_url = ""                        # KTA_API for the agent-side kta (WP6/WP9); empty until then
secrets_file = "~/.config/kta/secrets.env"
watch = ["~/.codex", "~"]

[agents.hosts.spark]
codex_cmd = ["/home/memx/.nvm/versions/node/v22.21.1/bin/node", "/home/memx/.nvm/versions/node/v22.21.1/bin/codex"]
auth_dir = "~/.config/kta/auth/codex"
nvidia_smi = "nvidia-smi"

# WP11 processes. Values shown are the defaults (D401, D402, D405, D406); uncomment to change.
# [budget]
# agent_min = 6000          # global budget per period; process limits = global x quota
# gpu_min = 600
# period = "day"            # none | day | week
# [budget.quotas]
# experiment = 0.5
# solve = 0.25
# learn = 0.15
# calibrate = 0.05
# maintain = 0.05
# [calibrate]
# refit_after = 50
# window = 50
# alert_rel = 0.15
# min_pairs = 10
# retry_s = 3600
# [summarize]
# every_s = 86400
