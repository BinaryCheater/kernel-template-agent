  "object": {
    "type": "predicate_stable_record_compaction",
    "description": "When only a sparse subset of projected primitives is valid, compute block survivor counts and a global prefix, then emit complete records with preserved source identity into compact output."
  },
  "variables": [
    {
      "name": "records_per_block",
      "kind": "numeric",
      "binding": "compile",
      "role": "software",
      "domain": [
        256
      ],
      "meaning": "Observed packed projection block width; record order follows original block/lane order."
    }
  ],
  "constraints": [],
  "preconditions": [
    {
      "id": "pre_0",
      "expr": "p.input_and_validity_immutable and p.count_emit_same_predicate",
      "meaning": "Both passes evaluate identical source data and validity logic, including projection/culling numerical branches.",
      "cls": "semantic"
    },
    {
      "id": "pre_1",
      "expr": "p.prefix_sum_no_overflow and p.output_capacity_exact",
      "meaning": "Global prefix and record counts fit their integer types and output allocations cover the survivor total.",
      "cls": "semantic"
    },
    {
      "id": "pre_2",
      "expr": "p.record_fields_same_owner and p.scan_collective_uniform",
      "meaning": "All fields of a surviving record use the same offset; every block participant reaches scans/barriers correctly.",
      "cls": "semantic"
    }
  ],
  "program": {
    "description": "Pass1 assigns one lane to each input record, evaluates full validity and block-reduces Boolean survivor flags. Inclusive-scan block counts in source block order. Pass2 repeats validity and exclusive-scans flags within the block; surviving lane writes all record fields at previous-block-prefix+local-prefix. Preserve batch/camera/primitive IDs along with projected attributes. Derive row indptr from block prefixes and append total-survivor sentinel. Invalid/tail records reserve no output and do not make partial records."
  },
  "backward_map": "Erase auxiliary organization and recover the visible results under the stated contract.",
  "obligations": [
    {
      "name": "survivor_identity",
      "statement": "Each admitted source record emits once and rejected records emit none.",
      "method": "proof"
    },
    {
      "name": "record_atomicity",
      "statement": "All fields share one source owner and compact index; no projection field is paired with another primitive ID.",
      "method": "proof"
    },
    {
      "name": "stable_offsets",
      "statement": "Block/global scan composition yields disjoint source-order survivor indices and correct row boundaries.",
      "method": "proof"
    },
    {
      "name": "validity_replay",
      "statement": "Floating validity decisions agree in both passes for unchanged inputs and selected specialization.",
      "method": "proof"
    }
  ],
  "effects": {
    "transactions": [],
    "storage": [],
    "overlap": []
  },
  "scope": {
    "predicate": "p.input_and_validity_immutable and p.count_emit_same_predicate and p.prefix_sum_no_overflow and p.output_capacity_exact and p.record_fields_same_owner and p.scan_collective_uniform",
    "text": "NVIDIA packed EWA/2DGS projection output. Distinct from prefix-only whole-work filtering and from first-occurrence duplicate election; arbitrary per-record validity becomes a stable compact sequence. Resource effects: Two projection/validity evaluations plus count scan, compact attributes/IDs and row offsets; reduces downstream work/storage when few batch-camera-Gaussian combinations survive."
  },
  "requires": [],
  "probed_on": [],
  "relations": [],
  "signature": {
    "algorithm": "When only a sparse subset of projected primitives is valid, compute block survivor counts and a global prefix, then emit complete records with preserved source identity into compact output.",
    "storage": "Two projection/validity evaluations plus count scan, compact attributes/IDs and row offsets; reduces downstream work/storage when few batch-camera-Gaussian combinations survive.",
    "boundary": "Flags[1,0,1] in block0 and[0,1] in block1 give counts2,1,prefix2,3; original source IDs0,2,4 emit to slots0,1,2. Writing camera ID by original index while other fields use compact index corrupts records.",
    "resources": []
  },
  "numeric_risk": "Preserve the supplied arithmetic contract; reassociation, quantization and approximate search require separate permission.",
  "summary": "When only a sparse subset of projected primitives is valid, compute block survivor counts and a global prefix, then emit complete records with preserved source identity into compact output. Flags[1,0,1] in block0 and[0,1] in block1 give counts2,1,prefix2,3; original source IDs0,2,4 emit to slots0,1,2. Writing camera ID by original index while other fields use compact index corrupts records."
