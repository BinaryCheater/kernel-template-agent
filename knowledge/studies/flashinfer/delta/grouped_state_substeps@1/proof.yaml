template: grouped_state_substeps@1
version: 1
relation: Group expanded updates n*t..n*t+n-1. Only the first applies alpha_t; ordered corrections match
  the original token update by induction. Selecting post-update n*(t+1)-1 recovers its inclusive output/checkpoint.
  Chunk partitioning only inserts intermediate carry boundaries; it cannot change the transition sequence.
rank: Expanded updates not yet related to their original token/substep.
assumes:
- name: pre_semantics
  statement: Each real token first decays state once by its scalar alpha, then applies n ordered beta*(v-prediction)
    rank-one updates, then emits its query readout. n is part of workload semantics, not a tuning replacement.
- name: pre_coordinates
  statement: Real token t and substep j map to m=n*t+j relative to their sequence; global expanded prefix
    is n times the real prefix. K/V/beta are substep-indexed, Q/gate/output/checkpoint and accepted lengths
    are real-token-indexed.
- name: pre_frames
  statement: Expanded decay alpha_m equals token alpha at j0 and1 otherwise. A chunk beginning inside
    a token does not repeat that token decay. Local cumulative frames subtract the complete prefix before
    the chunk, even if its boundary is within a token.
- name: pre_readouts
  statement: Token t observes expanded post-update state at m=n*(t+1)-1. Its causal support includes exactly
    updates0..m. Output/checkpoint stores occur once per real token; accepted token count a maps to n*a
    committed updates.
- name: pre_chunks
  statement: Expanded chunks may bisect a token. The next chunk starts from the preceding update state,
    and every real readout uses all preceding substeps. Invalid padded updates have alpha1,beta0,key/value0
    and cannot create stores.
- name: pre_numeric
  statement: Key/query normalization, beta/gate stages, prediction precision, rank-one update order and
    output/state casts have an explicit admitted numerical policy. Sequential and solve-based realizations
    do not inherit native bitwise equality.
- name: pre_slots
  statement: Live state and checkpoint destinations have safe ownership; snapshots represent after-real-token
    states, old-state readers retire before overwrite, and input records match the same sequence generation.
- name: pre_backend
  statement: Selected token-serial or expanded-chunk route is implemented for n,target,shape and precision.
    Zero seeds, pooled initial state, frozen output and snapshot modes retain their separately supported
    menus.
guarantees: []
models: []
note: gdp_prefill.py:45-72 defines real-token decay, ordered corrections and final readout. Concrete n2
  lanerow body cake_gdp_3342c82179fa758b0570_kernel.cu:746-750,1202,2793,4647-5256 orders decay/update0/update1/readout/snapshot.
  SM90 V6 cake_gdp_0de8fd0ee57885709a1c_kernel.cu:397-398 uses ceil(L*n/64),543-558 maps expanded chunks
  to real-query positions,2474-2494 masks update col<=n*(qrow+1)-1-bp_roff,3430-3468 subtracts the pre-chunk
  expanded gate carry. Numerical conversion/instruction schedule and gate-saturation split resets are
  distinct designs. Exact checks compare nested token/substep transitions with expanded chunk execution,
  validate source readout maps across64 boundaries and show repeated-decay/early-output/prefix-unit counterexamples.
