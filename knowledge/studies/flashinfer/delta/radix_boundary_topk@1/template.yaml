name: radix_boundary_topk
version: 1
level_from: 3
level_to: 4
change: vertical
refines: reduce
produces:
- map
- reduce
- store
object:
  type: score_boundary_and_tied_identity_cut
  description: Find the k-th score by prefix-restricted radix histograms, then select the required largest
    IDs only among boundary-score ties.
variables:
- name: digit_schedule
  kind: structure
  binding: compile
  role: software
  domain:
  - bytes_8_8_8_8
  - bits_11_11_10
  meaning: Most-significant-first partition of the 32-bit score/ID key; derive shifts and masks from this
    schedule.
- name: k
  kind: numeric
  binding: runtime
  role: boundary
  domain:
    lo: 1
    hi: 4096
  meaning: Requested exact winner slots; actual winner count is min(k,valid_count).
constraints:
- id: c_histogram
  expr: (digit_schedule == 'bytes_8_8_8_8' and p.histogram_bins >= 256) or (digit_schedule == 'bits_11_11_10'
    and p.histogram_bins >= 2048)
  meaning: Allocate enough bins for the largest digit.
  cls: resource
- id: c_storage
  expr: p.valid_count >= 0 and p.output_capacity >= k and p.histogram_bytes >= 4 * p.histogram_bins
  meaning: Counts and output/histogram capacity are valid.
  cls: resource
preconditions:
- id: pre_encoding
  expr: p.finite_fp32_scores_and_unique_nonnegative_int32_ids and p.score_key_encoding_monotone_with_signed_zero_fold
  meaning: FP32 scores map to monotone unsigned 32-bit keys, folding signed zero; valid IDs are unique
    nonnegative signed-32-bit values.
  cls: semantic
- id: pre_domain
  expr: p.valid_domain_count_exact_and_invalids_excluded and p.histograms_cover_each_active_identity_once
  meaning: Every histogram counts exactly the current valid prefix set, with no invalid or duplicate contributions.
  cls: semantic
- id: pre_counters
  expr: p.histogram_and_prefix_counts_fit_counter_type and p.histogram_generation_zeroed_and_complete_before_rank_selection
  meaning: Bin counts fit; each new histogram generation is cleared and complete before locating the rank.
  cls: implementation
- id: pre_state
  expr: p.every_participant_uses_same_prefix_rank_and_generation and p.phase_state_and_histograms_live_until_readers_retire
  meaning: All participants share one prefix/residual-rank state and preserve each phase data until its
    readers finish.
  cls: implementation
- id: pre_emit
  expr: p.emit_exact_score_greater_or_boundary_id_ge_cut and p.output_slots_unique_and_presentation_padding_defined
  meaning: Emit only scores above the boundary and the largest required tied IDs; output allocation/order/padding
    is defined.
  cls: semantic
- id: pre_backend
  expr: p.selected_radix_schedule_implemented_and_scratch_capacity_fits
  meaning: The selected digit schedule and any distributed combine/publication path are implemented and
    fit their storage.
  cls: implementation
program:
  description: 'Map each finite FP32 score s to a monotone unsigned 32-bit order key: fold either signed
    zero to positive zero, complement bits for negative values, otherwise set the sign bit. For want=min(k,valid_count)>0,
    start with empty prefix and residual rank want. For each digit from most to least significant, count
    only keys matching the prior prefix, scan bins in descending key order, choose the bin containing
    the residual rank, subtract the counts of strictly higher bins and append that digit to the prefix.
    After all 32 bits the prefix is the exact boundary score key and residual rank is how many equal-score
    entries belong among the winners. Apply the same descending radix procedure to the original IDs of
    only those boundary-score entries, obtaining the residual-rank-th largest ID. Emit every key above
    the score boundary plus boundary keys whose ID is at least that ID cut. If all tied entries are needed,
    skip the ID passes. A surrounding bounded candidate stage may instead retain all boundary ties when
    they fit, but must eventually apply this exact ID decision before output. Arrange the selected set
    in the caller requested order, such as ascending ID or unspecified set order; never confuse that presentation
    with the descending ranking comparator. Empty domains emit padding without requesting a nonexistent
    rank.'
backward_map: The score boundary and tied-ID cut represent the first min(k,valid_count) identities under
  descending score then descending original ID, with signed zeros equal.
obligations:
- name: rank_prefix
  statement: Every prefix step retains exactly the bin containing the unresolved rank and subtracts exactly
    the better-key count.
  method: proof
- name: tie_identity
  statement: Only equal-boundary-score IDs enter the tie selector and the final cut retains exactly the
    required largest distinct IDs.
  method: proof
- name: histogram_generation
  statement: Local/distributed counts, phase completion and reset preserve one consistent prefix/rank
    generation.
  method: test
- name: encoding_and_output
  statement: Encoding matches finite FP32 order including signed zeros; emitted IDs/scores remain aligned
    with unique slots and defined presentation/padding.
  method: test
effects:
  transactions: []
  storage:
  - id: radix_histograms
    level: smem
    scope: cta
    bytes: 4 * p.histogram_bins
  - id: distributed_histograms
    level: dram
    scope: kernel
    bytes: p.distributed_histogram_bytes
  overlap: []
scope:
  predicate: p.finite_fp32_scores_and_unique_nonnegative_int32_ids and p.score_key_encoding_monotone_with_signed_zero_fold
    and p.valid_domain_count_exact_and_invalids_excluded and p.histograms_cover_each_active_identity_once
    and p.histogram_and_prefix_counts_fit_counter_type and p.histogram_generation_zeroed_and_complete_before_rank_selection
    and p.every_participant_uses_same_prefix_rank_and_generation and p.phase_state_and_histograms_live_until_readers_retire
    and p.emit_exact_score_greater_or_boundary_id_ge_cut and p.output_slots_unique_and_presentation_padding_defined
    and p.selected_radix_schedule_implemented_and_scratch_capacity_fits
  text: Finite FP32 scores with distinct nonnegative int32 IDs and larger-ID tie breaking. Four byte passes
    and 11/11/10-bit passes are source-bound schedules; bins, scans and publication have concrete backend
    obligations. Source ragged SM120 DSA presents final IDs ascending. Decode selection has a different
    presentation and coarse-histogram/refinement realization. NaNs, duplicate IDs, arbitrary comparison
    transforms and smallest-ID ties are outside this version.
requires: []
probed_on: []
relations: []
signature:
  algorithm: Radix selection of exact score boundary followed by equal-score ID boundary.
  reuse: Avoid sorting the whole score domain; only the unresolved prefix is counted each pass.
  storage: Digit histogram plus prefix/rank state and optional distributed row histograms; emission buffering
    is a separate binding.
  boundary: Monotone FP32 encoding, residual rank update, original-ID ties and consistent histogram phases.
  resources:
  - smem
  - dram
numeric_risk: Selection introduces no new score rounding; score producer changes and signed-zero/NaN policy
  can change the order before selection.
summary: When exact top-k needs more than a small sorted-run merge, find the boundary score with most-significant-first
  radix histograms. Carry the rank remaining inside the chosen prefix, then choose the required largest
  original IDs only among equal-score entries. This avoids a whole-row sort while retaining exact deterministic
  membership. Output may be presented in ascending ID order even though ranking favors larger IDs on ties.
