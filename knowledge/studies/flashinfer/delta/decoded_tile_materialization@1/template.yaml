name: decoded_tile_materialization
version: 1
level_from: 3
level_to: 4
change: vertical
refines: transfer
produces: [map, store, transfer, sync]
object:
  type: reusable_decoded_operand_tile
  description: Choose repeated fragment-local decoding or cooperative whole-tile decoding into shared memory for later native compute loads.
variables:
  - {name: decode_site, kind: structure, binding: compile, role: software, domain: [fragment_registers,shared_tile], meaning: Decode when each consumer loads its fragment or materialize one decoded shared tile and reuse its elements.}
constraints:
  - {id: c_shape, expr: "p.rows >= 1 and p.features >= 1 and p.decoded_element_bytes == 2", meaning: "This binding materializes a nonempty tile in FP16 or BF16.", cls: implementation}
  - {id: c_capacity, expr: "decode_site != 'shared_tile' or p.rows * p.features * p.decoded_element_bytes <= p.decoded_scratch_capacity_bytes", meaning: "The decoded tile fits its dedicated or time-shared scratch region.", cls: resource}
preconditions:
  - {id: pre_decoder, expr: "p.code_and_metadata_coordinate_map_fixed and p.decoder_value_scale_and_rounding_steps_fixed and p.remaining_scale_sites_explicit", meaning: "The selected local decoder has fixed code order, metadata ownership and arithmetic/casts; scales outside that boundary retain their original sites.", cls: semantic}
  - {id: pre_inputs, expr: "p.code_metadata_generation_matches_and_lives_through_decode and p.valid_value_and_scale_domain_admitted and p.tail_decoding_values_defined", meaning: "Codes and scales belong to the same generation, are valid for the decoder and have defined inactive/tail behavior.", cls: semantic}
  - {id: pre_layout, expr: "p.fragment_and_tile_decoders_produce_same_logical_values and p.compute_load_layout_matches_decoded_tile", meaning: "Both paths produce the same admitted logical operand, including scale-before/after-cast order, and native fragment loads read matching coordinates.", cls: implementation}
  - {id: pre_lifetime, expr: "decode_site != 'shared_tile' or (p.all_tile_writes_publish_before_reads and p.all_decoded_readers_retire_before_reuse and p.aliased_decoder_regions_have_disjoint_lifetimes)", meaning: "The shared decoded generation is complete before use, survives all readers and is not overwritten by another K/V generation or role.", cls: implementation}
  - {id: pre_binding, expr: "p.selected_consumer_implements_decode_site_and_budget_matches and p.decode_reuse_numeric_policy_admitted", meaning: "The actual consumer implements the chosen path and its resource budget matches allocation; source path availability and numerical policy are explicit.", cls: implementation}
program:
  description: >-
    Keep the global packed representation and its metadata unchanged. With
    fragment_registers, each consumer decodes the requested codes and scales
    into its compute fragment immediately before use. With shared_tile, assign
    every logical tile element to one cooperative decoder owner, apply the same
    decoder arithmetic and rounding, and write the result into the shared layout
    accepted by ordinary 16-bit compute loads. Publish all decoded writes, then
    reuse that generation for every consumer fragment. A staging buffer may
    serve K then V only after every K consumer has retired. Preserve separate
    row/group scales outside the chosen decoder boundary; materialization is
    not permission to move them through a contraction or softmax. Reject a
    consumer whose launcher allocates the buffer but has no decode/store/read
    path, or whose actual shared/register budget cannot support the selection.
backward_map: Replace each decoded shared read by the corresponding fragment-local decoder at its original logical coordinate, recovering the same admitted compute operand and consumer values.
obligations:
  - {name: decoder_and_metadata, statement: "Each logical code uses its own metadata exactly once in the fixed decoder order; both paths yield the same admitted operand including tails.", method: test}
  - {name: decoded_layout, statement: "Cooperative writes and native compute reads compose to the original logical tile coordinates without omission, overlap or scale-group swaps.", method: test}
  - {name: lifetime_and_publication, statement: "Decoded writes publish before reads and every consumer finishes before scratch reuse, including K/V alias transitions.", method: test}
  - {name: legal_resource_binding, statement: "The selected device path exists and its launch/layout/occupancy budget includes the actual decoded buffer and control state.", method: test}
effects:
  transactions: []
  storage:
    - {id: decoded_tile, level: smem, scope: cta, bytes: "p.rows * p.features * p.decoded_element_bytes", when: "decode_site == 'shared_tile'"}
    - {id: decoded_fragment, level: reg, scope: thread, bytes: "p.fragment_elements * p.decoded_element_bytes", when: "decode_site == 'fragment_registers'"}
  overlap: []
scope:
  predicate: "p.code_and_metadata_coordinate_map_fixed and p.decoder_value_scale_and_rounding_steps_fixed and p.remaining_scale_sites_explicit and p.code_metadata_generation_matches_and_lives_through_decode and p.valid_value_and_scale_domain_admitted and p.tail_decoding_values_defined and p.fragment_and_tile_decoders_produce_same_logical_values and p.compute_load_layout_matches_decoded_tile and (decode_site != 'shared_tile' or (p.all_tile_writes_publish_before_reads and p.all_decoded_readers_retire_before_reuse and p.aliased_decoder_regions_have_disjoint_lifetimes)) and p.selected_consumer_implements_decode_site_and_budget_matches and p.decode_reuse_numeric_policy_admitted"
  text: >-
    Fixed finite-domain local decoders producing FP16/BF16 operands. Source FA2
    prefill has FP8 cast and NVFP4 E2M1/group16-scale bindings. The source repack
    policy requires supported shapes and launcher capability; it is not enabled
    for every consumer reusing the traits. Other codebooks, special-value laws,
    intermediate precisions and scale placement require explicit bindings. Costs
    of repeated decoding versus shared loads/barriers remain unpriced.
requires: []
probed_on: []
relations: []
signature:
  algorithm: Materialize a cooperatively decoded operand tile once or decode repeatedly at fragment loads.
  reuse: Shared decoded values amortize conversion over several query/fragment consumers.
  storage: Additional two bytes per logical tile element in shared memory, potentially aliased across retired K/V phases.
  boundary: Decoder/scale/cast identity, native read map, implemented path and safe generation lifetime.
  resources: [smem, registers, tensor]
numeric_risk: A decoded buffer can insert rounding or change scale order; preserving the same abstract dequantized real value is insufficient if the source fragment decoder uses a different finite-precision sequence.
summary: >-
  When many compute fragments repeatedly decode the same packed operand tile,
  consider decoding it once into shared memory and reusing ordinary 16-bit
  loads. Keep the decoder and metadata map unchanged, publish the full tile
  before use, and wait for every reader before reusing its storage. This trades
  shared capacity and barriers for repeated conversion/shuffle work. A trait
  flag alone does not establish that the consumer implements the shared path.
