name: numerator_weight_gain
version: 1
level_from: 3
level_to: 4
change: vertical
refines: contract
produces:
- map
- contract
- reduce
object:
  type: gained_narrow_weights_with_ungained_normalizer
  description: Gain and quantize only the contraction weights while retaining ungained row mass; compensate
    the weighted numerator at finalization.
variables:
- name: gain_policy
  kind: structure
  binding: compile
  role: software
  domain:
  - unit
  - power_of_two
  - format_max
  meaning: Choose no gain, a power-of-two gain or the selected FP8 format maximum.
- name: gain_log2
  kind: numeric
  binding: compile
  role: software
  domain:
    lo: 0
    hi: 8
  meaning: Power-of-two exponent when that policy is selected; source classic FP8 value-split path binds
    eight.
constraints:
- id: c_gain
  expr: (gain_policy == 'unit' and p.gain_value == 1) or (gain_policy == 'power_of_two' and p.gain_value
    == 2 ** gain_log2) or (gain_policy == 'format_max' and p.gain_value == p.quantizer_max)
  meaning: The actual multiplier is derived from the selected policy, not an independent hidden scale.
  cls: implementation
- id: c_format
  expr: p.quantizer_max == 448 or p.quantizer_max == 57344
  meaning: This version binds E4M3/E5M2 probability formats; other encodings need another numeric binding.
  cls: implementation
- id: c_nonempty
  expr: p.row_count >= 1 and p.value_features >= 1
  meaning: Nonempty row/feature domain; individual rows may have empty key support.
  cls: semantic
- id: c_power
  expr: gain_policy != 'power_of_two' or gain_log2 % 1 == 0
  meaning: Power-of-two gain uses an integral exponent.
  cls: implementation
preconditions:
- id: pre_weights
  expr: p.weights_nonnegative_finite_in_actual_online_reference and p.masked_weights_zero_and_empty_support_branch_defined
  meaning: Weights use the declared online reference; excluded terms are zero and empty rows have an explicit
    nondividing finalization.
  cls: semantic
- id: pre_mass
  expr: p.mass_accumulated_from_ungained_weights_before_quantization and p.lse_uses_ungained_mass_and_actual_reference
  meaning: The row denominator is formed from original weights, not gained or quantized probabilities;
    LSE stays in that original frame.
  cls: semantic
- id: pre_gain
  expr: p.gain_finite_positive_and_constant_over_each_live_numerator and p.gain_matches_quantizer_format_and_range
  meaning: One known positive gain applies to all probability contributions held in a numerator; changes
    require an explicit state conversion.
  cls: implementation
- id: pre_reference
  expr: p.old_numerator_corrected_to_new_reference_before_new_terms and p.value_scale_constant_over_contracted_keys_or_applied_per_term
  meaning: Online correction acts on the old numerator; a factored value scale is constant over its contraction,
    otherwise scales remain on individual terms.
  cls: semantic
- id: pre_numeric
  expr: p.weight_gain_quantizer_cast_and_mma_error_policy_admitted and p.final_reciprocal_and_accumulator_range_admitted
  meaning: The numerical contract includes gained-weight rounding/underflow, accumulator range and final
    reciprocal arithmetic.
  cls: implementation
- id: pre_layout
  expr: p.quantized_weight_fragment_map_matches_value_contraction and p.weight_generations_publish_before_reads_and_retire_before_reuse
  meaning: The selected backend consumes the correct quantized P coordinates with legal publication/lifetime.
  cls: implementation
program:
  description: For each row/tile form ordinary nonnegative weights w in the current online reference.
    Update the high-precision denominator d from those ungained weights. Let G be 1, 2**gain_log2 or the
    selected format maximum according to gain_policy. Convert G*w into the declared narrow probability
    format Q and accumulate Q(G*w)*Vcode in a wide numerator A. On reference changes multiply only the
    previous A by the same online correction c used for previous d before adding new terms; G is unchanged
    throughout the live state. At finalization for d>0 return A*Vscale/(G*d), where Vscale may be factored
    only when constant across contracted keys. Preserve per-term scales otherwise. For empty support take
    the declared branch without dividing by zero. Form row LSE from the original reference and ungained
    d, with no log(G) correction. Quantized weights are not a replacement denominator. Coordinate permutations
    and storage depend on the actual MMA realization and remain explicit obligations.
backward_map: Replace each quantized weight by G*w plus its declared quantization residual; dividing the
  final numerator by G recovers the original weighted contraction plus the admitted residual contribution,
  normalized by the original row mass.
obligations:
- name: gain_and_frame
  statement: One fixed gain and matching reference correction govern every term in the live numerator,
    while the denominator and LSE remain ungained.
  method: proof
- name: quantized_error
  statement: Quantizer, exponent, gain arithmetic, accumulation and reciprocal errors satisfy the requested
    policy over the admitted finite range.
  method: test
- name: scale_and_layout
  statement: Factored value scales are constant over contracted terms; actual quantized fragment layouts
    and generations match the PV operation.
  method: test
- name: empty_and_final
  statement: Positive mass receives exactly one inverse-gain compensation; empty rows avoid undefined
    division and preserve their declared outputs.
  method: test
effects:
  transactions: []
  storage:
  - id: quantized_weights
    level: reg
    scope: warp
    bytes: p.live_weight_elements * p.quantized_element_bytes
  overlap: []
scope:
  predicate: p.weights_nonnegative_finite_in_actual_online_reference and p.masked_weights_zero_and_empty_support_branch_defined
    and p.mass_accumulated_from_ungained_weights_before_quantization and p.lse_uses_ungained_mass_and_actual_reference
    and p.gain_finite_positive_and_constant_over_each_live_numerator and p.gain_matches_quantizer_format_and_range
    and p.old_numerator_corrected_to_new_reference_before_new_terms and p.value_scale_constant_over_contracted_keys_or_applied_per_term
    and p.weight_gain_quantizer_cast_and_mma_error_policy_admitted and p.final_reciprocal_and_accumulator_range_admitted
    and p.quantized_weight_fragment_map_matches_value_contraction and p.weight_generations_publish_before_reads_and_retire_before_reuse
  text: Finite E4M3/E5M2 contraction weights with a fixed numerator-only gain, wider row mass/output accumulation
    and an explicit approximation contract. Source classic value-split FP8 binds G=256; Hopper binds G=448
    or 57344 and folds a per-KV-head V scale into finalization. No common denominator gain, arbitrary
    changing tile gain, inferred uniform error bound or bitwise equivalence to ungained quantization is
    supplied.
requires: []
probed_on: []
relations: []
signature:
  algorithm: Quantize gained exponential weights for PV while keeping the original high-precision denominator.
  reuse: Larger weight codes use more of a narrow format range without changing the logical normalizer.
  storage: Narrow P fragments plus wide numerator and ungained row state.
  boundary: Fixed gain, distinct numerator/denominator frames, quantization error and exactly one final
    compensation.
  resources:
  - registers
  - tensor
numeric_risk: Q(G*w)/G and Q(w) differ. G can preserve small weights or change rounding and range pressure;
  non-power-of-two gain adds its own arithmetic error. Ungained row mass must not be replaced by a sum
  of quantized P.
summary: When a narrow probability operand loses small exponential weights, multiply only that operand
  by a fixed gain before conversion. Accumulate the gained PV numerator, retain the original higher-precision
  denominator, and divide output by the gain once. This can change useful representable weights but requires
  an explicit error/range policy. The denominator and LSE never receive the gain; this differs from scaling
  a whole normalized reduction state.
