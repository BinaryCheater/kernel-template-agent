name: semantic_block_page_fragments
version: 1
level_from: 3
level_to: 4
change: vertical
refines: transfer
produces:
- map
- transfer
- store
object:
  type: semantic_sparse_blocks_mapped_to_independent_storage_fragments
  description: Decouple selected semantic block extent from physical cache-page extent using their greatest
    common aligned fragment and encoded page/subpage locators.
variables:
- name: locator_mode
  kind: structure
  binding: compile
  role: software
  domain:
  - precomputed
  - on_demand
  meaning: Materialize fragment locators ahead of the attention consumer or resolve the same mapping while
    supplying its index view.
constraints:
- id: c_shape
  expr: p.semantic_block_size >= 1 and p.storage_page_size >= 1 and p.fragment_size >= 1 and p.semantic_block_size
    % p.fragment_size == 0 and p.storage_page_size % p.fragment_size == 0
  meaning: Complete physical fragments divide both semantic blocks and storage pages.
  cls: semantic
preconditions:
- id: pre_fragment
  expr: p.fragment_size_is_gcd_of_semantic_block_and_storage_page and p.all_blocks_pages_aligned_to_common_token_origin
  meaning: F is the derived greatest common divisor; block and page origins share the same token coordinate
    frame.
  cls: semantic
- id: pre_support
  expr: p.selected_semantic_blocks_and_original_fragment_membership_contract_explicit
  meaning: Original support, current-block inclusion and per-query membership are determined before storage
    translation; mapping does not deduplicate or invent support.
  cls: semantic
- id: pre_map
  expr: p.request_head_logical_block_and_page_table_generation_match and p.live_physical_pages_in_bounds
  meaning: Every fragment uses the intended request/head and current physical page table.
  cls: semantic
- id: pre_width
  expr: p.maximum_live_locator_fits_nonnegative_signed_int32_and_address_products_widened
  meaning: Valid locators fit nonnegative int32 and address products cannot wrap; negative sentinel stays
    reserved.
  cls: implementation
- id: pre_padding
  expr: p.partial_fragment_score_masks_exact_and_loaded_value_padding_finite_zero_or_other_admitted_neutral
  meaning: Whole-fragment loading may read logical padding; later score masking alone cannot sanitize
    NaN/Inf V padding.
  cls: implementation
- id: pre_sentinel
  expr: p.invalid_locator_decodes_to_out_of_bounds_zero_fill_and_never_a_live_page
  meaning: Invalid/tail slots cannot alias valid cache rows after decoding, head offset addition or integer
    division.
  cls: implementation
- id: pre_lifetime
  expr: (locator_mode != 'precomputed' or p.locators_memberships_published_and_alive_through_all_consumers)
    and (locator_mode != 'on_demand' or p.live_mapping_inputs_immutable_until_all_resolutions_finish)
  meaning: Precomputed and direct-view paths preserve mapping generation and publication/lifetime.
  cls: implementation
- id: pre_consumer
  expr: p.consumer_decodes_same_page_subpage_units_and_selected_mode_supported
  meaning: The consumer treats F as transfer extent and decodes P/F subpages per physical page; supported
    modes may have distinct target restrictions.
  cls: implementation
program:
  description: Let semantic block extent B, storage page extent P and derived F=gcd(B,P). A selected logical
    block b has B/F fragments. For each f in[0,B/F), compute logical token t=b*B+f*F, logical page lp=t//P
    and subpage u=(t%P)//F. Resolve physical page h=table[request,lp] independently for each fragment.
    Encode locator=h*(P/F)+u. Decode by h=locator//(P/F), token_offset=(locator%(P/F))*F, then load exactly
    F token rows with the declared head/feature strides. Use the same formula precomputed or on demand.
    Preserve fragment membership/original token positions and mask the partial logical tail. Invalid entries
    use a reserved negative sentinel with a separately proved out-of-bounds decode; do not assume signed
    division alone implements that sentinel. No physical adjacency follows from neighboring logical pages.
backward_map: For every valid fragment element k<F, decoded physical token h*P+u*F+k equals table[request,(b*B+f*F)//P]*P+(b*B+f*F)%P+k.
  Concatenating its B/F fragments recovers the selected semantic block through the original page table.
obligations:
- name: fragment_identity
  statement: Every semantic block token maps to the correct physical page/offset even when the block crosses
    multiple nonadjacent pages.
  method: test
- name: locator_roundtrip
  statement: Valid locators roundtrip without overflow, and invalid sentinels stay invalid through decode/head
    transforms.
  method: test
- name: support_and_tail
  statement: Membership/current-block policy and token masks survive mapping; whole-fragment V loads have
    admitted padding.
  method: test
- name: path_equivalence
  statement: Precomputed and direct-view locators use the same immutable inputs and publication generation.
  method: test
scope:
  text: Source QToken-KvBlock-Sparse attention, semantic block4/8/16/32/64/128, storage page a positive
    multiple4, F=gcd(B,P). F can be smaller than either extent. Q1 has direct-view or materialized mapping;
    grouped queries use union/membership preparation upstream. Source valid selected prefix is distinct/in-range,
    not arbitrary-hole occurrence support. Other extents require a supported consumer; encoded-subpage
    FP8 routes may require separate split reduction rather than direct/inline/cluster publication.
  predicate: (p.semantic_block_size >= 1 and p.storage_page_size >= 1 and p.fragment_size >= 1 and p.semantic_block_size
    % p.fragment_size == 0 and p.storage_page_size % p.fragment_size == 0) and (p.fragment_size_is_gcd_of_semantic_block_and_storage_page
    and p.all_blocks_pages_aligned_to_common_token_origin) and (p.selected_semantic_blocks_and_original_fragment_membership_contract_explicit)
    and (p.request_head_logical_block_and_page_table_generation_match and p.live_physical_pages_in_bounds)
    and (p.maximum_live_locator_fits_nonnegative_signed_int32_and_address_products_widened) and (p.partial_fragment_score_masks_exact_and_loaded_value_padding_finite_zero_or_other_admitted_neutral)
    and (p.invalid_locator_decodes_to_out_of_bounds_zero_fill_and_never_a_live_page) and ((locator_mode
    != 'precomputed' or p.locators_memberships_published_and_alive_through_all_consumers) and (locator_mode
    != 'on_demand' or p.live_mapping_inputs_immutable_until_all_resolutions_finish)) and (p.consumer_decodes_same_page_subpage_units_and_selected_mode_supported)
signature:
  algorithm: Refine selected logical blocks into independently translated common-alignment fragments.
  storage: Optional int32 physical-page/subpage locators and matching membership metadata.
  boundary: Nonadjacent pages, sentinel decode, signed locator range and finite loaded padding.
  resources:
  - dram
  - smem
  - registers
numeric_risk: Storage translation is value neutral only with exact support/masks and safe padding. A masked
  score multiplied by NaN V does not become a harmless zero contribution.
summary: When sparse selection blocks and cache pages have different extents, split at their greatest
  common aligned fragment and translate each fragment independently. This permits crossing page boundaries
  without repacking KV. Keep semantic support separate from storage locators, and preserve invalid sentinels
  through the consumer decode.
effects:
  transactions: []
  storage: []
  overlap: []
requires: []
probed_on: []
relations: []
