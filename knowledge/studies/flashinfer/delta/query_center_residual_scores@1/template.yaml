name: query_center_residual_scores
version: 1
level_from: 3
level_to: 4
change: vertical
refines: contract
produces:
- reduce
- map
- contract
- store
object:
  type: quantized_query_residual_plus_shared_score_correction
  description: Subtract a shared query mean before low-precision encoding and recover the full key-dependent
    mean score through one compact correction row per query group.
variables:
- name: center_scope
  kind: structure
  binding: compile
  role: software
  domain:
  - head
  - query_blocks
  meaning: One query mean per head or one mean per128-query block; correction rows share the same scope.
constraints:
- id: c_shape
  expr: p.batch >= 1 and p.query_heads >= 1 and p.query_rows >= 1 and p.key_rows >= 1 and p.features >=
    1
  meaning: Nonempty selected head/query/key domains.
  cls: semantic
- id: c_rows
  expr: (center_scope == 'head' and p.correction_rows_per_head == 1) or (center_scope == 'query_blocks'
    and p.correction_rows_per_head == (p.query_rows + 127) // 128)
  meaning: Compact correction row count derives from the center scope, not a separate tuning choice.
  cls: implementation
preconditions:
- id: pre_affine
  expr: p.finite_query_key_center_and_correction_values and p.score_contract_is_dot_plus_declared_bias_mask
  meaning: Finite operands and an affine dot-product score admit the decomposition.
  cls: semantic
- id: pre_map
  expr: p.every_query_maps_to_exactly_one_center and p.correction_and_residual_use_same_key_queryhead_kvhead_map_and_generation
  meaning: Each row and GQA head use the same mean block, key operand and generation in both paths.
  cls: semantic
- id: pre_merge
  expr: p.correction_added_once_before_mask_softmax_and_score_scale_applied_to_sum_once and p.mma_accumulation_preserves_seeded_correction
  meaning: Residual QK and correction sum before nonlinear operations; accumulator initialization cannot
    erase the correction.
  cls: semantic
- id: pre_numeric
  expr: p.mean_subtraction_residual_quantization_correction_matmul_and_combined_error_admitted and p.correction_storage_range_and_precision_admitted
  meaning: Mean/subtraction casts, residual encoding, correction computation/storage and combined score
    error meet the policy.
  cls: implementation
- id: pre_frame
  expr: p.independent_key_center_and_returned_lse_frame_contract_explicit
  meaning: This rule restores the query residual dot only; any separate key translation and original-frame
    LSE offset have their own binding.
  cls: semantic
- id: pre_lifetime
  expr: p.correction_rows_and_scales_publish_before_matching_score_tile_and_retire_before_reuse and p.padded_query_and_key_validity_preserved
  meaning: Correction tiles survive all score readers and align with original valid/tail coordinates.
  cls: implementation
- id: pre_backend
  expr: p.selected_center_scope_residual_encoder_and_correction_broadcast_implemented_and_resources_fit
  meaning: The selected center granularity, native encoded contraction and compact correction layout exist
    and fit.
  cls: implementation
program:
  description: 'For each selected head or128-query block compute one mean mu and replace query q_i by
    residual r_i=q_i-mu before the chosen encoder. Compute C[g,j]=dot(mu_g,K_j) once per query group and
    key in FP32 storage, retaining the selected key operand and exact GQA head mapping. The score consumer
    broadcasts C[group(i),j] across all queries of its group and adds the decoded residual dot dot(r_i,K_j)
    before score scaling, bias/mask and softmax. It may seed the score accumulator with C and accumulate
    residual MMA into it, or add C after the residual contraction, provided the admitted arithmetic and
    lifetime contract holds. Do not omit C as if it were a row constant: it varies with key j. Do not
    scale only the residual or normalize the two score terms separately. Native residual quantization
    and finite subtraction change the approximation, so the ideal dot decomposition is not a bitwise equivalence
    claim. A separate key-centering step may remain in the supplied K; restoring this query term alone
    does not restore original-key-frame LSE. Recompute mean/correction for changing operand values and
    predicate padded output rows and key tails independently.'
backward_map: Expand dot(q_i-mu_g,K_j)+dot(mu_g,K_j) to dot(q_i,K_j) in exact arithmetic; the compact
  broadcast changes reuse, while admitted residual/correction rounding defines the selected approximation.
obligations:
- name: score_identity
  statement: Residual and correction recover each original query/key dot before nonlinear normalization.
  method: proof
- name: group_head_mapping
  statement: Every correction row broadcasts to exactly its intended queries and GQA key head, including
    partial blocks and padding.
  method: test
- name: initialization_and_scale
  statement: Correction is added once and not overwritten by MMA initialization; score scaling and masks
    apply to the completed sum.
  method: test
- name: numeric_and_lifetime
  statement: Correction storage avoids unintended narrowing/overflow and matches residual/key generations
    through every consumer.
  method: test
effects:
  transactions: []
  storage:
  - id: compact_score_correction
    level: dram
    scope: kernel
    bytes: 4 * p.batch * p.query_heads * p.correction_rows_per_head * p.key_rows
  - id: query_centers
    level: dram
    scope: kernel
    bytes: p.center_element_bytes * p.batch * p.query_heads * p.correction_rows_per_head * p.features
  overlap: []
scope:
  predicate: p.finite_query_key_center_and_correction_values and p.score_contract_is_dot_plus_declared_bias_mask
    and p.every_query_maps_to_exactly_one_center and p.correction_and_residual_use_same_key_queryhead_kvhead_map_and_generation
    and p.correction_added_once_before_mask_softmax_and_score_scale_applied_to_sum_once and p.mma_accumulation_preserves_seeded_correction
    and p.mean_subtraction_residual_quantization_correction_matmul_and_combined_error_admitted and p.correction_storage_range_and_precision_admitted
    and p.independent_key_center_and_returned_lse_frame_contract_explicit and p.correction_rows_and_scales_publish_before_matching_score_tile_and_retire_before_reuse
    and p.padded_query_and_key_validity_preserved and p.selected_center_scope_residual_encoder_and_correction_broadcast_implemented_and_resources_fit
  text: Forward affine attention scores with explicit query-center correction and an admitted residual
    quantizer. Source SM120/121 NVFP4 head64/128 uses one or128-query-block means, FP32 correction rows
    and a zero-stride shared broadcast before block-scaled QK. It independently centers K. Other mean
    granularities, raw-logit consumers, original-key LSE restoration, backward rules and nonlinear pre-correction
    transforms require separate bindings.
requires: []
probed_on: []
relations: []
signature:
  algorithm: Shared query mean/residual decomposition with compact key-dependent correction rows.
  reuse: Compute mean times K once per head/block and reuse across its query rows while encoding smaller
    query residuals.
  storage: One FP32 score-correction row per head/query group, plus mean vectors; residual code/scales
    belong to the selected encoder.
  boundary: Mandatory key-dependent correction, common group/head identity, accumulator initialization
    and correction precision.
  resources:
  - dram
  - tensor
  - smem
numeric_risk: Quantized residuals plus a higher-precision correction generally differ from quantizing
  original queries. Narrow correction storage can overflow or lose the very shared component being recovered.
summary: When a block of queries shares a large component before low-precision encoding, encode queries
  minus their shared mean and precompute mean times K once for the block. Broadcast that compact correction
  row and combine it with residual QK before softmax. Unlike common key translation, this correction varies
  across keys and cannot be discarded. Keep correction storage, head mapping, scale placement and seeded-MMA
  lifetime explicit.
