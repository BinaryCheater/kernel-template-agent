name: hierarchical_low_float_scaling
version: 1
level_from: 3
level_to: 4
change: vertical
refines: contract
produces:
- map
- contract
object:
  type: nested_decode_scale
  description: When a low-bit group scale has limited dynamic range, encode that group scale relative
    to a coarser amax-derived multiplier and keep the coarse inverse for decoding. Quantize data using
    the rounded stored group scale, not its ideal pre-rounding value. The next consumer must decode the
    same product of local and coarse scales.
effects:
  transactions: []
  storage: []
  overlap: []
requires: []
probed_on: []
relations: []
summary: When a low-bit group scale has limited dynamic range, encode that group scale relative to a coarser
  amax-derived multiplier and keep the coarse inverse for decoding. Quantize data using the rounded stored
  group scale, not its ideal pre-rounding value. The next consumer must decode the same product of local
  and coarse scales.
variables:
- name: group_shape
  kind: structure
  binding: compile
  role: boundary
  domain:
  - vector16
  - square16
  meaning: Requested per-row sixteen-value group or shared sixteen-by-sixteen block.
- name: outer_domain
  kind: structure
  binding: compile
  role: boundary
  domain:
  - tensor
  - row
  meaning: Logical domain of the coarse amax. Row-scaled source is restricted to vector groups and rowwise
    output.
constraints:
- id: c_groups
  expr: p.cols % 16 == 0 and (group_shape != 'square16' or p.rows % 16 == 0)
  meaning: Pinned groups are complete.
  cls: semantic
- id: c_row
  expr: outer_domain != 'row' or (group_shape == 'vector16' and p.rowwise_output_only)
  meaning: Pinned row-scaled variant has no square groups or columnwise output.
  cls: semantic
preconditions:
- id: pre_format
  expr: p.nvfp4_e2m1_e4m3_recipe_requested and p.outer_amax_matches_domain and p.group_membership_exact
  meaning: The requested E2M1/E4M3 representation, coarse maximum and local groups are bound to the same
    logical values.
  cls: semantic
- id: pre_range
  expr: p.outer_amax_positive_finite and p.values_finite and p.stored_group_scales_positive_finite and
    p.scale_arithmetic_admitted
  meaning: This first version admits only positive finite coarse/local scales and admitted arithmetic.
  cls: implementation
- id: pre_pair
  expr: p.codes_scales_and_outer_inverse_paired and p.native_pack_and_consumer_match
  meaning: Code packing, stored group scales and the coarse inverse have matching ownership and decoder
    semantics.
  cls: implementation
program:
  description: For a coarse-domain maximum M>0 choose global encode multiplier S_enc=min((448*6)/M, FP32_max)
    and S_dec=1/S_enc under the pinned arithmetic. For local absmax a form stored E4M3 scale s=cast_E4M3(a*(S_enc/6)).
    Quantize each local input with E2M1 code q=cast_E2M1(x/(float(s)*S_dec)), preserving the declared
    conversion and rounding sequence. The decoder returns float(q)*float(s)*S_dec. A vector16 group uses
    sixteen same-row values; square16 shares one absmax over its 256 values. Row-domain and tensor-domain
    M may differ; each orientation of a bidirectional quantizer requires its own declared groups and matching
    scale metadata. Zero groups, alternative scale types and error-selected map4/map6 use additional policies
    outside this version.
backward_map: Decode code q with the stored local scale and coarse inverse; this recovers the requested
  hierarchical quantized value, not the original unquantized real input.
obligations:
- name: nested_decoder
  statement: The consumer uses q*s*S_dec and encoding used the same rounded s and S_dec.
  method: proof
- name: groups
  statement: Every code and scale belongs to the intended coarse domain and local vector/block.
  method: test
- name: native_rounding
  statement: Scale casts, reciprocal and packed E2M1 conversion implement the requested numerical recipe.
  method: test
scope:
  predicate: p.cols % 16 == 0 and (group_shape != 'square16' or p.rows % 16 == 0) and (outer_domain !=
    'row' or (group_shape == 'vector16' and p.rowwise_output_only)) and p.nvfp4_e2m1_e4m3_recipe_requested
    and p.outer_amax_matches_domain and p.group_membership_exact and p.outer_amax_positive_finite and
    p.values_finite and p.stored_group_scales_positive_finite and p.scale_arithmetic_admitted and p.codes_scales_and_outer_inverse_paired
    and p.native_pack_and_consumer_match
  text: Complete vector16 or square16 NVFP4 groups, E2M1 codes and E4M3 local scales, coarse range factor
    448*6. Source common/cast/nvfp4/core_nvfp4.cuh and quantize_transpose_nvfp4.cuh implement the paired
    two-level format. Zero/underflow scale policies, UE5M3 scales, reserved scale headroom 256, stochastic
    stream equivalence and map4/map6 error selection require distinct bindings. Native path is SM100-family
    gated; no execution is claimed.
signature:
  algorithm: Normalize local low-float scale codes by a coarse-domain multiplier.
  storage: Packed E2M1 values, one E4M3 scale per local group and a coarse FP32 inverse.
  boundary: Rounded local scale and coarse inverse must remain paired across orientation/layout changes.
  resources:
  - dram
  - registers
numeric_risk: Moving coarse normalization across the E4M3 scale cast or using an unrounded local scale
  changes the quantizer. Groupwise and tensorwise maxima are not interchangeable.
