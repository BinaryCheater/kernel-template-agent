name: rebind_transfer_descriptors
version: 1
level_from: 5
level_to: 6
change: vertical
refines: transfer
produces: [transfer, store, sync]
object:
  type: per_worker_descriptor_generation
  description: A private published transfer-descriptor tuple is rebound from fixed transfer templates to the current problem's base addresses, extents and strides.
variables:
  - {name: descriptor_count, kind: numeric, binding: compile, role: boundary, domain: {lo: 1, hi: 5}, meaning: "Descriptors owned by one publisher tuple; source SM100 input tuple4, SM103 AB/SF tuples2, output tuple1."}
constraints:
  - {id: c_tuple, expr: "descriptor_count == p.publisher_tuple_size and p.descriptor_layouts_legal", meaning: Every selected descriptor has valid rank/alignment/layout and the tuple covers the publisher's transfers., cls: implementation}
preconditions:
  - {id: pre_key, expr: "p.problem_key_metadata_immutable and p.fixed_transfer_fields_compatible", meaning: Equal problem keys imply unchanged metadata; data format and fixed transfer layout remain compatible with the templates., cls: semantic}
  - {id: pre_lifetime, expr: "p.descriptor_slots_exclusive and p.old_descriptor_readers_retired", meaning: A publisher owns its slots and cannot overwrite a generation still consumed by an older transfer., cls: semantic}
  - {id: pre_publication, expr: "p.release_publish_supported and p.consumer_acquire_before_use", meaning: The selected backend publishes complete descriptor generations and readers acquire the current generation before issue., cls: implementation}
program:
  description: >-
    Initialize private shared descriptor shadows from fixed transfer atoms. For a
    consumed tuple whose problem key differs from the publisher's cached key,
    construct tensors with that problem's base addresses/extents/strides and update
    the shared shadows. Retire all users of the old published generation before
    publishing new shadows into the publisher's global descriptor slots with the
    required release operation. Readers acquire every descriptor they will use
    before issuing the new tuple's transfers. Cache the new problem key. Reusing
    the same immutable key skips updates. A skipped input transfer does not imply
    that an output descriptor can be skipped, including K0 output work.
backward_map: Replace each use of a mutable descriptor generation by an immutable descriptor built for the exact problem metadata of that transfer.
obligations:
  - {name: coordinate_identity, statement: Each issued descriptor maps transfer coordinates to the current problem's intended address and bounds without mixing tuple generations., method: test}
  - {name: descriptor_lifetime, statement: No published descriptor generation is mutated while any earlier transfer can still consume it., method: test}
  - {name: publication, statement: Shadow fields are complete before release publication and every issuing reader acquires the current generation., method: test}
  - {name: skip_key, statement: An update is skipped only when the metadata of the consumed tuple is unchanged; input-zero-work and output ownership are distinguished., method: exhaustive}
effects:
  transactions: []
  storage:
    - {id: descriptor_shadow, level: smem, scope: cta, bytes: "descriptor_count * p.descriptor_bytes"}
    - {id: descriptor_published, level: gmem, scope: cta, bytes: "descriptor_count * p.descriptor_bytes"}
  overlap: []
scope:
  predicate: "p.descriptor_layouts_legal and p.problem_key_metadata_immutable and p.fixed_transfer_fields_compatible and p.descriptor_slots_exclusive and p.old_descriptor_readers_retired and p.release_publish_supported and p.consumer_acquire_before_use"
  text: >-
    Per-worker mutable descriptor tuples with shared shadows and release-published
    global slots while fixed transfer instructions/layouts are reused across problems.
    Pinned grouped kernels use128-byte TMA descriptors and five total per-CTA slots
    divided among independent input/output publishers. The source helper's direct-
    global update branch is not this shared-staging implementation. Different rank,
    format, field mutation, shared slot ownership or proxy/lifetime semantics needs
    an explicit variant or newly verified binding. Descriptor traffic/latency is unpriced.
requires: []
probed_on: []
relations: []
signature:
  algorithm: Cache a problem key and publish matching private descriptor generations before their transfers.
  storage: Shared shadows plus private global descriptor slots.
  boundary: Does not authorize in-place mutation with live readers or changing fixed transfer format/layout.
  resources: [smem, gmem, issue]
numeric_risk: Address/metadata refinement only; tensor values and bounds must remain those of the current problem.
summary: >-
  When a persistent transfer keeps its tile format but switches problem addresses, shapes or strides, consider rebinding a private descriptor tuple instead of creating another kernel. Preserve the current problem's coordinate mapping and retire old descriptor readers before release publication and reader acquire; bind descriptor_count to the actual publisher tuple. The pinned SMEM-shadow TMA path supports input tuples4 or2 and output tuple1 with128-byte descriptors; K0 still requires its output descriptor, and other mutation/proxy protocols need a variant.
