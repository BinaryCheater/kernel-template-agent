name: online_group_work_decode
version: 2
level_from: 4
level_to: 5
change: vertical
refines: work_assign
produces:
- work_assign
- map
object:
  type: monotone_group_prefix_cursor
  description: A worker inverts cumulative per-group work counts online and retains its matched prefix
    while its queried work indices increase.
variables:
- name: search
  kind: structure
  binding: compile
  role: software
  domain:
  - warp_prefix_32
  - scalar_forward
  meaning: Choose32-lane prefix windows or a scalar forward scan; the latter retains only group/start/end.
- name: cache_shapes
  kind: structure
  binding: compile
  role: software
  domain:
  - false
  - true
  meaning: Keep two per-lane windows of problem-shape tuples or load shapes on demand; prefix cursor state
    is retained in both paths.
constraints:
- id: c_counts
  expr: p.counts_nonnegative and p.count_table_complete and p.prefix_fits_int32
  meaning: Counts describe every group and their cumulative total fits the pinned32-bit arithmetic.
  cls: implementation
- id: c_cache
  expr: search == 'warp_prefix_32' or not cache_shapes
  meaning: The scalar implementation has no two-window per-lane shape cache.
  cls: implementation
preconditions:
- id: pre_order
  expr: p.query_indices_nonnegative and p.queries_monotone
  meaning: Each worker's new linear work index never moves behind its retained prefix.
  cls: semantic
- id: pre_metadata
  expr: p.problem_metadata_immutable
  meaning: Counts and cached shapes stay valid throughout the worker's queries.
  cls: semantic
program:
  description: Retain the matched group and cumulative start/end. If the new nonnegative monotone query
    lies inside the interval, reuse it. Otherwise advance until an end exceeds the query or all groups
    are exhausted. With search=warp_prefix_32, scan32-lane windows padded with zero counts and optionally
    retain the two shape windows exactly as version1. With search=scalar_forward, inspect one count at
    a time, adding it to the end and updating the start; skip zero-count groups and return invalid after
    the last group. A scalar initialization must avoid reading group0 when the group count is zero. Invalid
    queries never consume group metadata. Physical tile decode and per-group count construction remain
    separate.
backward_map: Enumerate all groups' work units in input order; each valid linear index returns the group
  and offset at that position in the concatenation.
obligations:
- name: inverse_prefix
  statement: Every valid query has exactly one owning half-open group interval and the correct local offset
    even with zero-count groups.
  method: exhaustive
- name: cache_identity
  statement: Retained prefix and optional shape-cache entries refer to the same immutable group metadata
    as an independent full search.
  method: test
- name: bounds
  statement: Invalid lanes and queries do not read or publish nonexistent group metadata; every window
    advance makes progress through zero-count groups.
  method: test
effects:
  transactions: []
  storage:
  - id: cached_shapes
    level: reg
    scope: thread
    bytes: 2 * p.shape_bytes
    when: cache_shapes
    note: Logical two-tuple payload; physical register allocation/spilling is unmeasured.
  overlap: []
scope:
  predicate: p.counts_nonnegative and p.count_table_complete and p.prefix_fits_int32 and p.query_indices_nonnegative
    and p.queries_monotone and p.problem_metadata_immutable
  text: Version1 warp32 mapping is preserved by search=warp_prefix_32. scalar_forward supports immutable
    finite count tables and nonnegative monotone queries, without shape-window caching. The MoE instance
    computes expert cluster counts lazily, with a nonempty expert table because its source initializes
    group0 unconditionally. Forward zero-token experts have zero output work; backward zero-token experts
    retain fixed output work with K0. Physical coordinates, short-axis traversal, descriptor publication
    and reduction identity are separate obligations.
requires: []
probed_on: []
relations: []
signature:
  algorithm: Stateful inverse prefix with warp32 windows or scalar forward traversal.
  storage: Prefix cursor and optional per-lane two-window shape cache.
  boundary: Does not support backwards queries with retained cursor or mutable metadata.
  resources:
  - reg
  - issue
numeric_risk: No arithmetic-value change; counts and work ownership must remain exact.
summary: When persistent workers query increasing indices across variable-size problems, consider retaining
  an inverse-prefix cursor instead of materializing per-tile work descriptors. Choose warp_prefix_32 for
  the old lane-window mapping, optionally with shape caching, or scalar_forward for one-count-at-a-time
  traversal. Counts and metadata must be immutable, prefixes must fit Int32, and queries cannot move backwards.
  The MoE scalar instance skips zero-output forward experts but retains backward K0 output tiles; it requires
  at least one expert because source initialization reads count0.
