  "program": {
    "description": "Flatten lane/rank/block/warp into disjoint global coordinate owners. Each owner loads its own coordinate and then cycles through all other peer inputs once; cast to declared accumulation type, reduce, finalize once, cast result. AllReduce writes same completed value to corresponding output at every rank; ReduceScatter writes only the declared local owner output, and AllGather is the replication-only specialization. Split aligned packed interior from scalar prefix/suffix without overlap. Optional async peer-to-shared loads wait transaction barriers before reduction; shared-to-peer stores wait source-read completion before scratch reuse, with closing peer barrier providing publication/retirement."
  },
  "backward_map": "Erase auxiliary organization and recover the visible results under the stated contract.",
  "obligations": [
    {
      "name": "cover",
      "statement": "Every owned coordinate reads each peer exactly once; all coordinates have one owner.",
      "method": "proof"
    },
    {
      "name": "consumers",
      "statement": "Completed value is stored once to every declared consumer, without overwriting an unread input.",
      "method": "proof"
    },
    {
      "name": "numeric",
      "statement": "Accumulator type, casts and peer reduction order match selected numerical contract; changing backend need not be bitwise equal.",
      "method": "proof"
    }
  ],
