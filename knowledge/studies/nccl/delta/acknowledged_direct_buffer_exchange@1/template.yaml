  "program": {
    "description": "Provider waits until exchange slot is null, computes endpoint in peer address space, and publishes nonnull pointer. Acceptor waits nonnull, captures pointer, clears slot to null acknowledging descriptor consumption. Use direct write to receiver output or direct read from sender input/completed output according to matched mode. Registered predetermined mappings may bypass pointer exchange. Preserve payload ready/consumed counters and provider buffer lifetime until actual peer completion, independently of descriptor-slot acknowledgment."
  },
  "backward_map": "Erase auxiliary organization and recover the visible results under the stated contract.",
  "obligations": [
    {
      "name": "descriptor",
      "statement": "One provider value is consumed once before overwrite; matched roles select the same semantic buffer and offset.",
      "method": "proof"
    },
    {
      "name": "lifetime",
      "statement": "Clearing exchange slot only frees descriptor slot, not payload; direct read waits peer retirement before source reuse.",
      "method": "proof"
    },
    {
      "name": "participation",
      "statement": "Constructors of both peers participate even when individual operations select a buffered path.",
      "method": "proof"
    }
  ],
