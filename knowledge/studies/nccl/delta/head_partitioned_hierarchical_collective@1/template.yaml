  "program": {
    "description": "For each loop stripe assign (channel,head) a disjoint chunk. Scatter source contribution to its head; head reduces all local rank inputs. Network offload or an inter-head tree combines one partial per local group. Returned completed value is finalized by the declared unique post-op owner then broadcast/gathered locally. Bind chunk address permutation consistently: ordinary ((channel*heads)+head)*chunk or registered ((head*channels)+channel)*chunk. Run scatter/reduce/return/gather in disjoint barrier groups; registered direct buffers may replace copies with notifications, preserving protocol steps and buffer lifetime."
  },
  "backward_map": "Erase auxiliary organization and recover the visible results under the stated contract.",
  "obligations": [
    {
      "name": "hierarchical_partition",
      "statement": "Local subgroups cover contributors once, and head stripes cover each output once.",
      "method": "proof"
    },
    {
      "name": "permutation",
      "statement": "Both address layouts are bijections on valid channel/head pairs and every stage uses the same selected map.",
      "method": "proof"
    },
    {
      "name": "completion",
      "statement": "Final post-op occurs once after cross-group reduction; notification and receive completion precede use.",
      "method": "proof"
    }
  ],
