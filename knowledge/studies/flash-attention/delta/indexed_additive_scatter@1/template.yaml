name: indexed_additive_scatter
version: 1
level_from: 4
level_to: 5
change: vertical
refines: reduce
produces: [access, reduce, sync]
object:
  type: collision_preserving_indexed_accumulation
  description: Add each valid logical row contribution to its runtime-indexed destination with elementwise FP32 atomics, retaining duplicate-index multiplicity.
variables:
  - {name: vector_width, kind: structure, binding: compile, role: software, domain: [scalar, four_elements], meaning: Scalar FP32 adds or a supported four-element vector add with per-element atomicity.}
constraints: []
preconditions:
  - {id: pre_map, expr: "p.immutable_row_index_map and p.invalid_rows_predicated_before_destination_access and p.valid_indices_within_logical_and_allocation_bounds", meaning: "Each contribution retains its original index; invalid slots are skipped before pointer access and every remaining index is valid for its sequence/view.", cls: semantic}
  - {id: pre_contributors, expr: "p.each_logical_contribution_owned_once and p.duplicate_indices_retain_all_contributions and p.output_initial_state_defined_once", meaning: "Each logical contribution is issued once even when destinations collide; output starts at the specified existing value or zero, initialized once for the full accumulation.", cls: semantic}
  - {id: pre_atomic, expr: "p.atomic_fp32_add_supported and p.atomic_addresses_and_vector_lanes_valid and p.no_nonatomic_competing_writers", meaning: "Selected atomic width and alignment are legal for every lane; overlapping destination updates all use compatible atomics.", cls: implementation}
  - {id: pre_completion, expr: "p.all_contributors_complete_before_consumer_or_reset and p.unordered_fp32_addition_admitted and p.finite_contributions_and_accumulation_range_admitted", meaning: "Consumers/reset wait for all adds, and the numerical policy admits the actual finite FP32 additions and nondeterministic interleaving.", cls: implementation}
program:
  description: >-
    For logical source row s, runtime index I[s], and feature d, implement
    Y[k,d]=Y_initial[k,d]+sum_{s: valid(s) and I[s]=k} X[s,d]. Load the immutable
    index with its source-row identity. Predicate invalid rows before forming or
    dereferencing a destination address. Each valid source/feature owner issues
    atomic_add_f32(Y[I[s],d],X[s,d]). A four-element implementation groups four
    legal adjacent features without assuming a vector-wide atomic transaction.
    Duplicate indices issue all their separate contributions, including across
    CTAs, tokens and chunks. Initialize the destination once, not per producer
    or chunk; preserve a caller-supplied accumulator when accumulation is in-place.
    Publish completion only after every contributor finishes. No deterministic
    reduction order or gradients through the discrete index choice are introduced.
backward_map: Group the completed atomic additions by destination coordinate and recover the original indexed sum with exactly the same contribution multiplicities and admitted floating-point order.
obligations:
  - {name: mapping_and_multiplicity, statement: "Every valid source/feature contributes once to the intended destination; duplicates all contribute and invalid indices cause no destination access.", method: test}
  - {name: atomic_lowering, statement: "Selected scalar/vector atomic lowering, alignment, lane bounds and memory scope prevent lost updates.", method: test}
  - {name: initialization_and_completion, statement: "One defined initial state precedes every add, and every final reader/reset follows all contributors across chunks and CTAs.", method: test}
  - {name: numeric_order, statement: "The actual finite FP32 accumulation and unordered contributor order satisfy the caller's numerical policy.", method: test}
effects: {transactions: [], storage: [], overlap: []}
scope:
  predicate: "p.immutable_row_index_map and p.invalid_rows_predicated_before_destination_access and p.valid_indices_within_logical_and_allocation_bounds and p.each_logical_contribution_owned_once and p.duplicate_indices_retain_all_contributions and p.output_initial_state_defined_once and p.atomic_fp32_add_supported and p.atomic_addresses_and_vector_lanes_valid and p.no_nonatomic_competing_writers and p.all_contributors_complete_before_consumer_or_reset and p.unordered_fp32_addition_admitted and p.finite_contributions_and_accumulation_range_admitted"
  text: >-
    FP32 additive scatter through a runtime row index, with scalar or supported
    four-element native adds. Source sparse MLA accumulates dK/dV into existing
    FP32 buffers. Invalid sentinels and shortened sequence views need explicit
    guards or a proven caller bound. Native atomic costs are unpriced. Assignment
    scatter, unique-only deduplication, deterministic reductions and vector-wide
    snapshot consistency are outside this version.
requires: []
probed_on: []
relations: []
signature:
  algorithm: Scatter each logical contribution through its original index and atomically add at collisions.
  reuse: All contributors share one indexed destination accumulator without storing separate full-size partial outputs.
  storage: Destination accumulator and retained immutable indices; contention depends on index distribution.
  boundary: Duplicate multiplicity, invalid index guards, one initialization and complete atomic accumulation.
  resources: [dram, l2]
numeric_risk: Atomicity prevents lost updates but does not fix FP32 addition order; colliding contributions can round differently across executions.
summary: >-
  When gathered rows generate gradients for their original storage, scatter-add
  through the same indices and retain every duplicate contribution. For indices
  [2,0,2,-1], source rows0 and2 both add to destination2; the sentinel does not
  access memory. Initialize once across all chunks, guard the current logical
  extent, and wait for all adds before consumption. A read-side gather or
  disjoint peer-shard reduction cannot supply this collision contract.
