name: vocabulary_partitioned_loss
version: 1
level_from: 2
level_to: 3
change: vertical
refines: reduce
produces: [reduce, map, sync]
object:
  type: partitioned_logit_loss_statistics
  description: Compute cross entropy over disjoint vocabulary shards by merging local log-normalizers and additive target/smoothing terms rather than gathering full logits.
variables: []
constraints: []
preconditions:
  - {id: pre_shards, expr: "p.vocabulary_shards_disjoint_complete_and_nonempty and p.global_class_count_and_target_identity_match and p.each_nonignored_target_has_one_owner", meaning: "Every class belongs to one shard and every nonignored target has exactly one owner; global class count and row identities agree.", cls: semantic}
  - {id: pre_scores, expr: "p.finite_scaled_logits_and_positive_finite_mass and p.score_scale_positive_and_same_across_shards and p.smoothing_and_zloss_parameters_match", meaning: "Use the same positive score scale, smoothing epsilon and squared-LSE coefficient on every shard, with finite logits/mass.", cls: semantic}
  - {id: pre_statistics, expr: "p.local_statistics_cover_actual_shard and p.collective_row_rank_maps_and_visibility_valid and p.global_normalizer_added_once", meaning: "Local or precomputed LSE covers only the actual shard; collectives preserve row/rank identity, and the final global LSE/z-loss contribution has one logical addition per output.", cls: implementation}
  - {id: pre_gradient, expr: "p.backward_uses_final_global_lse_and_original_local_logits and p.ignored_rows_zero_loss_and_gradient and p.local_gradient_output_ownership_valid", meaning: "Backward consumes the final global checkpoint and owns disjoint local logit gradients, with ignored rows zeroed.", cls: semantic}
  - {id: pre_numeric, expr: "p.logsumexp_collective_reduction_and_gradient_casts_admitted", meaning: "Local exponential statistics, scalar collectives and gradient conversion satisfy the numerical contract.", cls: implementation}
program:
  description: >-
    For scaled logits z=a*x, class count C, smoothing epsilon, label y and
    squared-LSE coefficient lambda, shard r computes local L_r=logsumexp(z_r)
    and A_r=-(epsilon/C)*sum(z_r)-(1-epsilon)*z_y if it owns y, retaining only
    the smoothing term otherwise. Merge L=logsumexp_r(L_r) and A=sum_r(A_r).
    Final row loss is L+A+lambda*L*L; add L and its squared penalty once,
    not once per shard. Ignore-index rows produce loss and gradient zero.
    Save final global L for backward. Each shard reconstructs P_c=exp(z_c-L)
    and writes g*a*((1+2*lambda*L)*P_c-epsilon/C-(1-epsilon)*[c=y]) for its
    owned classes. Local class indices are rebased to global labels using the
    immutable shard start/map. Only row scalars need communication; logits stay
    sharded. Any separate z-loss diagnostic is not an extra differentiable loss
    output unless the caller explicitly defines that contract.
backward_map: Concatenate disjoint class shards and expand the local additive terms; nested logsumexp equals full-vocabulary logsumexp, recovering the same smoothed cross entropy, squared-LSE penalty and local gradient slices.
obligations:
  - {name: shard_statistics, statement: "Class shards form the complete vocabulary once, each local statistic uses that shard, and the target contributes at exactly its owning shard.", method: proof}
  - {name: global_loss_and_checkpoint, statement: "Collectives combine matching row scalars and add the final global normalizer and z-loss once, publishing global L before backward.", method: test}
  - {name: gradient_and_ignore, statement: "Each local output equals its full-vocabulary gradient slice with complete smoothing/scale/z-loss terms and zero ignored rows.", method: test}
  - {name: numeric_collectives, statement: "Actual local reductions, collective precision/order and gradient casts meet the numerical policy.", method: test}
effects: {transactions: [], storage: [], overlap: []}
scope:
  predicate: "p.vocabulary_shards_disjoint_complete_and_nonempty and p.global_class_count_and_target_identity_match and p.each_nonignored_target_has_one_owner and p.finite_scaled_logits_and_positive_finite_mass and p.score_scale_positive_and_same_across_shards and p.smoothing_and_zloss_parameters_match and p.local_statistics_cover_actual_shard and p.collective_row_rank_maps_and_visibility_valid and p.global_normalizer_added_once and p.backward_uses_final_global_lse_and_original_local_logits and p.ignored_rows_zero_loss_and_gradient and p.local_gradient_output_ownership_valid and p.logsumexp_collective_reduction_and_gradient_casts_admitted"
  text: >-
    Fixed complete vocabulary partitions and finite row normalization, including
    label smoothing and squared natural-LSE penalty. Source uses equal contiguous
    shards C=world_size*local_columns, gathers local LSE scalars and sums additive
    losses. Unequal/noncontiguous shards need explicit map/count bindings. Empty
    shards, invalid nonignored labels, global-LSE-as-local substitution and changing
    distributed ownership during backward are outside this version.
requires: []
probed_on: []
relations: []
signature:
  algorithm: Combine local log-normalizers and additive target/smoothing terms, then differentiate each disjoint vocabulary slice using the final global normalizer.
  reuse: One final row LSE serves all local class-gradient blocks without gathering logits.
  storage: Local logits plus row scalar statistics; communication is per row/shard rather than per class logit.
  boundary: Exact target owner, full class count, one global term and matching global checkpoint.
  resources: [dram, network, sfu]
numeric_risk: Logsumexp nesting and collective order change rounding; using a local normalizer in backward or duplicating an already global LSE changes the mathematical probabilities.
summary: >-
  When class logits are distributed by vocabulary, keep them sharded and
  communicate only each row's local log-normalizer and additive target/smoothing
  contribution. Merge log-normalizers with logsumexp, sum additive terms, then
  add the global normalizer and squared-LSE penalty once. Save that global LSE
  for every local backward slice; the target term belongs to exactly one shard.
