  algorithm: When a depthwise causal stencil is evaluated across invocations, keep
    its last W-1 inputs as explicit state instead of rereading the complete prefix;
    a ring buffer avoids shifting retained history.
  boundary: "Depthwise NVIDIA causal convolution widths2\u20134 with linear or circular\
