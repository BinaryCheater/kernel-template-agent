name: causal_window_state
version: 1
level_from: 3
level_to: 4
change: vertical
refines: map
produces:
- map
- store
object:
  type: causal_window_state
  description: When a depthwise causal stencil is evaluated across invocations, keep
    its last W-1 inputs as explicit state instead of rereading the complete prefix;
    a ring buffer avoids shifting retained history.
variables:
- name: width
  kind: numeric
  binding: compile
  role: software
  domain:
    lo: 2
    hi: 4
  meaning: 'W: workload stencil width; pinned compiled menu2/3/4.'
- name: history_capacity
  kind: numeric
  binding: compile
  role: software
  domain:
    lo: 1
    hi: 2147483647
  meaning: 'H: caller-selected state length, at least W-1.'
constraints:
- id: c0
  expr: history_capacity >= width - 1
  meaning: State can recover the entire left halo.
  cls: implementation
preconditions:
- id: pre0
  expr: p.history_matches_logical_prefix and p.unique_state_row_channel_writer and
    p.position_nonnegative and p.state_addresses_valid and p.rounding_admitted
  meaning: History/position agree, independent writers, valid allocation and admitted
    arithmetic.
  cls: semantic
program:
  description: For each owned (state_row,channel), recover W-1 prior samples in chronological
    order. A ring of length H stores logical position q at q mod H, with caller-supplied
    next position p. Read positions p-W+1 through p-1 before overwriting any slot.
    For each new x_i write it at (p+i) mod H, append it to the register window, emit
    bias+sum_j weight[j]*window[j] for j0..W-1, optionally SiLU and cast, then shift
    the register window by one. Expose next position p+advance to the caller; this
    source consumes cache_seqlens but does not increment them. Linear state is an
    alternative layout containing the trailing H samples in chronological order. Initialize
    missing history to declared zeros or supplied initial samples; never infer it
    from uninitialized state.
backward_map: "Depthwise NVIDIA causal convolution widths2\u20134 with linear or circular\
  \ per-channel state. This is a boundary-state realization of the same full-sequence\
  \ stencil, not a different convolution or a commutative reduction over time."
obligations:
- name: window
  statement: Before output i the register window contains exactly x[p+i-W+1..p+i].
  method: proof
- name: state_commit
  statement: After the call the ring decodes the trailing H samples at next position
    p+advance, including wraparound.
  method: proof
- name: ownership
  statement: State row indirection must not cause concurrent writers to the same channel.
  method: proof
effects:
  transactions: []
  storage: []
  overlap: []
scope:
  predicate: (history_capacity >= width - 1) and (p.history_matches_logical_prefix
    and p.unique_state_row_channel_writer and p.position_nonnegative and p.state_addresses_valid
    and p.rounding_admitted)
  text: "Depthwise NVIDIA causal convolution widths2\u20134 with linear or circular\
