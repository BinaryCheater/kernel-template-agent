  "program": {
    "description": "Initialize a CTA-private register array to zero, synchronize, apply each assigned item update as local atomic max, synchronize, then cooperatively atomic-max every local register into the corresponding global register. If shared allocation/reservation is unavailable, process items with direct global max instead. Vectorized item reads use exactly one tail owner to avoid omissions; repeated items do not change idempotent max semantics."
  },
