    {
      "name": "phase_lifetime",
      "statement": "Private initialization precedes updates and merge reads follow all updates.",
      "method": "proof"
    },
    {
      "name": "tail_cover",
      "statement": "Vector groups and scalar remainder cover the item domain without missing a remainder.",
      "method": "proof"
    },
    {
      "name": "resources",
