    "text": "NVIDIA HLL add_if shared/global kernels. CCCL privatized_bin_accumulation@1 counts+1 and sums private counters; it cannot encode max-register flush unchanged. This rule preserves register state and does not introduce a cardinality accuracy claim. Resource effects: Shared summary per CTA plus one global merge per register can reduce global contention but adds full-array clear/flush work; benefit depends on input volume, precision and resident block count."
