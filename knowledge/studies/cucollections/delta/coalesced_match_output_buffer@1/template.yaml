    "text": "NVIDIA open-addressing multimap/multiset retrieve_if/retrieve paths. Exact membership is separate from output reservation; insufficient caller output capacity has undefined source behavior and is excluded. Resource effects: Shared capacity=(buffer_multiplier*32*bucket_size)+32 records per warp; one global counter reservation per flush replaces one reservation per match, at cost of buffering and synchronization."
  },
