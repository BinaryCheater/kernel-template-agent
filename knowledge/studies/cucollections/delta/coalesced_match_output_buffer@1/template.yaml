  "program": {
    "description": "Each probing subgroup ballots matching slots, counts matches per bucket, reserves a shared-buffer interval and writes (probe_key,matched_slot) pairs at ballot-prefix offsets. All probing subgroups in a flushing warp share a counter/buffer. Before another probe step can exceed capacity, synchronize, atomically reserve count global records once, broadcast base and cooperatively copy the buffered pairs. Reset shared count only after flush reads finish; flush the final remainder. Output order is unspecified unless a later ordering stage establishes it."
  },
  "backward_map": "Erase auxiliary organization and recover the visible results under the stated contract.",
  "obligations": [
    {
      "name": "multiplicity",
      "statement": "Every matching slot yields one paired record per logical probe, including duplicate input keys.",
      "method": "proof"
    },
    {
      "name": "local_capacity",
      "statement": "Preflush threshold leaves room for an all-match next probe step.",
      "method": "proof"
    },
    {
      "name": "output_ownership",
      "statement": "Each flush owns a disjoint global interval, and probe/match arrays use exactly the same offset.",
      "method": "proof"
    },
    {
      "name": "lifetime",
      "statement": "Flush sees completed shared records and reset follows all reads.",
      "method": "proof"
    }
  ],
