    "text": "NVIDIA GMM full covariance M-step. Source denominator is N_k+10*epsilon, so that exact regularized convention must be retained; no unregularized normalization or equivalence to diagonal raw moments implied. Resource effects: Materializes batch_rows*dim centered scratch per component and contracts dim*dim Gram outputs; often reuses matrix multiplication infrastructure, with additional pass over samples after means finish."
  },
