  "program": {
    "description": "For each component k and sample i form Y[i,d]=sqrt(weight[i,k])*(X[i,d]-mean[k,d]). Accumulate C[k]=sum_batches transpose(Y)*Y, using beta0 first then beta1 for subsequent batches. Divide by the explicit denominator, mirror one authoritative triangle and add reg_covar to diagonal. Means and responsibilities are fixed across the centered accumulation pass. Raw second moment minus mean outer product is a separate numerical algorithm, not substituted without its own denominator/rounding argument."
  },
  "backward_map": "Erase auxiliary organization and recover the visible results under the stated contract.",
  "obligations": [
    {
      "name": "weighted_product",
      "statement": "Each Gram term equals the specified weighted centered outer product under admitted sqrt/multiply rounding.",
      "method": "proof"
    },
    {
      "name": "batch_accumulation",
      "statement": "Each sample contributes once and first/subsequent beta settings preserve all batches.",
      "method": "proof"
    },
    {
      "name": "center_lifetime",
      "statement": "All batches use the same finalized means and weight generation.",
      "method": "proof"
    },
    {
      "name": "symmetry",
      "statement": "Triangle mirroring has unique writers and regularization is added once per diagonal.",
      "method": "proof"
    }
  ],
  "effects": {
    "transactions": [],
