  "program": {
    "description": "Set qmin=-128,qmax=127. For max>min let s=(qmax-qmin)/(max-min), o=qmin-min*s; for equal endpoints set s=1,o=qmin-min. Encode x<=min as qmin, x>=max as qmax, otherwise lroundf(s*x+o) then signed int8 cast. Decode (q-o)/s. Endpoint branches take precedence, including the equal-endpoint case. Calibration may estimate endpoints from fixed-seed sorted row samples and quantile positions, but that policy is separate from this conversion."
  },
  "backward_map": "Erase auxiliary organization and recover the visible results under the stated contract.",
  "obligations": [
    {
      "name": "rounding",
      "statement": "Interior half values follow away-from-zero integer rounding, not nearest-even or truncation.",
      "method": "proof"
    },
    {
      "name": "saturation",
      "statement": "Endpoint branches prevent out-of-range integer conversion and preserve equality precedence.",
      "method": "proof"
    },
    {
      "name": "metadata",
      "statement": "Encoding and inverse use the same finite affine scale/offset and dtype conventions.",
      "method": "proof"
    },
    {
      "name": "degenerate",
      "statement": "Equal endpoints follow explicit two-endpoint step behavior rather than divide by zero.",
      "method": "proof"
    }
  ],
