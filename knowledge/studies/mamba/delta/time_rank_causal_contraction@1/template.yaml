  description: "When each time step has multiple input/output rank channels, flatten\
    \ time\xD7rank for GEMM but apply causality by time quotient and compute the same-time\
    \ rank block under its own coefficient."
variables:
- name: rank_channels
  kind: numeric
  binding: compile
