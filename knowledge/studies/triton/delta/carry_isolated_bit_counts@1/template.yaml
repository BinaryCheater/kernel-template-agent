name: carry_isolated_bit_counts
version: 1
level_from: 2
level_to: 3
change: vertical
refines: reduce
produces:
- reduce
- store
- sync
object:
  type: carry_isolated_bit_counts
  description: Packed boolean columns are summed in progressively wider carry-isolated
    fields.
variables:
- name: rows_per_tile
  kind: numeric
  binding: compile
  role: software
  domain:
    lo: 1
    hi: 65536
  meaning: Supported power-of-two reduction length with source split factors dividing
    it.
constraints: []
preconditions:
- id: pre0
  expr: p.uint32_boolean_words and p.rows_split_into_exact_stages
  meaning: Each input word holds32 independent boolean columns and source stage factors
    partition all rows.
  cls: semantic
- id: pre1
  expr: p.stage_counts_fit_fields and p.final_integer_counts_do_not_overflow
  meaning: First counts<=8 fit4 bits, second counts<=128 fit8 bits, final counts fit
    their integer destination.
  cls: semantic
program:
  description: 'Let a1=min(8,N), a2=min(16,N/a1), a3=N/(a1*a2), requiring integral
    source stages. For each phase s=0..3 extract (word>>s)&0x11111111 and sum groups
    of a1 words: each4-bit field holds one column count without carry. Split those
    counts into phases t=0,1 by (packed>>(4*t))&0x0f0f0f0f; sum a2 groups into8-bit
    fields. Split by byte phase u=0..3 using (packed>>(8*u))&255 and sum remaining
    a3 groups into ordinary32-bit counters. Restore original column order by flattening
    [u,t,s], so column index is8*u+4*t+s. Store tile partial counts and optionally
    atomically add disjoint tile totals into a fresh zero-initialized final array.'
backward_map: Expand each packed field count into the sum of its original input bits,
  one independent reduction per column.
obligations:
- name: no_field_carry
  statement: Every packed intermediate count stays strictly below the next field radix
    and cannot affect an adjacent column.
  method: proof
- name: column_identity
  statement: Flattened phase order restores all32 original bit positions exactly.
  method: test
- name: partial_combine
  statement: Final integer totals include all valid tile partials and no overflow
    or premature consumption.
  method: test
effects:
  transactions: []
  storage: []
  overlap: []
scope:
  predicate: (p.uint32_boolean_words and p.rows_split_into_exact_stages) and (p.stage_counts_fit_fields
    and p.final_integer_counts_do_not_overflow)
  text: Unsigned32-bit membership matrices and source legal stage lengths. Integer
    exactness requires field/headroom bounds; this is vertical per-column population
    count, not scalar popcount of each word or bit-transpose alone.
requires: []
probed_on: []
relations: []
signature:
  algorithm: Packed boolean columns are summed in progressively wider carry-isolated
    fields.
  storage: Binding-specific counters, partials or output ranges.
  boundary: Tile prefixes and logical membership.
  resources: []
numeric_risk: Integer counts must not overflow; ordering/rounding policy belongs to
  the bound operation.
summary: When summing many packed membership rows, count several columns at once inside
  spaced fields, then widen before carries could mix columns. Bind each stage fan-in
  below its field capacity and restore column phase order explicitly. Tile counts
  can serve both prefix metadata and final atomic totals.
