  "numeric_risk": "There are fewer than k strict winners and enough equal-boundary inputs to fill the quota. Their first IDs are precisely the required canonical boundary set. Sorting the fixed set establishes the same total order for every upstream tie choice. Host exhaustive arbitrary-boundary-subset checks are checks/tie_repair.json; GPU compaction, sort packing and FP32 signed-zero behavior require native admission.",
