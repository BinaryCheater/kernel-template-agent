    "text": "TextSeal ops/sampling/textseal_selector.py:44-137, finite nonnegative FP32 probabilities and token IDs in the source signed-safe range. The scan covers the full vocabulary even when upstream top-k retained only k records. This does not repair an incorrect top-k value threshold or missing strictly larger values."
  },
