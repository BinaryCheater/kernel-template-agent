{
  "name": "keyed_weighted_race_selection",
  "version": 2,
  "level_from": 3,
  "level_to": 4,
  "change": "vertical",
  "refines": "reduce",
  "produces": [
    "map",
    "reduce"
  ],
  "object": {
    "type": "deterministic_weighted_token_race",
    "description": "When weighted token selection must repeat for the same key and context despite changed launch partition, derive each race score from original token identity, then reduce shard winners with the same score/ID order."
  },
  "variables": [
    {
      "name": "split_width",
      "kind": "numeric",
      "binding": "compile",
      "role": "software",
      "domain": [
        1024,
        8192
      ],
      "meaning": "Token/rank entries per independently reduced shard."
    },
    {
      "name": "key_mode",
      "kind": "structure",
      "binding": "compile",
      "role": "boundary",
      "domain": [
        "single",
        "context_mixture"
      ],
      "meaning": "Single key or a context-wide dual-key decision; the requested selector identity fixes this mode."
    },
    {
      "name": "score_form",
      "kind": "structure",
      "binding": "compile",
      "role": "software",
      "domain": [
        "linear_log_uniform",
        "log_weight_gumbel"
      ],
      "meaning": "Compare log(U)/w directly, or compare log(w)-log(-log(U)); the latter can consume unnormalized log weights without materializing softmax."
    },
    {
      "name": "uniform_map",
      "kind": "structure",
      "binding": "compile",
      "role": "boundary",
      "domain": [
        "midpoint",
        "complement_midpoint"
      ],
      "meaning": "Underlying U is (h+.5)/2^32 or1-(h+.5)/2^32. This records requested random coupling; changing it changes the fixed-hash outcome."
    }
  ],
  "constraints": [],
  "preconditions": [
    {
      "id": "pre_support",
      "expr": "p.support_nonempty and p.inactive_entries_excluded and ((score_form == 'linear_log_uniform' and p.active_weights_finite_positive) or (score_form == 'log_weight_gumbel' and p.active_logweights_finite))",
      "meaning": "Supported records use positive finite weights or finite log weights; masks and nonfinite endpoint fallback have an explicit policy.",
      "cls": "semantic"
    },
    {
      "id": "pre_identity",
      "expr": "p.hash_recipe_fixed_by_key_context_token and p.hash_independent_of_shard_and_traversal",
      "meaning": "Each original token gets the same 32-bit hash regardless of launch partition.",
      "cls": "semantic"
    },
    {
      "id": "pre_mixture",
      "expr": "key_mode != 'context_mixture' or p.one_key_choice_shared_by_entire_context",
      "meaning": "Dual-key mixture chooses one key for a context, not a separate key for each token.",
      "cls": "semantic"
    },
    {
      "id": "pre_score",
      "expr": "p.selected_score_recipe_and_uniform_endpoint_policy_admitted and p.score_ties_choose_smallest_original_token_id",
      "meaning": "Compute the selected score from the exact declared hash/counter identity and orientation, with matching native rounding/endpoint and score/ID comparison policy. Version1 log/divide admission implies this premise for its unchanged binding.",
      "cls": "semantic"
    },
    {
      "id": "pre_reduce",
      "expr": "p.shards_partition_complete_support and p.local_and_global_comparator_identical",
      "meaning": "No support entry omitted or duplicated; each summary retains both score and original token ID.",
      "cls": "semantic"
    }
  ],
  "program": {
    "description": "For each supported original token i, produce a32-bit word h from the fixed key/context/token identity. Let u0=(h+.5)/2^32 and set U=u0 for midpoint or U=1-u0 for complement_midpoint. For linear_log_uniform compare log(U)/w_i. For log_weight_gumbel compare logw_i-log(-log(U)); a common normalization of weights subtracts the same constant and is unnecessary. Evaluate log(U) with a declared endpoint-safe recipe: complement_midpoint uses log1p(-u0); midpoint may use the complement near1 as in version1. Reduce each complete shard and its summaries by larger score then smaller original token ID. Counter word lanes and global vocabulary origins remain fixed across sharding. Context_mixture still chooses one key for the entire context. Fixed input casts/bias/temperature and optional stored logits remain part of the selected workload, not removable rounding."
  },
  "backward_map": "For a fixed score recipe and original token/random identity, replace shard summaries by their records; associative lexicographic max preserves the token. In exact arithmetic logw-log(-log(U))=-log(-log(U)/w) is strictly increasing in log(U)/w, so the two score forms have the same argmax when U and weights correspond. Finite native score-form changes require their admitted rounding policy.",
  "obligations": [
    {
      "name": "partition_invariance",
      "statement": "Every launch partition yields the same token for identical per-token scores and support.",
      "method": "proof"
    },
    {
      "name": "identity",
      "statement": "Hash inputs use original token identity; reordering rank positions does not change scores.",
      "method": "proof"
    },
    {
      "name": "numeric_endpoint",
      "statement": "Native conversion/log1p/division retains the admitted finite endpoint and tie policy.",
      "method": "test"
    }
  ],
  "effects": {
    "transactions": [],
    "storage": [],
    "overlap": []
  },
  "scope": {
    "predicate": "(p.support_nonempty and p.inactive_entries_excluded and ((score_form == 'linear_log_uniform' and p.active_weights_finite_positive) or (score_form == 'log_weight_gumbel' and p.active_logweights_finite))) and (p.hash_recipe_fixed_by_key_context_token and p.hash_independent_of_shard_and_traversal) and (key_mode != 'context_mixture' or p.one_key_choice_shared_by_entire_context) and (p.selected_score_recipe_and_uniform_endpoint_policy_admitted and p.score_ties_choose_smallest_original_token_id) and (p.shards_partition_complete_support and p.local_and_global_comparator_identical)",
    "text": "Version1 TextSeal split8192 midpoint linear score binding is unchanged. Version2 adds DSpark Markov block1024, log_weight_gumbel,complement_midpoint and single key with10-round Philox words identified by global vocabulary quad,request row,step and offset. Its global vocabulary shard starts must be4-aligned to preserve the declared word-to-token map. Input bias is added in FP32 then rounded to the declared step dtype before temperature/noise. Native u may round to1 and create an infinite exponential; finite-hash outcome uses the declared endpoint policy. No exact categorical law or independence is inferred from a finite hash/counter generator."
  },
  "requires": [],
  "probed_on": [],
  "relations": [],
  "signature": {
    "algorithm": "Partition-invariant keyed weighted race with direct linear or unnormalized log-weight score encoding.",
    "storage": "Per-shard summaries and original row inputs.",
    "boundary": "TextSeal source ops/sampling/textseal_selector.py:33-40,297-377,786-907; split8192. The direct-token path uses leftmost ties because contiguous token-ID shards are ascending; sorted-rank path explicitly reduces token IDs. Empty/all-infinite scores need a separate caller policy. This is equivalence to the fixed hash selector; a categorical-law claim additionally requires independent continuous uniforms and is not implied by a finite Murmur hash.",
    "resources": [
      "dram",
      "registers"
    ]
  },
  "numeric_risk": "Exact monotonic score equivalence does not imply identical FP32 ties/ranks. Preserve uniform orientation, counter-lane mapping, step casts, temperature and endpoint policy. Finite32-bit uniforms may round to1; generator quality and ideal continuous sampling law are separate premises.",
  "summary": "When weighted token selection repeats under changed launch partition, bind noise to original token identity and reduce identical score/ID records. Choose direct log(U)/weight or an admitted log-weight Gumbel score to avoid explicit normalization; retain random orientation, counter mapping and dtype steps."
}
