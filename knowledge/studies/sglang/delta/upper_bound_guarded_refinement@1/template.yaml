{
  "name": "upper_bound_guarded_refinement",
  "version": 1,
  "level_from": 3,
  "level_to": 4,
  "change": "vertical",
  "refines": "contract",
  "produces": [
    "map",
    "contract"
  ],
  "object": {
    "type": "expensive_bounded_scalar_predicate",
    "description": "An exact scalar threshold needs a large reduction, but a cheap conservative upper bound can prove many negative results."
  },
  "variables": [
    {
      "name": "evaluation",
      "kind": "structure",
      "binding": "compile",
      "role": "software",
      "domain": [
        "eager",
        "guarded"
      ],
      "meaning": "Always compute the exact threshold or skip it when a cheap upper bound already proves the strict comparison false."
    }
  ],
  "constraints": [],
  "preconditions": [
    {
      "id": "pre_bound",
      "expr": "p.exact_threshold <= p.cheap_upper_bound and p.ordered_non_nan_comparison",
      "meaning": "The cheap bound cannot be smaller than the exact threshold; both use the declared strict comparison and exclude NaNs.",
      "cls": "semantic"
    },
    {
      "id": "pre_effects",
      "expr": "p.expensive_threshold_evaluation_pure and p.skipped_evaluation_has_no_required_outputs",
      "meaning": "The expensive threshold computation has no externally required effects; only its comparison result matters on skipped paths.",
      "cls": "semantic"
    },
    {
      "id": "pre_identity",
      "expr": "p.same_test_value_and_inputs_in_eager_and_lazy_paths and p.native_bound_rounding_conservative",
      "meaning": "Moving the guard cannot change the test value, random identity, threshold inputs or conservative native upper bound.",
      "cls": "implementation"
    }
  ],
  "program": {
    "description": "The requested result is test_value < exact_threshold. Eager computes the exact threshold and compares. Guarded first tests test_value < cheap_upper_bound; if false, return false without the expensive reduction; otherwise compute the same exact threshold and compare. All data and random draws retain their original identity. If the exact value is also needed as later output, preserve its evaluation on that path instead of skipping it."
  },
  "backward_map": "Reinsert the skipped pure threshold evaluation. Since exact_threshold<=cheap_upper_bound<=test_value on every skipped path, the original strict comparison was false.",
  "obligations": [
    {
      "name": "bound",
      "statement": "The actual native upper bound is conservative for all admitted inputs and rounding.",
      "method": "proof"
    },
    {
      "name": "skip_equivalence",
      "statement": "Each skipped path returns the same predicate and preserves required state and randomness.",
      "method": "proof"
    }
  ],
  "effects": {
    "transactions": [],
    "storage": [],
    "overlap": []
  },
  "scope": {
    "predicate": "(p.exact_threshold <= p.cheap_upper_bound and p.ordered_non_nan_comparison) and (p.expensive_threshold_evaluation_pure and p.skipped_evaluation_has_no_required_outputs) and (p.same_test_value_and_inputs_in_eager_and_lazy_paths and p.native_bound_rounding_conservative)",
    "text": "SGLang block verifier uses prefix scalar c in[0,1], residual M=sum(max(c*P-Q,0)) and interior acceptance h=M/(M+1-c). For normalized finite P,Q, M<=c implies h<=c. Reject coin>=c before scanning vocabulary. Boundary c=0/1 and final-prefix acceptance have separately defined direct thresholds; they are not evaluated by the interior formula. No probability-law claim follows merely from this work-skipping transformation."
  },
  "requires": [],
  "probed_on": [],
  "relations": [],
  "signature": {
    "algorithm": "Cheap conservative upper bound guards an expensive pure threshold refinement.",
    "storage": "Bound/test scalars; exact reduction scratch only on surviving paths.",
    "boundary": "Ordered strict comparison, native bound and absence of skipped effects.",
    "resources": [
      "dram",
      "registers"
    ]
  },
  "numeric_risk": "An underestimated rounded bound can skip a true result. Threshold evaluation side effects or differently consumed random draws break equivalence.",
  "summary": "When a scalar decision needs an expensive reduction but a cheap upper bound already rejects many tests, guard refinement with that bound. Preserve test identity and compute the exact threshold only for unresolved cases."
}
