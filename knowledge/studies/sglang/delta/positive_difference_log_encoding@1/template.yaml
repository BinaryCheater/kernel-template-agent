    "text": "DSpark blockwise_rejection.py:292-357 uses normalized target/draft logits and log1p(-exp(logq-logp)), then a log-weight race; one-hot draft excludes the rejected token directly. Classic reject_sampling.py uses linear positive difference plus full mass/CDF. This representation step does not establish draft provenance, correction-law validity or native near-equal support preservation."
  },
