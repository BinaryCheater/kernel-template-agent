  "program": {
    "description": "For r=max(P-Q,0), linear encoding forms the admitted positive difference. Log encoding returns -inf when P=0 or Q>=P; when P>Q, compute log_r=logP+log1p(-exp(logQ-logP)), with logQ=-inf giving log_r=logP. A log-weight consumer may use log_r directly, since exponentiating it recovers r in exact arithmetic. Common residual normalization is a shared additive log shift and may be omitted only when the downstream operation is invariant to it. Preserve a separate explicit zero-total-mass policy."
  },
  "backward_map": "Decode a linear record directly or exp(log_r), with exp(-inf)=0; each logical value is max(P-Q,0) under its admitted numerical recipe.",
  "obligations": [
    {
      "name": "positive_difference",
      "statement": "Decoded values and their zero-support set equal the declared positive P-Q residual.",
      "method": "proof"
    },
    {
      "name": "numerical_support",
      "statement": "Native exp/log1p and cancellation satisfy the admitted near-equal, underflow and zero-total-mass policy.",
      "method": "test"
