name: bounded_lattice_parameter_lookup
version: 1
level_from: 2
level_to: 3
change: vertical
refines: access
produces: [access, reduce]
object:
  type: shared_lattice_parameter_map
  description: A bounded per-level table representing a logical lattice field through a possibly many-to-one coordinate map, with the matching gradient pullback.
variables:
  - {name: address_mode, kind: structure, binding: compile, role: software, domain: [dense, tiled, hash], meaning: "Coordinate map admitted by the field parameterization; this choice may change parameter sharing."}
  - {name: table_entries, kind: numeric, binding: compile, role: software, domain: {lo: 1, hi: 1073741824}, meaning: "Allocated parameter vectors per level, derived from selected budget and level geometry."}
  - {name: dimensions, kind: numeric, binding: compile, role: boundary, domain: [2, 3, 4], meaning: "Lattice coordinate dimensions; pinned compiled CoherentPrime grid menu."}
  - {name: features, kind: numeric, binding: compile, role: boundary, domain: [1, 2, 4, 8], meaning: "Contiguous scalar parameters in each table entry."}
constraints:
  - {id: c_capacity, expr: "table_entries * features * p.parameter_bytes <= p.level_capacity_bytes", meaning: "Each level's table fits its allocation.", cls: resource}
preconditions:
  - {id: pre_field, expr: "p.logical_field_factors_through_selected_map", meaning: "The workload defines or admits T(c)=theta[h(c)]; arbitrary independent dense values cannot be silently hashed or tiled.", cls: semantic}
  - {id: pre_map, expr: "p.resolution_positive and p.coordinate_and_u32_arithmetic_match and p.level_offset_valid", meaning: "Coordinate conversion, uint32 arithmetic, resolution and level segment agree across all consumers.", cls: implementation}
  - {id: pre_gradient, expr: "p.all_colliding_gradient_contributions_combined and p.gradient_epoch_initialized and p.no_parameter_update_during_reads", meaning: "Training sums contributions for shared parameters in one owned gradient epoch before updating parameters.", cls: semantic}
  - {id: pre_numeric, expr: "p.lookup_and_gradient_rounding_admitted", meaning: "Lookup casts and atomic accumulation order/precision satisfy the numerical policy.", cls: implementation}
program:
  description: >-
    For resolution R and coordinate c, form the source uint32 linear index
    L=sum_d c[d]*R**d and stride R**dimensions when the source safe-resolution
    branch permits it; otherwise set stride=UINT32_MAX and L=0. Dense and tiled
    address modes use L modulo table_entries. Hash uses the same L when
    table_entries>=stride, otherwise uses uint32 XOR_d(c[d]*a[d]) modulo
    table_entries, with coherent-prime factors [1,2654435761,805459861,3674653429]
    truncated to dimensions. Read feature f at level_offset+(h(c)*features+f).
    For training, map every logical vertex's gradient through exactly the same h
    and sum all contributions, including aliases within one stencil or between
    samples. Level offsets are measured in scalar parameters here; convert any
    source vector-entry offsets before binding. Use atomic or an equivalent
    complete reduction, with declared initialization and parameter-update order.
backward_map: Expand the logical lattice field as T(c,f)=theta[level_offset+h(c)*features+f]. For each table parameter, sum logical gradients over its preimage; this is the chain rule for the admitted parameter-sharing map.
obligations:
  - {name: address_agreement, statement: "Every forward and backward lookup uses the same level, coordinate, branch and feature address within the allocation.", method: test}
  - {name: sharing_contract, statement: "All aliased lattice values are constrained to equal the same table parameter by the declared workload representation.", method: proof}
  - {name: gradient_pullback, statement: "Each contributing logical gradient appears once in its physical parameter sum, including collisions, with an initialized accumulator and admitted rounding.", method: proof}
effects: {transactions: [], storage: [], overlap: []}
scope:
  predicate: "p.logical_field_factors_through_selected_map and p.resolution_positive and p.coordinate_and_u32_arithmetic_match and p.level_offset_valid and p.all_colliding_gradient_contributions_combined and p.gradient_epoch_initialized and p.no_parameter_update_during_reads and p.lookup_and_gradient_rounding_admitted"
  text: >-
    Per-level shared trainable tables, pinned to tiny-cuda-nn's compiled 2D/3D/4D
    CoherentPrime path and dense/tiled fallbacks. Hash collisions are intentional
    parameter tying, not lossless compression of arbitrary dense fields. No
    equivalence of different hash families or stochastic corner gradients is
    claimed. Coordinate generation and interpolation weights are separate inputs.
requires: []
probed_on: []
relations: []
signature:
  algorithm: Bound lattice storage through a shared coordinate map and pull gradients back through its preimages.
  reuse: Multiple lattice vertices may intentionally share one trainable vector.
  storage: table_entries times features scalar parameters per level.
  boundary: Hash activation threshold, integer arithmetic and shared gradient epoch.
  resources: [dram, atomics]
numeric_risk: Atomic gradient order and FP16 versus FP32 accumulation change rounding; collisions change the represented field unless parameter sharing is already admitted.
summary: >-
  When a multiresolution lattice uses bounded learned tables, make its coordinate
  map and collision semantics explicit. Choose dense/modulo or compiled coherent
  hashing under the field's representation contract; use the identical map for
  gradient sums. At R=4,H=8, coordinates (1,0) and (0,1) both hash to entry1, so
  gradients 2 and 3 must contribute 5 to the same parameter. Hashing an arbitrary
  dense field with unequal values at those vertices is rejected by pre_field.
