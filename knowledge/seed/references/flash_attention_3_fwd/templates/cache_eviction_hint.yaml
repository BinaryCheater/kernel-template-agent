name: cache_eviction_hint
version: 1
level_from: 3
level_to: 4
change: vertical
refines: transfer
produces: [transfer]
object:
  type: cache_policy
  description: "An L2 eviction priority (or L1 bypass) attached to a global-memory transfer, expressing whether the data will be reused by other CTAs."
variables:
  - {name: policy, kind: structure, binding: compile, role: boundary, domain: [evict_first, evict_last, evict_normal, bypass_l1], meaning: "cache policy attached to the access"}
  - {name: operand_role, kind: structure, binding: compile, role: software, domain: [streamed_once, reused_across_ctas], meaning: "why the policy fits the operand"}
constraints: []
preconditions:
  - {id: pre_semantic, expr: "True", meaning: "cache policy never changes values; only timing", cls: semantic}
program:
  description: "Pass a cache hint to the copy: TMA CacheHintSm90::EVICT_LAST for K/V and EVICT_FIRST for Q (hopper/mainloop_fwd_sm90_tma_gmma_ws.hpp:753, 767, 820); createpolicy.fractional.L2::evict_first with cp.async for streamed weights (Marlin)."
  fragments: {}
backward_map: "Drop the hint: the access with the default policy reads the same values."
obligations:
  - {name: value_neutral, statement: "The hint changes no value (always true; the obligation is only that the hinted operand is not written concurrently).", method: unspecified}
cost:
  - {unit: l2, work: "p.reused_bytes", overlap: overlappable}
scope:
  predicate: "True"
  text: "Global loads whose reuse across CTAs is known: streamed-once operands (weights in decode GEMMs, Q) versus operands reread by other CTAs (K/V). Needs L2 cache-policy hints (createpolicy, .L2::cache_hint), which the GB10 feature list (src/kta/targets/gb10/features.yaml) does not contain yet, so requires_hw is empty (D108)."
# requires_hw uses WP2 feature names (D108). createpolicy / .L2::cache_hint has no feature
# entry yet; it is listed under Needed changes in deliveries/WP10a.md.
requires_hw: []
relations: []
signature:
  algorithm: "L2 eviction priority per operand"
  reuse: "protects operands reread by other CTAs"
  storage: "l2"
  boundary: null
  resources: [l2]
numeric_risk: null
expected_sass: []
summary: "Attaches an L2 eviction priority to a global transfer according to whether other CTAs will reread the data. Never changes values. Its effect is only on L2 hit rate and therefore can only be confirmed by measurement."
