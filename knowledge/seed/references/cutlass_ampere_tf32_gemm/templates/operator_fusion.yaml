name: operator_fusion
version: 1
level_from: 2
level_to: 3
change: vertical
refines: map
produces: [map]
object:
  type: fused_intermediate
  description: "An intermediate tensor between a producer and a consumer operator that, after fusion, lives only on chip (registers or shared memory) for the lifetime of one tile."
variables:
  - {name: consumer_kind, kind: structure, binding: compile, role: software, domain: [elementwise, row_reduce_then_map, contract], meaning: "what the fused consumer does with the intermediate"}
  - {name: intermediate_site, kind: structure, binding: compile, role: software, domain: [registers, smem], meaning: "where the intermediate tile lives"}
  - {name: fused_ops, kind: structure, binding: compile, role: software, domain: [linear_combination, scale, scale_and_cast, routed_weight, softmax_then_matmul, norm_scale], meaning: "the consumer computation absorbed into the producer"}
constraints: []
preconditions:
  - {id: pre_tile_local, expr: "consumer_kind == 'elementwise' or p.consumer_needs_full_row == False or p.consumer_reduce_rescalable", meaning: "the consumer can be evaluated tile by tile: elementwise, or its reduction is local to the tile or rescalable (online)", cls: semantic}
program:
  description: "The producer's tile loop ends by applying the consumer to the on-chip tile instead of writing the intermediate to global memory (CUTLASS: Epilogue applies OutputOp = LinearCombination to accumulator fragments)."
backward_map: "Materialize the intermediate tile and run the consumer on it: the fused program equals producer followed by consumer."
obligations:
  - {name: same_values, statement: "The consumer reads exactly the producer's values for its tile (no partial or stale values).", method: test}
  - {name: no_cross_tile_dependency, statement: "No consumer output depends on intermediate values of another tile, unless an online/rescalable combination step accounts for it.", method: test}
effects:
  transactions:
    - {id: traffic, pattern: transfer, kind: dram_stream, count: "1",
       amounts: {bytes: "p.producer_input_bytes + p.consumer_extra_input_bytes + p.output_bytes"}}
  storage: []
  overlap: []
scope:
  predicate: "True"
  text: "Producer-consumer pairs where the consumer can be applied tile-locally; for row reductions over the tiled dimension the reduction must be rescalable."
requires: []
probed_on: []
relations: []
signature:
  algorithm: "producer-consumer fusion with on-chip intermediate"
  reuse: "intermediate reused on chip instead of via global memory"
  storage: "registers or smem"
  boundary: null
  resources: [dram]
numeric_risk: null
summary: "Removes the global-memory round trip of an intermediate by applying the consumer operator to each on-chip tile of the producer. Covers elementwise epilogues and, with a rescalable reduction, attention-style chains. Its DRAM cost omits the intermediate's write and read."
