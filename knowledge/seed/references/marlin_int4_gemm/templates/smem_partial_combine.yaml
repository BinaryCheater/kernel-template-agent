name: smem_partial_combine
version: 1
level_from: 2
level_to: 3
change: vertical
refines: reduce
produces: [transfer, sync, reduce]
object:
  type: smem_reduction_tree
  description: "Combining partials held by different warps of one CTA through shared memory, as a tree or a serial pass with barriers between rounds, leaving the result in one warp or broadcast to all."
variables:
  - {name: topology, kind: structure, binding: compile, role: software, domain: [log_tree, serial, library_block_reduce], meaning: "combine structure (library_block_reduce = cub::BlockReduce)"}
  - {name: combine_op, kind: structure, binding: compile, role: software, domain: [add, max, rescaled_merge], meaning: "combine operator; rescaled_merge for online-softmax states (m, d, o)"}
  - {name: result_to, kind: structure, binding: compile, role: software, domain: [one_warp, all_threads], meaning: "whether the result is broadcast back through smem (allreduce)"}
  - {name: participants, kind: numeric, binding: compile, role: software, domain: {lo: 2, hi: 32}, meaning: "warps (or warp groups) holding partials"}
constraints:
  - {id: c_part, expr: "participants >= 2", meaning: "more than one partial", cls: semantic}
preconditions:
  - {id: pre_assoc, expr: "p.reduce_assoc", meaning: "the combine is associative (tree reorders it)", cls: semantic}
program:
  description: "Each round: some warps write partials to smem, barrier, others read and accumulate, barrier; the final value stays in the reading warp or is written to an smem slot and read by all after a barrier (Marlin thread_block_reduce marlin/marlin_cuda_kernel.cu:466-509; FlashInfer sync_state; vLLM cub::BlockReduce + s_variance)."
  fragments: {}
backward_map: "Sum (or merge) all warps' partials in any order: the unsplit reduction."
obligations:
  - {name: exactly_once, statement: "Each warp's partial is combined exactly once.", method: exhaustive}
  - {name: barriers, statement: "Each smem slot is written before it is read and not overwritten before all its reads in the round (barrier between rounds).", method: test}
cost:
  - {unit: smem, work: "2 * p.partial_bytes * participants", overlap: serial}
scope:
  predicate: "True"
  text: "Reductions whose partials are spread over several warps of a CTA (K split across warps, rows reduced by a whole CTA, attention states split across warps)."
requires_hw: []
relations:
  - {type: requires, target: reduction_partition}
  - {type: alternative_of, target: cross_lane_reduction, note: "lane exchange within one warp vs smem across warps; often composed"}
signature:
  algorithm: "intra-CTA combine of warp partials through shared memory"
  reuse: null
  storage: "smem scratch (often aliased with pipeline buffers)"
  boundary: null
  resources: [smem]
numeric_risk: "Reorders the combine; result depends on the number of participating warps, which can depend on launch configuration."
expected_sass:
  - {when: "True", must_contain: [BAR.SYNC], must_not_contain: []}
summary: "Combines partials held by different warps of a CTA through shared memory with barriers between rounds. Can leave the result in one warp or broadcast it. Reorders the combine, so the result depends on how many warps take part."
