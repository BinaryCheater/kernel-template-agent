name: attention_fwd_f16_d128
reference_impl: "O = softmax(scale * Q K^T + mask) V per (batch, head), LSE = logsumexp of each score row; computed in float32 by a naive reference (tests/test_flash_attn.py attention_ref)"
inputs:
  - {name: Q, shape: [B, Sq, H, "128"], dtype: f16, layout: "row_major, last dim contiguous"}
  - {name: K, shape: [B, Sk, Hk, "128"], dtype: f16, layout: "row_major, last dim contiguous"}
  - {name: V, shape: [B, Sk, Hk, "128"], dtype: f16, layout: "row_major, last dim contiguous"}
outputs:
  - {name: O, shape: [B, Sq, H, "128"], dtype: f16, layout: "row_major, last dim contiguous"}
  - {name: LSE, shape: [B, H, Sq], dtype: f32, layout: row_major}
params:
  scale: "f32, runtime (softmax_scale)"
  causal: "bool, runtime switch compiled into two kernels"
  H_over_Hk: "int, GQA ratio, runtime (h_h_k_ratio)"
  Sq: "int, runtime"
  Sk: "int, runtime"
  dtype_variants: "bf16 is the same program with a different MMA atom"
  excluded_features: "dropout, alibi, softcap, local window, paged KV, split-KV: compiled-out variants not decomposed"
  tolerance: "f16 output; compared against an f32 reference with the tolerance used by the upstream tests"
