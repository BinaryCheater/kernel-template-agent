# WP7 reuse case: the FP16 GEMM case with BF16 operands and output (reuse_plan only).
# Contract per docs/design/50 §3: FP16 rtol = atol = 1e-2 plus relative L2 error; input
# distributions normal, zeros, extreme, adversarial (cancellation) and the one named by
# reduction_partition's numeric risk; edge shapes of length 1, non-tile-multiple and maximum
# length. Case.problem and Case.target are filled with record IDs when the records are written.
problem:
  name: gemm_bf16
  reference_impl: "C = A @ B"
  inputs:
    - {name: A, shape: [M, K], dtype: bf16, layout: row_major}
    - {name: B, shape: [K, N], dtype: bf16, layout: row_major}
  outputs:
    - {name: C, shape: [M, N], dtype: bf16, layout: row_major}
  params:
    accumulate: f32
    operand_bits: 16
    operand_exp_bits: 8
    min_work:
      tensor: "2 * case.M * case.N * case.K"
      dram: "(case.M * case.K + case.K * case.N + case.M * case.N) * 2"
contract:
  tolerances:
    # SYSDEBUG-2 D695: judged against the library (torch.matmul in bf16, cuBLAS) on the same
    # inputs, not element-wise against FP64: loose before measuring, strict for a round's
    # best. The fixed rtol/atol/rel_l2 stay as reported information.
    # D703 (user, 2026-11-02: pass anything that is not obviously wrong): a relative L2
    # error below the floor always passes (a correct kernel is near 1e-4, a wrong index or
    # a missing k-tile is several percent); above it, within 20x (loose) / 10x (strict)
    # of the library's own error. The exact numbers are the assistant's choice.
    bf16: {rtol: 0.02, atol: 0.02, rel_l2: 0.008, relative_to: library, loose: 20.0, strict: 10.0, rel_l2_floor: 0.02, abs_floor: 1.0e-3}
  input_dists: [normal, zeros, extreme, cancellation, large_dynamic_range]
  # SYSDEBUG-2 D696: the case is three static shapes; the kernel is accountable for those
  # only (no hidden shapes outside them). The former edge shapes (1x1x1, 129x193x65,
  # 1x4096x4096) were the assistant's, not the user's, and are outside this scope.
  shape_scope: {kind: static}
  edge_shapes: []
  timing_boundary: "single kernel launch; C = A @ B with A, B, C in device memory"
case:
  shape_dist:
    - {shape: {M: 4096, N: 4096, K: 4096}, weight: 1.0}
    - {shape: {M: 8192, N: 1024, K: 4096}, weight: 1.0}
    - {shape: {M: 1024, N: 1024, K: 16384}, weight: 1.0}
  objective: weighted_latency
baseline:
  library: "torch.matmul (cuBLAS)"
  call: "lambda A, B, C: torch.matmul(A, B, out=C)"
