# Version 2 of WP10a's proposed output_tiling@1 (knowledge/seed/references/cutlass_ampere_tf32_gemm),
# adopted into the seed by WP7 with cost terms for operand traffic (decision D280). Version 1 stays
# with the reference decomposition; refs.previous is not set because the seed is imported first.
name: output_tiling
version: 2
level_from: 1
level_to: 2
change: vertical
refines: map
produces: [map]
object:
  type: output_tile
  description: "A rectangular block of independent output points computed by one executor (CTA, warpgroup, warp or thread)."
variables:
  - {name: tile_m, kind: numeric, binding: compile, role: software, domain: {lo: 1, hi: 512}, meaning: "tile extent along the first output dimension (rows)"}
  - {name: tile_n, kind: numeric, binding: compile, role: software, domain: {lo: 1, hi: 512}, meaning: "tile extent along the second output dimension (columns); 1 for row-wise operators"}
  - {name: executor, kind: structure, binding: compile, role: software, domain: [cta, warpgroup, warp, thread], meaning: "executor level that owns one tile"}
  - {name: index_map, kind: structure, binding: compile, role: software, domain: [identity, batched, grouped_heads, custom], meaning: "how the executor index maps to output coordinates (extra batch / head dimensions)"}
constraints:
  - {id: c_pos, expr: "tile_m >= 1 and tile_n >= 1", meaning: "non-empty tile", cls: semantic}
preconditions:
  - {id: pre_indep, expr: "p.independent_outputs", meaning: "output points of the refined map do not depend on each other", cls: semantic}
program:
  description: >-
    Executor index -> tile origin; each executor loops only over the inputs its tile needs. In
    CUTLASS the CTA tile is ThreadblockShape and the warp tile WarpShape; in TileLang it is the
    T.Kernel grid with block_M x block_N. The grid is the number of tiles.
  fragments: {}
backward_map: "The union of all tiles' outputs, placed at their tile origins, is the output of the coarse map; the executor index is erased."
obligations:
  - {name: coverage_exact_once, statement: "Every output point lies in exactly one tile; points of residue tiles beyond the problem bounds are not written.", method: exhaustive}
  - {name: index_map_bijective, statement: "The executor index -> tile origin map is injective on valid tiles and hits every tile.", method: exhaustive}
cost:
  # One launch slot per tile (serial: scheduling of the grid does not overlap with itself).
  - {unit: launch, work: "ceil_div(p.M, tile_m) * ceil_div(p.N, tile_n)", overlap: serial}
  # Inputs are read once per tile (the reuse this step buys): bytes moved from L2 into the executors.
  - {unit: l2, work: "ceil_div(p.M, tile_m) * ceil_div(p.N, tile_n) * p.input_bytes_per_tile", overlap: overlappable}
  # Lower estimate of DRAM traffic: every input and output byte once (L2 misses beyond that are not modeled).
  - {unit: dram, work: "p.compulsory_bytes", overlap: overlappable}
scope:
  predicate: "True"
  text: "Any operator whose outputs are independent given the inputs (GEMM outputs, attention rows, normalization rows)."
requires_hw: []
relations:
  - {type: enables, target: output_tiling, note: "applied again one executor level down (CTA tile -> warp tile)"}
signature:
  algorithm: "partition the output index space into rectangular tiles"
  reuse: "operands are reused inside a tile: inputs shared by the tile's rows or columns are loaded once per tile"
  storage: null
  boundary: "residue tiles at M and N edges"
  resources: [cta]
numeric_risk: null
expected_sass: []
summary: >-
  Splits the independent outputs of an operator into tiles and gives each tile to one executor.
  Costs: one launch slot per tile, the inputs each tile reads (L2 traffic), and the compulsory
  DRAM bytes. Tile sizes become variables bounded later by storage and instruction shape.
