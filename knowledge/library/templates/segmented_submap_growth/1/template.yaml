  "summary": "When a hash container grows without rehashing existing entries, add bounded-load submaps and search existing segments before inserting into one designated target segment. Key7 already lives in segment0: inserting it while target1 is active must check0 first. Two concurrent batches targeting different segments can both miss7 then each insert it; local map CAS alone cannot prevent that cross-segment race."
