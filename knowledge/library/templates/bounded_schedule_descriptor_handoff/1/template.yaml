    "map",
    "access"
  ],
  "object": {
    "type": "bounded_schedule_descriptor_handoff",
    "description": "When a collective schedule is complex but payload work is regular, use one scheduler thread to publish bounded descriptors to independent worker groups and retire each descriptor before ring reuse."
  },
  "variables": [
    {
      "name": "descriptor_slots",
      "kind": "numeric",
      "binding": "compile",
      "role": "software",
      "domain": {
        "lo": 1,
        "hi": 4096
      },
      "meaning": "Finite shared descriptor ring depth."
    },
    {
      "name": "worker_groups",
      "kind": "numeric",
      "binding": "compile",
      "role": "software",
      "domain": {
        "lo": 1,
        "hi": 32
      },
      "meaning": "Disjoint warp-aligned groups consume steps by stride."
    }
  ],
  "constraints": [],
  "preconditions": [
    {
      "id": "pre_0",
      "expr": "p.descriptor_sequence_matches_collective_dependencies and p.descriptor_single_writer_and_assigned_reader",
      "meaning": "Schedule legality is a separate premise, not proved by queue synchronization.",
      "cls": "semantic"
    },
    {
      "id": "pre_1",
      "expr": "p.release_acquire_descriptor_publication_and_retirement and p.worker_group_barriers_disjoint",
      "meaning": "Payload and metadata fully read before return to scheduler; selected descriptor epoch matches.",
      "cls": "semantic"
    },
    {
      "id": "pre_2",
      "expr": "p.skipped_steps_and_terminal_markers_preserve_protocol and p.resource_budget_legal",
      "meaning": "Skipped data work may still consume/retire protocol slots; all active groups receive termination.",
      "cls": "semantic"
    }
  ],
  "program": {
    "description": "Scheduler waits until descriptor slot i%D is retired, writes complete operation indices/dimensions/offsets/flags and release-publishes ready or step epoch. Worker group g consumes steps i=g+k*G with acquire readiness/epoch match, executes transfer/reduce including per-connection credit updates, then release-retires descriptor. Full-step generation is used when multiple stage readers can observe the ring. Retire only after every required reader finishes. Termination markers reach every group; skipped operations retain required handshakes."
  },
  "backward_map": "Erase auxiliary organization and recover the visible results under the stated contract.",
  "obligations": [
    {
      "name": "publication",
      "statement": "Acquired ready/epoch exposes all fields from exactly that descriptor generation.",
      "method": "proof"
    },
    {
      "name": "bounded_reuse",
      "statement": "Scheduler cannot overwrite a descriptor while any assigned reader needs it.",
      "method": "proof"
    },
    {
      "name": "schedule_separation",
      "statement": "Handoff preserves declared operation order/dependencies but does not establish correctness of the underlying rank schedule.",
      "method": "proof"
    }
  ],
  "effects": {
    "transactions": [],
    "storage": [],
    "overlap": []
  },
  "scope": {
    "predicate": "p.descriptor_sequence_matches_collective_dependencies and p.descriptor_single_writer_and_assigned_reader and p.release_acquire_descriptor_publication_and_retirement and p.worker_group_barriers_disjoint and p.skipped_steps_and_terminal_markers_preserve_protocol and p.resource_budget_legal",
    "text": "Source PAT scheduler/worker separation; PAT rank/dimension arithmetic must be bound and proved separately. This rule does not relabel arbitrary work stealing as correct communication. Resource effects: One scheduler thread and bounded shared descriptors; workers overlap schedule construction and payload movement."
  },
  "requires": [],
  "probed_on": [],
  "relations": [],
  "signature": {
    "algorithm": "When a collective schedule is complex but payload work is regular, use one scheduler thread to publish bounded descriptors to independent worker groups and retire each descriptor before ring reuse.",
