  "numeric_risk": "Preserve the supplied arithmetic contract; reassociation, quantization and approximate search require separate permission.",
  "summary": "When a collective schedule is complex but payload work is regular, use one scheduler thread to publish bounded descriptors to independent worker groups and retire each descriptor before ring reuse. reduce_scatter.h:95-235: one-RPN flags ready/free; multi-RPN step epoch/-1, local NVLS stage and PAT stage coordinate retirement. src/include/collectives.h:455-718 supplies schedule, not this queue rule."
