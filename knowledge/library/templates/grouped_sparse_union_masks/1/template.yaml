name: grouped_sparse_union_masks
version: 1
level_from: 3
level_to: 4
change: vertical
refines: work_assign
produces:
- map
- store
- transfer
object:
  type: shared_key_union_with_row_membership_masks
  description: Share one sorted logical-key union among several set-valued sparse rows and retain each
    row support as a bitmask over union columns.
variables:
- name: group_rows
  kind: numeric
  binding: compile
  role: software
  domain:
    lo: 1
    hi: 1024
  meaning: Number of consecutive rows sharing one union; actual bitmap/staging capacity limits the selected
    implementation.
constraints:
- id: c_rows
  expr: group_rows >= 1 and p.logical_key_count >= 1 and p.row_capacity >= 1
  meaning: Nonempty logical key universe and support storage; each row may select zero keys.
  cls: semantic
- id: c_output
  expr: p.union_capacity >= min(group_rows * p.row_capacity, p.logical_key_count) and p.mask_capacity_bits
    >= 128 * ((p.union_capacity + 127) // 128)
  meaning: Output capacities cover the maximum union and full 128-column mask tiles.
  cls: resource
- id: c_scratch
  expr: p.bitmap_and_scan_staging_bytes <= p.available_shared_bytes
  meaning: The selected key-universe bitmap, prefix state and row-mask stages fit.
  cls: resource
preconditions:
- id: pre_set
  expr: p.support_has_set_semantics_and_duplicate_collapse_admitted
  meaning: Each row denotes set membership, not repeated occurrence weights.
  cls: semantic
- id: pre_payload
  expr: p.group_rows_share_logical_key_domain_page_table_and_payload_generation
  meaning: Equal logical keys denote the same K/V payload for every grouped row.
  cls: semantic
- id: pre_valid
  expr: p.invalid_key_positions_excluded_before_bit_or_page_access and p.page_table_entries_and_offsets_in_bounds
  meaning: Invalid keys never address bitmap/pages; valid translations fit allocated payloads.
  cls: implementation
- id: pre_masks
  expr: p.union_columns_rank_logical_keys_and_all_row_masks_use_same_rank and p.consumer_applies_row_mask_before_its_own_normalization
  meaning: Membership masks use the exact union order; sharing payloads never merges row support or row
    normalizers.
  cls: semantic
- id: pre_maps
  expr: p.output_union_and_mask_row_ids_unique_or_exclusive and p.negative_output_ids_skip_only_stores_and_preserve_control
  meaning: Visible row IDs have unique/exclusive writers and suppressed stores do not remove required
    barriers.
  cls: implementation
- id: pre_lifetime
  expr: p.bitmap_and_staging_zeroed_before_reuse and p.union_masks_counts_published_before_consumer_and_live_through_reads
  meaning: Group bitmap and reusable per-team mask staging have clean generations; consumers wait for
    complete metadata.
  cls: implementation
- id: pre_numeric
  expr: p.consumer_reduction_order_and_padding_contract_admitted and p.selected_group_bitmap_capacity_and_scan_legal
  meaning: Changed logical key order and tile padding satisfy numerical policy and actual shared/scan
    capacity.
  cls: implementation
program:
  description: Mark every valid logical key selected by any grouped row in a zeroed bitmap; repeated keys
    set the same bit. Prefix-scan bitmap popcounts to rank all union keys in ascending logical-key order.
    For union column c with key k, translate k through the common page table and write its physical payload
    slot once; publish union size U. For each original row, set bit c iff it selected key k. Initialize
    reusable row-mask staging, complete all writers, write whole 128-column mask tiles through ceil(U/128),
    and clear staging before another row reuses it. A masked dense consumer loads shared union payloads
    but applies each query row mask before exponentiation/normalization, retaining one original row normalizer.
    Only union[0:U] and mask tiles up to that bound are valid; capacity tails remain outside the contract.
    Suppressed output row IDs skip stores while all roles still follow bitmap/scan/staging synchronization.
backward_map: For each row select the union keys whose membership bits are set and undo the common page
  mapping; the original valid key set is recovered without changing that row normalization support.
obligations:
- name: union_rank
  statement: Every selected logical key has exactly one ascending union column and no unselected key appears.
  method: proof
- name: membership
  statement: Each row mask represents exactly its original key set under the same column rank; duplicates
    are collapsed only under the set contract.
  method: test
- name: payload_identity
  statement: Page translation and row-mask ranks preserve logical key identity even when physical slots
    are nonmonotone.
  method: test
- name: staging_and_consumer
  statement: Prefix and row-mask stages publish/reset safely; final consumers apply the proper row mask,
    bounds and lifetime before normalization.
  method: test
effects:
  transactions: []
  storage:
  - id: shared_union
    level: dram
    scope: kernel
    bytes: 4 * p.union_capacity + p.union_count_bytes
  - id: row_masks
    level: dram
    scope: kernel
    bytes: group_rows * p.mask_capacity_bits // 8
  - id: bitmap_staging
    level: smem
    scope: cta
    bytes: p.bitmap_and_scan_staging_bytes
  overlap: []
scope:
  predicate: p.support_has_set_semantics_and_duplicate_collapse_admitted and p.group_rows_share_logical_key_domain_page_table_and_payload_generation
    and p.invalid_key_positions_excluded_before_bit_or_page_access and p.page_table_entries_and_offsets_in_bounds
    and p.union_columns_rank_logical_keys_and_all_row_masks_use_same_rank and p.consumer_applies_row_mask_before_its_own_normalization
    and p.output_union_and_mask_row_ids_unique_or_exclusive and p.negative_output_ids_skip_only_stores_and_preserve_control
    and p.bitmap_and_staging_zeroed_before_reuse and p.union_masks_counts_published_before_consumer_and_live_through_reads
    and p.consumer_reduction_order_and_padding_contract_admitted and p.selected_group_bitmap_capacity_and_scan_legal
  text: Set-valued sparse rows sharing one logical request/page table and payload generation. Source token_sparse.py
    uses PAGE64, 128-column mask tiles, 512-thread CTAs with four reusable row teams, and padded support
    widths multiple512. The group may span more rows than teams. Arbitrary occurrence multiplicity, incompatible
    page tables, score-dependent dynamic selection and reading unwritten capacity tails are outside this
    version.
requires: []
probed_on: []
relations: []
signature:
  algorithm: Bitmap key union, logical-key rank and per-row membership masks for shared sparse payloads.
  reuse: One union payload tile serves neighboring rows with overlapping support while each row retains
    its own mask.
  storage: Logical key-universe bitmap plus prefix state, reusable row-mask staging, union slots/count
    and output masks.
  boundary: Set semantics, common payload mapping, logical-versus-physical ordering and per-row normalization.
  resources:
  - smem
  - dram
numeric_risk: Ascending logical-key enumeration can reorder an unsorted input reduction. Collapsing duplicate
  occurrences changes attention mass unless set semantics were requested.
summary: When neighboring sparse rows share many keys and the same cache mapping, build one logical-key
  union and a membership bitmask for each row. Load union payloads once but mask each row before its own
  normalization. Bitmap union removes duplicate keys, so use this only for set support. Keep mask columns
  tied to logical-key rank even if page translation makes physical slots unsorted, and clear row staging
  before reuse.
