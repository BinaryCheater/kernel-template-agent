  "program": {
    "description": "Write a complete logical metadata tile into an aligned shared slot. Join all source writers, execute the shared\u2192async proxy fence and have one elected issuer issue and commit the bulk shared\u2192global store. The store engine may continue independently. Before any later generation destructively rewrites that slot, the issuing thread waits for the previous committed group to finish reading its source; a CTA barrier then releases all writers. A source-read-release milestone permits refill but does not by itself permit a destination reader. Destination publication and final outstanding-store completion follow their own supported event, not merely the source-release wait."
  },
  "backward_map": "Associate every store with the source generation it fully read before reuse and with its later complete destination generation. Collapsing the transfer at actual destination completion recovers one correct metadata store; source release only shortens source occupancy.",
  "obligations": [
    {
      "name": "logical_identity",
      "statement": "Associate every store with the source generation it fully read before reuse and with its later complete destination generation. Collapsing the transfer at actual destination completion recovers one correct metadata store; source release only shortens source occupancy.",
