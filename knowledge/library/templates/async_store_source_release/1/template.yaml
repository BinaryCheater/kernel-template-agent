  "numeric_risk": "The store engine reads a fixed source generation until its read-release event. A refill ordered after that event cannot change transferred bytes; a CTA barrier makes the issuer's wait govern every writer. Proxy visibility precedes issue. Independently waiting for actual destination completion prevents exposing a partially stored generation. No abstract source-release proof discharges the source kernel's final pending-store or partial-padding native contract.",
