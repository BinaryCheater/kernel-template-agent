    "text": "Source GIN inbox four-phase bank and completed peer rounds; phase separation is a protocol premise needing backend signal-order proof. Resource effects: Adapts ring slot count to chunk size/peer count; minimum chunk size enforces hard per-peer and total credit capacities."
  },
