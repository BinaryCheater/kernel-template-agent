template: power_of_two_scale_encoding@2
version: 2
relation: Each completed live metadata element decodes to its original scale; unfinished
  elements retain FP32 values.
rank: Number of unencoded live metadata elements.
assumes:
- name: input_values
  statement: All live FP32 scales are positive finite representable powers of two
    with exponents-127..127; the only admitted subnormal is exactly2^-127.
- name: consumer_decoder
  statement: The consuming hardware or software decodes finite exponent byte e in0..254
    as2**(e-127), including minimum positive code0.
- name: layout_composition
  statement: Independent packing/transpose rules preserve logical coordinates and
    distinguish padding.
guarantees: []
models: []
note: 'Initialization has no completed elements. A positive normal FP32 power of two
  has zero sign and mantissa and exponent field e=log2(s)+127 in1..254. Extraction
  returns e; the consumer''s decoding returns s exactly, preserving the relation.
  Each completed element decreases the rank by one; completion covers the live metadata.
  Original DeepGEMM checks/scale_storage.py enumerates all254 admitted exponent values,
  tests uniquely tagged byte positions and grouped storage prefixes, and retains counterexamples
  for zero/infinity. CUTLASS''s fixed float_ue8m0_t decoder supplies the source-level
  semantic witness. Device load, UTCCP ordering and hardware consumption remain separate
  obligations. This outline has no registered proof model or ProofResult. Version2
  splits one additional case: s=2^-127 decodes exactly from e0. For e1..254 the old
  normal-exponent proof is unchanged. Literal exponent extraction from the minimum
  would also yield0 but its nonzero mantissa means it failed the old normal-power
  premise; this version admits only that one subnormal value, not arbitrary exponent0
  FP32 bit patterns. checks/minimum_scale.json exhausts all255 finite UE8M0 scale
  codes and distinguishes numerical zero.'
