name: rebind_transfer_descriptors
version: 2
level_from: 5
level_to: 6
change: vertical
refines: transfer
produces:
- transfer
- store
- sync
object:
  type: per_worker_descriptor_generation
  description: A private published transfer-descriptor tuple is rebound from fixed transfer templates
    to the current problem's base addresses, extents and strides.
variables:
- name: descriptor_count
  kind: numeric
  binding: compile
  role: boundary
  domain:
    lo: 1
    hi: 5
  meaning: Descriptors owned by one publisher tuple; source SM100 input tuple4, SM103 AB/SF tuples2, output
    tuple1.
- name: update_site
  kind: structure
  binding: compile
  role: software
  domain:
  - shared_shadow
  - direct_global
  meaning: Stage fields in a shared shadow before publishing, or mutate private global fields directly
    after old readers retire.
constraints:
- id: c_tuple
  expr: descriptor_count == p.publisher_tuple_size and p.descriptor_layouts_legal
  meaning: Every selected descriptor has valid rank/alignment/layout and the tuple covers the publisher's
    transfers.
  cls: implementation
preconditions:
- id: pre_key
  expr: p.problem_key_metadata_immutable and p.fixed_transfer_fields_compatible
  meaning: Equal problem keys imply unchanged metadata; data format and fixed transfer layout remain compatible
    with the templates.
  cls: semantic
- id: pre_lifetime
  expr: p.descriptor_slots_exclusive and p.old_descriptor_readers_retired
  meaning: A publisher owns its slots and cannot overwrite a generation still consumed by an older transfer.
  cls: semantic
- id: pre_publication
  expr: p.release_publish_supported and p.consumer_acquire_before_use
  meaning: The selected backend publishes complete descriptor generations and readers acquire the current
    generation before issue.
  cls: implementation
program:
  description: Initialize fixed descriptor fields in shared shadows or private global slots according
    to update_site. On a changed consumed problem key, construct current base/extent/stride metadata.
    For shared_shadow, update the shadows, retire users of the old published generation, then release-publish
    complete shadows to global slots. For direct_global, retire old users before the first in-place field
    mutation, update the entire tuple and release-fence the global updates. Readers acquire each current
    descriptor before transfer issue. Cache the consumed key; an equal immutable key skips updates. K0
    input skipping never skips a required output descriptor. Initialization and any delegated handshake
    must complete before use.
backward_map: Replace each use of a mutable descriptor generation by an immutable descriptor built for
  the exact problem metadata of that transfer.
obligations:
- name: coordinate_identity
  statement: Each issued descriptor maps transfer coordinates to the current problem's intended address
    and bounds without mixing tuple generations.
  method: test
- name: descriptor_lifetime
  statement: No published descriptor generation is mutated while any earlier transfer can still consume
    it.
  method: test
- name: publication
  statement: Updated fields are complete before release publication or the direct-global release fence;
    every issuing reader acquires the current tuple.
  method: test
- name: skip_key
  statement: An update is skipped only when the metadata of the consumed tuple is unchanged; input-zero-work
    and output ownership are distinguished.
  method: exhaustive
effects:
  transactions: []
  storage:
  - id: descriptor_shadow
    level: smem
    scope: cta
    bytes: descriptor_count * p.descriptor_bytes
    when: update_site == 'shared_shadow'
  - id: descriptor_published
    level: gmem
    scope: cta
    bytes: descriptor_count * p.descriptor_bytes
  overlap: []
scope:
  predicate: p.descriptor_layouts_legal and p.problem_key_metadata_immutable and p.fixed_transfer_fields_compatible
    and p.descriptor_slots_exclusive and p.old_descriptor_readers_retired and p.release_publish_supported
    and p.consumer_acquire_before_use
  text: Private per-worker mutable descriptor tuples reusing fixed transfer instructions/layouts. shared_shadow
    is the version1 implementation unchanged; direct_global retires old readers before any descriptor
    field store and release-fences the complete tuple before reader acquire. Pinned dense grouped GEMM
    uses three128-byte global slots split into AB tuple2 and C tuple1, with zero descriptor-shadow bytes
    in direct mode or384 total shadow bytes in shared mode. Earlier block-scaled shared bindings use five
    slots. Different rank/format, ownership or proxy/lifetime semantics requires another verified binding
    or variant. Initialization/delegation progress, descriptor traffic and latency remain implementation
    obligations.
requires: []
probed_on: []
relations: []
signature:
  algorithm: Cache a problem key and publish matching private descriptor generations before their transfers.
  storage: Shared shadows plus private global descriptor slots.
  boundary: Does not authorize in-place mutation with live readers or changing fixed transfer format/layout.
  resources:
  - smem
  - gmem
  - issue
numeric_risk: Address/metadata refinement only; tensor values and bounds must remain those of the current
  problem.
summary: When persistent transfers keep a fixed tile format but switch problem addresses, shapes or strides,
  consider rebinding a private descriptor tuple. Choose update_site between a shared shadow and direct
  global mutation; preserve the current mapping and retire old readers before global publication or the
  first direct field store. The pinned grouped path uses AB tuple2 and C tuple1 with128-byte slots; shared
  mode needs384 shadow bytes, direct mode none. Initialization progress and native release/acquire/lifetime
  semantics still need a supported backend binding.
