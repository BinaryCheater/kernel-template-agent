    "text": "Real affine compositing or explicitly admitted floating regrouping; nonnegative alpha below one for inverse replay. Exact stopping requires replay, not full crossing-batch fold. Resource effects: Parallel CTA per batch and O(batches*pixels*(channels+1)) checkpoint storage."
