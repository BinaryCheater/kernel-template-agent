  ],
  "program": {
    "description": "For a batch from fresh T=1 compute local C=sum_i alpha_i*product_before_i*c_i and Q=product_i(1-alpha_i). Fold earlier (C0,Q0) then later (C1,Q1) as (C0+Q0*C1,Q0*Q1). Never permute batches. If cumulative Q times next batch Q exceeds threshold, fold directly. Otherwise preserve batch-start C,Q and replay that batch candidate-by-candidate with the original threshold include/exclude policy; discard later batches. Store cumulative batch checkpoints for independent reverse processing and atomic gradient combination. A full-batch fallback is a separate approximate contract."
  },
  "backward_map": "Erase auxiliary organization and recover the visible results under the stated contract.",
  "obligations": [
    {
      "name": "summary",
      "statement": "Each batch summary denotes the same affine color/throughput action on any incoming C,T.",
      "method": "proof"
    },
    {
      "name": "crossing",
      "statement": "First crossing batch replay recovers exact accepted prefix; threshold equality follows policy.",
      "method": "proof"
    },
    {
      "name": "checkpoint",
      "statement": "All checkpoints are published before backward; gradients of shared inputs are combined without loss.",
      "method": "proof"
    }
  ],
  "effects": {
