  "numeric_risk": "The range maps index\u2192(kind,row) are bijections; paired mode instead executes exactly two independent bodies per row. Disjoint outputs and immutable common inputs allow interleaving without dataflow changes. Full block uniform branches retain barriers. Native common-shape register/shared-memory occupancy and PDL memory ordering must be checked separately; source reuse of a body does not alone certify those resource or early-publication conditions.",
