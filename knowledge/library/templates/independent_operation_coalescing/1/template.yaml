  ],
  "program": {
    "description": "Start with two independent task kinds A(row),B(row),row0..M-1. In disjoint_cta_ranges launch2*M CTAs: indices[0,M) execute A(index),[M,2M) execute B(index-M). In paired_row_sequence launch M CTAs and execute A(row),B(row) in paired_order. Both use block_threads and supported uniform collectives; private scratch may be shared only after its original last read. Each task retains its input producer wait and its output visibility contract. Consumers wait for every task kind they require. A launch/dispatch reduction is possible but no occupancy or overlap speedup follows from this structural transformation."
  },
  "backward_map": "Split each coalesced task instance back into its original kernel/CTA domain. Independence permits the observed interleaving or per-row order without changing any required output; exact task coverage recovers the two original operations.",
  "obligations": [
    {
      "name": "logical_equivalence",
      "statement": "Split each coalesced task instance back into its original kernel/CTA domain. Independence permits the observed interleaving or per-row order without changing any required output; exact task coverage recovers the two original operations.",
