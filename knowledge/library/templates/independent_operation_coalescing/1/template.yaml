    },
    {
      "name": "native_admission",
      "statement": "The selected native resource, arithmetic and publication recipe preserves all declared inputs/outputs.",
      "method": "test"
    }
  ],
  "effects": {
    "transactions": [],
    "storage": [],
    "overlap": []
  },
  "scope": {
    "predicate": "(p.two_task_kinds_have_same_row_count and p.no_cross_task_read_write_or_output_alias_hazards) and (p.bodies_support_common_block_and_compilation_policy and p.branch_resource_occupancy_fits) and (p.each_logical_task_assigned_exact_once and p.block_collectives_uniform_inside_selected_task) and (p.every_task_waits_for_its_actual_input_producer and p.external_readers_wait_for_all_required_task_outputs) and (p.same_body_arithmetic_and_required_outputs_preserved)",
    "text": "Source route_quant_fused.cuh uses disjoint ranges: router/pack M CTAs and MXFP8 quant M CTAs,224 threads,3584 input features,group32/two lanes per group. Fused front epilogue in route_radix.cuh uses paired rows with224/448 threads and selectable latent-cast-before/after routing. Small-batch dispatch is a heuristic; PDL-enabled variants retain separate native completion proof, while ordinary kernel-completion semantics give the direct structural instance."
