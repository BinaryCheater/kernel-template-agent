      "id": "pre_0",
      "expr": "p.prefix_attenuation_nonincreasing and p.every_published_bound_conservative and p.finite_unit_bounds",
      "meaning": "Each preceding-batch value upper-bounds true attenuation at later batches.",
      "cls": "semantic"
    },
    {
      "id": "pre_1",
      "expr": "p.atomic_word_covers_all_fields and p.rounding_toward_upper_bound and p.key_range_legal",
