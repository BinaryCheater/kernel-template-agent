name: groupwise_low_float_quantization
version: 1
level_from: 3
level_to: 4
change: vertical
refines: map
produces: [reduce, map, store]
object:
  type: low_float_group_with_encoded_scale
  description: A contiguous output group is quantized to finite low-float values using a shared encoded scale whose decoded value also controls code generation.
variables:
  - {name: format, kind: structure, binding: compile, role: boundary, domain: [nvfp4, mxfp8], meaning: Requested output representation; nvfp4 is E2M1 with E4M3FN scale and mxfp8 is E4M3FN with E8M0FNU scale.}
  - {name: group_size, kind: numeric, binding: compile, role: boundary, domain: {lo: 16, hi: 32}, meaning: Contiguous values sharing one scale; source output binds16 for nvfp4 or32 for mxfp8.}
constraints:
  - {id: c_pair, expr: "(format == 'nvfp4' and group_size == 16) or (format == 'mxfp8' and group_size == 32)", meaning: This version supports only the two pinned code/scale/group format pairs., cls: implementation}
  - {id: c_groups, expr: "p.complete_groups or p.neutral_group_padding", meaning: Any missing group elements are initialized to zero and do not affect the group maximum., cls: semantic}
preconditions:
  - {id: pre_contract, expr: "p.low_float_quantizer_requested and p.finite_group_values and p.normalization_is_one", meaning: The coarse operation requests this quantizer on finite pre-quantization values with source normalization1., cls: semantic}
  - {id: pre_range, expr: "p.nonzero_scales_in_supported_range and p.scaled_values_within_finite_code_range", meaning: Nonzero scales fit the metadata format and normalized values fit finite output codes; overflow/underflow extension is separate., cls: semantic}
  - {id: pre_mapping, expr: "p.group_fragments_match_logical_groups and p.scale_metadata_ownership_exact and p.identity_after_quantization", meaning: Each physical group matches its logical row/channels and emitted metadata; no later activation changes the represented values., cls: semantic}
  - {id: pre_backend, expr: "p.conversions_match_format_policy and p.reciprocal_matches_admitted_policy and p.zero_group_policy_supported", meaning: The backend implements the specified scale/code rounding and admitted reciprocal behavior including zero groups., cls: implementation}
program:
  description: >-
    For each group reduce amax=max(abs(v)). Let maximum_code be6 for nvfp4 or448
    for mxfp8 and compute raw_scale=amax/maximum_code. Encode raw_scale as E4M3FN
    with nearest-even rounding for nvfp4, or as the least E8M0FNU power of two not
    smaller than raw_scale for mxfp8. Decode that same stored scale as s. Compute
    multiplier=min(admitted_reciprocal(s),FP32_max) and encode every v*multiplier
    to the output low-float format with nearest-even rounding. Emit code values and
    exactly one matching encoded scale per logical group. For zero groups, nvfp4
    stores scale0 and clamps the positive infinite reciprocal to FP32_max; mxfp8
    stores its minimum positive scale2**-127. Both produce zero code values. Output
    packing and physical metadata layout are separate refinements.
backward_map: The pair of code values and encoded metadata is the result of the requested low-float quantizer, decoded as code_value*s; it does not recover arbitrary original real values exactly.
obligations:
  - {name: logical_group, statement: Each absolute maximum includes exactly one logical group plus only neutral initialized padding., method: exhaustive}
  - {name: encoded_scale_used, statement: Output code generation uses the decoded stored scale rather than the unrounded raw scale., method: test}
  - {name: format_policy, statement: Code/metadata conversion and zero-group reciprocal behavior implement the selected finite-format numerical policy., method: test}
  - {name: metadata_identity, statement: Every visible code group emits exactly its own scale with no wrong-lane or padded-store ownership., method: exhaustive}
effects: {transactions: [], storage: [], overlap: []}
scope:
  predicate: "p.low_float_quantizer_requested and p.finite_group_values and p.normalization_is_one and p.nonzero_scales_in_supported_range and p.scaled_values_within_finite_code_range and p.group_fragments_match_logical_groups and p.scale_metadata_ownership_exact and p.identity_after_quantization and p.conversions_match_format_policy and p.reciprocal_matches_admitted_policy and p.zero_group_policy_supported"
  text: >-
    Requested low-float output groups with multiplicative scale and no zero point,
    normalization1, finite input values and the pinned16/32-element format pairs.
    Nonzero raw scales are within the metadata format and scaled values remain
    within finite code range; saturation, extreme underflow and NaN/Inf require a
    separately admitted extension. Zero groups have the explicit policies above.
    Source conversion helper requests E8M0 upward rounding and otherwise nearest-even;
    exact generated conversion/reciprocal behavior and per-thread logical grouping
    remain backend obligations. A new activation, normalization, format pair,
    physical group map or padding path needs a verified binding or variant.
requires: []
probed_on: []
relations: []
signature:
  algorithm: Per-group absolute maximum, encoded shared scale, then low-float code conversion using that encoded scale.
  storage: Low-float output codes plus one encoded scale per group.
  boundary: Scale rounding, zero groups and the logical fragment/metadata ownership map.
  resources: [issue]
numeric_risk: Quantization is intentionally lossy; approximate reciprocal, FP32 arithmetic and conversion boundaries need the caller's admitted error policy.
summary: >-
  When the requested output is a block-scaled low-float tensor, consider emitting each group's scale alongside its codes in the epilogue. Preserve the specified group/format pair and use the decoded stored scale for code generation, so rounding metadata cannot detach codes from their scale. The pinned path binds NVFP4 groups16 or MXFP8 groups32 with normalization1 and identity after quantization; finite-range, zero-group and reciprocal policies are explicit, while saturation/extreme underflow or another physical group map needs a verified extension.
