  "produces": [
    "map",
    "access"
  ],
  "object": {
    "type": "row_constant_rank_score",
    "description": "When all candidates in a query share a metric term, rank by a cheaper score and reconstruct the reported metric only for winners under an explicit order/tie contract."
  },
  "variables": [],
  "constraints": [],
  "preconditions": [
    {
      "id": "pre_0",
      "expr": "p.score_transform_monotone and p.query_constants_valid",
      "meaning": "For a fixed query, the declared positive-scale/constant transformation preserves the required candidate order; any norm denominator is valid or has explicit zero policy.",
      "cls": "semantic"
    },
    {
      "id": "pre_1",
      "expr": "p.rounding_and_tie_policy_admitted",
      "meaning": "Caller admits ranking arithmetic before reconstruction; rounding, clamps and nonlinear transforms do not silently impose a stronger final-value tie rule.",
      "cls": "semantic"
    },
    {
      "id": "pre_2",
      "expr": "p.winner_identity_preserved",
      "meaning": "Selected score and candidate ID remain paired through reconstruction.",
      "cls": "semantic"
    }
  ],
  "program": {
    "description": "For squared L2, score=0.5*database_norm_squared-query_dot_database; select minimum score, then report query_norm_squared+2*score, optionally nonnegative clamp and square root. For cosine, rank by -dot/database_norm for positive database norms and reconstruct1+score/query_norm after selecting; handle zero query/database norms by the declared convention. Compute per-query constants once and omit them from the candidate inner loop. Candidate values and identity are recovered together only for selected winners."
  },
  "backward_map": "Erase auxiliary organization and recover the visible results under the stated contract.",
  "obligations": [
    {
      "name": "order",
      "statement": "The score order maps to the requested metric ranking for every admitted candidate, including zero norms.",
      "method": "proof"
    },
    {
      "name": "numeric_boundary",
      "statement": "Any pre/post clamp or rounding-induced ties follow the declared transformed-score contract, not an assumed equivalent stable sort of reconstructed floats.",
      "method": "proof"
    },
    {
      "name": "constants",
      "statement": "Query/database norms match the same operand representation and MMA rounding policy as the dot products.",
      "method": "proof"
    },
    {
      "name": "reconstruction",
      "statement": "Returned metric uses the winner original score and correct query constant exactly once.",
      "method": "proof"
    }
  ],
  "effects": {
    "transactions": [],
    "storage": [],
    "overlap": []
  },
  "scope": {
    "predicate": "p.score_transform_monotone and p.query_constants_valid and p.rounding_and_tie_policy_admitted and p.winner_identity_preserved",
    "text": "NVIDIA cuTile fused1NN and Faiss L2 selection. Source cuTile cosine zero norm returns1, while IVF-SQ cosine zero norm returns0; those are different contracts. Float TF32 conversion and norm generation must agree; exact algebra alone does not prove identical floating winner identities. Resource effects: Avoids repeating query constants and full metric epilogues over every candidate; retains one score/ID pair per query, with norm reads and reconstruction only for winners."
  },
  "requires": [],
  "probed_on": [],
  "relations": [],
  "signature": {
    "algorithm": "When all candidates in a query share a metric term, rank by a cheaper score and reconstruct the reported metric only for winners under an explicit order/tie contract.",
    "storage": "Avoids repeating query constants and full metric epilogues over every candidate; retains one score/ID pair per query, with norm reads and reconstruction only for winners.",
    "boundary": "For one query norm25, candidates scores-10,-9 rank in that order and reconstruct L2 distances5,7. Clamping two negative rounded reconstructions to0 can create a tie that did not exist in score space; do not substitute final-float smallest-ID tie semantics.",
    "resources": []
  },
  "numeric_risk": "Preserve the supplied arithmetic contract; reassociation, quantization and approximate search require separate permission.",
  "summary": "When all candidates in a query share a metric term, rank by a cheaper score and reconstruct the reported metric only for winners under an explicit order/tie contract. For one query norm25, candidates scores-10,-9 rank in that order and reconstruct L2 distances5,7. Clamping two negative rounded reconstructions to0 can create a tie that did not exist in score space; do not substitute final-float smallest-ID tie semantics."
}
