    "text": "NVIDIA dynamic batching with system-scope pointer atomics and packed commit/closure state. Deadline adjusts batch occupancy, not request cancellation. Source mixed-width token access and host/device ordering require target-specific realization proof. Resource effects: Contiguous batch query/result storage plus pinned request-pointer/token metadata; amortizes search calls at cost of deadline waiting and gather/scatter launches."
  },
