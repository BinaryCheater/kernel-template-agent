  "program": {
    "description": "Host request first reserves a unique batch row, then publishes its input/output pointers. GPU gather blocks poll their row pointer. Once a row is committed, its block must wait for publication even if deadline passes. If no reservation exists when timeout closes the batch, that row exits without copying and no future reservation may enter this batch generation. Published rows copy into contiguous batch query storage. Enqueue upstream search after gather, scatter results to original output pointers and publish a completion event before request buffers or batch IO slots are reused."
  },
  "backward_map": "Erase auxiliary organization and recover the visible results under the stated contract.",
  "obligations": [
    {
      "name": "commit_vs_publish",
      "statement": "A missing pointer does not imply an unused slot after reservation, and timeout cannot omit a committed request.",
      "method": "proof"
    },
    {
      "name": "close_atomicity",
      "statement": "No new reservation can race past the closed-batch token into a generation being searched/recycled.",
      "method": "proof"
    },
    {
      "name": "request_identity",
      "statement": "Each copied row and result scatter refer to the same original request and slot generation.",
      "method": "proof"
    },
    {
      "name": "completion",
      "statement": "Request return/reuse follows result scatter, not pointer consumption or search enqueue.",
      "method": "proof"
    }
  ],
