  "signature": {
    "algorithm": "When host requests are coalesced on the GPU under a deadline, distinguish reserved queries from published pointers and close only unreserved slots when time expires.",
    "storage": "Contiguous batch query/result storage plus pinned request-pointer/token metadata; amortizes search calls at cost of deadline waiting and gather/scatter launches.",
    "boundary": "Slot0 reserves just before timeout but publishes after timeout: gather must still wait and copy it. Unreserved slot1 may exit. Treating every null pointer as empty loses slot0; allowing new commits after closure corrupts generation ownership.",
