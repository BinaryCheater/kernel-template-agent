    "text": "NVIDIA sparse COO/CSR pairwise distance backend. Dense and hash shared caches have different resource bounds. rev tests cached value==0, so callers requiring structural support distinction must additionally rule out semantically different explicit zeros. Warp participation at tails requires realization verification. Resource effects: Caches one sparse row per CTA, streams B nonzeros with segmented reductions and atomic output updates; dense cache costs dim*sizeof(value), hash cache scales with occupied slots and may split long rows."
  },
