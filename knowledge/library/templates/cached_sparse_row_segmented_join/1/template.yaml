  "program": {
    "description": "Choose dense shared array initialized to zero or a bounded shared hash map for one A row. Insert its nonzeros and synchronize. Partition B nonzeros into disjoint chunks; each thread probes cached A at B column and applies the metric product. Maintain a partial accumulator for its B row; when row identity changes within a warp, group lanes by row and segment-reduce. One leader atomically combines each completed segment into pairwise output(Arow,Brow). For metrics depending on support union, separately run the reverse direction only on coordinates absent from the first cached support, so intersection is not counted twice."
  },
  "backward_map": "Erase auxiliary organization and recover the visible results under the stated contract.",
  "obligations": [
    {
      "name": "cache",
      "statement": "Every cached column has its source value; absent columns are zero without confusing explicit zeros and structural absence where the metric distinguishes them.",
      "method": "proof"
    },
    {
      "name": "segments",
      "statement": "Every streamed contribution belongs to its correct B row and exactly one emitted partial segment.",
      "method": "proof"
    },
    {
      "name": "chunk_cover",
      "statement": "Source hash splits and B chunks cover the intended support exactly once.",
      "method": "proof"
    },
    {
      "name": "support_union",
      "statement": "Forward/reverse metric passes include required intersection and symmetric-difference terms without duplication.",
      "method": "proof"
    }
  ],
