      "expr": "p.raw_sum_metadata_cast_and_integer_dot_policy_admitted and p.integer_dot_no_overflow",
      "meaning": "The hybrid approximation uses stored activation scale and rounded raw sum explicitly; it is not assumed equal to a dot of two decoded quantized operands.",
      "cls": "implementation"
