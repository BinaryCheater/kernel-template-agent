    "text": "Pinned GGUF Q4_0/Q4_1/Q5 affine weights withQ8_1 activation groups32, stored half scale and half raw sum. Numerical recipe includes source half2 scale products and per-owner division. Different superblock/subgroup intersections need an explicit binding; this does not certify arbitrary codebook offsets."
  },
  "requires": [],
