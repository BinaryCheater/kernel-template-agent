  "relations": [],
  "signature": {
    "algorithm": "Separate affine weight offset using a reusable sum of raw activations while quantizing only the code-dependent dot term.",
    "storage": "One raw sum alongside activation scale per32-element group.",
    "boundary": "Raw sum versus decoded-code sum, constant offset interval, correction multiplicity and metadata rounding.",
    "resources": []
  },
  "numeric_risk": "Half raw-sum storage, half2 scale products and divided correction parts add rounding. Replacing raw sum byscale*sum(q) changes the approximation, especially at rounding boundaries.",
  "summary": "When weights have a group-constant affine offset, save the raw activation group sum during activation quantization and apply the offset through that statistic. Reuse it across weight rows; distribute the correction only across a known exact contributor count. This preserves a higher-fidelity offset term than recomputing it from quantized activation codes, while the code-dependent term remains an admitted integer-dot approximation."
