  "program": {
    "description": "While quantizing a32-value activation groupx to signedq with scaledx, also reduces_raw=sum(x) before quantization and store it in its declared metadata dtype. For affine weight groupw=d_w*q_w+m_w compute the code termd_w*d_x*integer_dot(q_w,q_x) under the source scale-product arithmetic. Addm_w*stored(s_raw), either once or equally across exactlycorrection_owners final partials. For centered weight formd_w*(q_w-z), use offsetm_w=-d_w*z. Reuse the same raw activation sum for every weight row sharing this activation group; retain scale/sum generation pairing."
  },
  "backward_map": "The original affine weight dot splits exactly into d_w*sum(q_w*x)+m_w*sum(x). Only the first term is approximated by the declared activation quantizer; the offset term uses the retained raw sum with its explicit metadata rounding.",
  "obligations": [
    {
      "name": "sum_domain",
      "statement": "Retained statistic sums original activation values of the exact group, including only neutral padded zeros.",
      "method": "exhaustive"
    },
    {
      "name": "correction_once",
      "statement": "Distributed correction coefficients sum toone and every required partial is combined exactly once.",
      "method": "test"
    },
    {
      "name": "hybrid_numeric",
      "statement": "Scale products, raw-sum metadata cast and correction distribution meet the declared hybrid-dot error policy.",
      "method": "test"
    }
  ],
  "effects": {
    "transactions": [],
