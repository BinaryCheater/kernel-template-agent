  ],
  "preconditions": [
    {
      "id": "pre_inputs",
      "expr": "p.weight_decode_is_gain_times_code_plus_offset and p.quantized_activation_and_raw_sum_same_group_generation",
      "meaning": "Weight representsd*q+m; activation quantizer also retains sum of original input values for the same32 coordinates.",
      "cls": "semantic"
