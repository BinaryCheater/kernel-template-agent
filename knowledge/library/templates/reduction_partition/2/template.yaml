name: reduction_partition
version: 2
level_from: 2
level_to: 3
change: vertical
refines: reduce
produces:
- reduce
object:
  type: reduction_group
  description: A group of reduction indices whose products are summed into one partial
    result; the partial results are then combined.
variables:
- name: num_groups
  kind: numeric
  binding: runtime
  role: software
  domain:
    lo: 1
    hi: 1048576
  meaning: number of groups (partial results) per output
- name: group_size
  kind: numeric
  binding: compile
  role: software
  domain:
    lo: 1
    hi: 65536
  meaning: reduction indices per group (e.g. the k-tile size)
- name: assignment
  kind: structure
  binding: compile
  role: software
  domain:
  - contiguous_sequential
  - contiguous_parallel
  - contiguous_ranges
  - strided_threads
  - strided_warps
  - runtime_balanced
  meaning: which indices go to which group, and whether groups are summed one after
    another into one accumulator (sequential) or by different executors (parallel)
- name: range_policy
  kind: structure
  binding: compile
  role: software
  domain:
  - uniform
  - balanced_quotient
  meaning: Uniform groups retain version1 mapping, or balance K tiles by quotient/remainder
    across fixed split participants.
constraints:
- id: c_cover
  expr: num_groups * group_size >= p.length
  meaning: the groups cover every reduction index
  cls: semantic
- id: c_no_empty
  expr: p.empty_groups_emit_identity or (num_groups - 1) * group_size < p.length
  meaning: Empty participants are legal only if they emit the true combine identity
    and complete the same protocol.
  cls: implementation
preconditions:
- id: pre_cover
  expr: num_groups * group_size >= p.length
  meaning: every product is assigned to a group (exact-once also needs the assignment
    to be a partition, obligation exact_once)
  cls: semantic
  same_as: c_cover
- id: pre_empty_identity
  expr: range_policy != 'balanced_quotient' or p.empty_groups_emit_identity
  meaning: Every empty split still publishes neutral partial and arrives at the finalizer
    protocol.
  cls: semantic
program:
  description: 'for each output: for r in groups: partial[r] = sum of the products
    whose index is assigned to r; result = combine(partial[0..num_groups-1]). With
    contiguous_sequential the partials are summed in place into one accumulator (the
    k-loop of a tiled GEMM); with contiguous_parallel each group is a separate executor
    (split-K) and the combine is a separate reduction. With range_policy=balanced_quotient
    let q=length//num_groups,r=length%num_groups. Split s owns [s*q+min(s,r), s*q+min(s,r)+q+[s<r]).
    group_size=ceil(length/num_groups) is the maximum group size, not a constant start
    stride. Empty splits publish identity and complete arrival/turnstile even with
    no operand loads. Nonlinear epilogue applies only after all partials are combined.'
backward_map: Combining the group partial results gives the sum over all reduction
  indices, because the groups partition the index set; forget the groups.
obligations:
- name: exact_once
  statement: Every reduction index k is assigned to exactly one group (the assignment
    is a partition of 0..length-1).
  method: exhaustive
- name: combine_complete
  statement: The combine reads every group's partial result exactly once and none
    before it is final.
  method: test
effects:
  transactions:
  - id: combine
    pattern: reduce
    kind: ffma
    count: (num_groups - 1) * p.outputs
    amounts:
      ops: '1'
    when: assignment != 'contiguous_sequential'
  storage: []
  overlap: []
scope:
  predicate: p.assoc and p.comm and p.empty_groups_emit_identity
  text: Reductions whose combine operator is associative and commutative in exact
    arithmetic (sum, max, min). Floating-point sums qualify only up to rounding; see
    numeric_risk. Version2 adds balanced quotient ranges and empty participant completion.
    Version1 uniform nonempty bindings translate with range_policy=uniform and the
    identity premise vacuous when no group is empty.
requires: []
probed_on: []
relations:
- type: enables
  target: physical_storage
  note: partial results become values that need storage
signature:
  algorithm: split one reduction into groups of partial sums followed by a combine
  reuse: null
  storage: null
  boundary: the last group is partial when group_size does not divide length
  resources: []
numeric_risk: Changes the summation order, so floating-point results differ from a
  sequential sum within rounding. Checks must include the input distribution "large_dynamic_range"
  (values spanning many binades with cancellation).
summary: 'Paper GEMM step 1: one sum of K products becomes partial sums over groups
  followed by a combine. The decision is the assignment of reduction indices to groups;
  the obligation is exact-once.'
example_code: null
