name: duplicate_balanced_set_partition
version: 1
level_from: 2
level_to: 3
change: vertical
refines: map
produces:
- map
- store
object:
  type: duplicate_balanced_set_partition
  description: A merge-diagonal partition adjusted inside equal-key runs so multiset
    pairs stay consistently assigned.
variables:
- name: tile_inputs
  kind: numeric
  binding: compile
  role: software
  domain:
    lo: 1
    hi: 65536
  meaning: Nominal total input diagonal spacing per parallel tile.
constraints: []
preconditions:
- id: pre0
  expr: p.inputs_sorted_same_strict_weak_order and p.equivalent_key_classes_consistent
  meaning: Both sequences share comparator and equality classes.
  cls: semantic
- id: pre1
  expr: p.balanced_boundary_algorithm_and_consumers_match and p.output_multiplicity_contract_explicit
  meaning: All boundaries and local set operations use the same duplicate pairing
    convention.
  cls: semantic
- id: pre2
  expr: p.output_prefixes_exact and p.payload_source_matches_operation
  meaning: Output compaction and key/value source identity match union/intersection/difference.
  cls: semantic
program:
  description: At diagonal d find ordinary MergePath (i,j). If j<B_length, let x=B[j]
    and find lower bounds a0,b0 of its equal run in the visited A/B prefixes. Let
    total=(i-a0)+(j-b0), advanceB=max(total//2,total-(i-a0)), bounded by the available
    B equal-run end found by upper_bound in the source search range. Set advanceA=total-advanceB.
    If advanceA=advanceB+1 and another equal B remains, set star=1; otherwise star=0.
    Return A_boundary=a0+advanceA, B_boundary=d-A_boundary+star. Neighboring corrected
    boundaries define disjoint source subranges. Apply the requested serial multiset
    operation locally and compact surviving outputs through exact output-count prefixes.
    Intersection/difference output payloads come from A; union/symmetric difference
    preserve their declared source multiplicities.
backward_map: Concatenate local outputs to recover the requested sorted multiset operation,
  with equal-key counts paired consistently across partition boundaries.
obligations:
- name: duplicate_pairing
  statement: Corrected boundaries do not separate an equal-key matched pair in a way
    that changes the requested multiplicity.
  method: proof
- name: count_and_payload
  statement: Output prefixes compact survivors once and payload source follows the
    operation contract.
  method: test
effects:
  transactions: []
  storage: []
  overlap: []
scope:
  predicate: (p.inputs_sorted_same_strict_weak_order and p.equivalent_key_classes_consistent)
    and (p.balanced_boundary_algorithm_and_consumers_match and p.output_multiplicity_contract_explicit)
    and (p.output_prefixes_exact and p.payload_source_matches_operation)
  text: Two sorted sequences and the explicit balanced-path correction used by CCCL;
    integer coordinate packing must fit selected backend fields. This differs from
    a stable merge partition, which emits every duplicate rather than pairing equal
    occurrences.
requires: []
probed_on: []
relations: []
signature:
  algorithm: A merge-diagonal partition adjusted inside equal-key runs so multiset
    pairs stay consistently assigned.
  storage: Binding-specific counters, partials or output ranges.
  boundary: Tile prefixes and logical membership.
  resources: []
numeric_risk: Integer counts must not overflow; ordering/rounding policy belongs to
  the bound operation.
summary: When parallel set operations encounter duplicate runs crossing tile diagonals,
  rebalance the cuts through equal-key prefixes before serial intersection/difference/union.
  Choose input diagonal spacing, not independent A/B cuts. A run with three A copies
  and two B copies contributes two intersection outputs and one A-minus-B output even
  when a partition crosses its middle.
