name: tile_value_center_restoration
version: 1
level_from: 3
level_to: 4
change: vertical
refines: contract
produces:
- reduce
- map
- contract
- store
- sync
object:
  type: tile_centered_value_with_weighted_mean_restoration
  description: Store values as narrow residuals around one center per key tile and restore each center
    weighted by that tile probability mass.
variables:
- name: restore_schedule
  kind: structure
  binding: compile
  role: software
  domain:
  - per_tile
  - grouped16
  meaning: Add each tile mean promptly or aggregate16 tile masses/means for matrix instructions. Source
    uses grouped16; per_tile is an algebraic alternative with its own backend obligation.
constraints:
- id: c_tile
  expr: p.key_tile == 128 and p.value_features >= 1
  meaning: Pinned value center belongs to a complete physical128-key tile, with masks for logical tails.
  cls: implementation
preconditions:
- id: pre_center
  expr: p.values_decompose_as_residual_plus_one_center_per_key_tile and p.key_value_order_and_masks_match
  meaning: Residual V and the center have identical logical tile/head/feature identities after any common
    permutation.
  cls: semantic
- id: pre_probability
  expr: p.residual_pv_and_center_mass_use_same_cast_probability_weights and p.row_denominator_uses_declared_cast_weights
  meaning: A tile center multiplies the same rounded P used by its residual PV; final mass is the declared
    rounded-P mass.
  cls: semantic
- id: pre_frame
  expr: p.old_numerator_mass_and_pending_tile_masses_rescaled_once_to_same_reference and p.pending_means_added_once_before_finalization
  meaning: Pending tile masses follow every reference change until their center products are added; no
    contribution is lost or corrected twice.
  cls: semantic
- id: pre_scale
  expr: p.center_and_residual_share_per_channel_value_decode_scale and p.final_value_scale_applied_once
  meaning: Centers are expressed in residual code units; one per-channel scale decodes both terms after
    normalization.
  cls: semantic
- id: pre_numeric
  expr: p.center_cast_residual_quantization_probability_cast_and_mass_operand_rounding_admitted and p.finite_state_and_positive_final_mass
  meaning: BF16 centers, narrow residuals, rounded-P sums and BF16 hi/lo mass operands satisfy the selected
    numerical policy.
  cls: implementation
- id: pre_lifetime
  expr: p.pending_mass_center_coordinate_generation_matches_and_visible_until_mma_retires and p.selected_restore_schedule_implemented_and_resources_fit
  meaning: Mean and mass operand groups publish together in the intended frame and remain live through
    the deferred MMA/tail flush.
  cls: implementation
program:
  description: Choose one center mu[t,d] for each128-key tile and residual R[j,d]=V[j,d]-mu[t(j),d]. In
    per-channel value code units use Rhat=decode(narrow(R/s[d])) and muhat=cast(mu/s[d]). For each query,
    form the declared cast weights w[j] in its current online frame. Accumulate N_res[d]+=sum_j w[j]*Rhat[j,d],
    denominator L+=sum_j w[j], and per-tile mass U[t]=sum_{j in t} w[j]. Restore N_mean[d]+=U[t]*muhat[t,d]
    exactly once. With grouped16 keep up to16 masses, rescale every pending mass whenever the row reference
    changes, then contract the group with its matching centers into the current numerator. After insertion
    only the combined numerator is rescaled; retired group slots reset before reuse. Flush the final partial
    group before output. Native BF16 hi/lo splitting of each U and BF16 center MMA implements an admitted
    approximation. Final output is s[d]*(N_res[d]+N_mean[d])/L, followed by the declared output cast.
backward_map: For fixed common weights, sum_j w[j]*(R[j,d]+mu[t(j),d]) equals the original weighted value
  sum. With quantized residuals/centers and native mass operands it becomes the explicitly admitted reconstructed-value
  operator.
obligations:
- name: center_identity
  statement: Each center multiplies the mass of exactly its own logical key tile.
  method: proof
- name: pending_frame
  statement: Every pending mass follows all reference updates; insertion into N and the final group flush
    happen once.
  method: test
- name: cast_and_scale
  statement: Rounded weights, BF16 hi/lo mass, centers, per-channel scale and residual rounding obey the
    declared recipe.
  method: test
- name: group_protocol
  statement: Mean/mass operands have matching publication generations and survive every MMA reader.
  method: test
scope:
  predicate: (p.key_tile == 128 and p.value_features >= 1) and (p.values_decompose_as_residual_plus_one_center_per_key_tile
    and p.key_value_order_and_masks_match) and (p.residual_pv_and_center_mass_use_same_cast_probability_weights
    and p.row_denominator_uses_declared_cast_weights) and (p.old_numerator_mass_and_pending_tile_masses_rescaled_once_to_same_reference
    and p.pending_means_added_once_before_finalization) and (p.center_and_residual_share_per_channel_value_decode_scale
    and p.final_value_scale_applied_once) and (p.center_cast_residual_quantization_probability_cast_and_mass_operand_rounding_admitted
    and p.finite_state_and_positive_final_mass) and (p.pending_mass_center_coordinate_generation_matches_and_visible_until_mma_retires
    and p.selected_restore_schedule_implemented_and_resources_fit)
  text: Source VC-Attention dense fixed-length D128 MHA on Blackwell task-scheduled context, E4M3 residual
    V, BF16 tile means, grouped16 restoration and per-channel FP32 V scale. Per-tile restoration is an
    inferred alternate schedule. Causal/sparse masks, LSE and sinks are not supplied by this source route.
    Any key permutation must also permute V/support. This is separate from key centering, which produces
    a row-constant score shift, and query residual correction, which repairs scores before softmax.
signature:
  algorithm: Move tilewise value centers out of narrow PV and recover them with weighted tile masses.
  storage: Narrow value residuals plus center operands and up to16 pending row masses.
  boundary: Same cast P for residual and center terms; pending masses and numerator share the online frame.
  resources:
  - tensor
  - smem
  - registers
numeric_risk: Using unrounded probability mass for the center while residual PV uses cast P changes reconstructed
  values. Deferred masses in an old reference corrupt the result even when the final row mass is correct.
summary: When value tiles contain a large common offset, quantize residuals around a tile center and restore
  the center times its probability mass. Group16 mean products into matrix instructions only while all
  pending masses track the online row frame and the final group is flushed.
effects:
  transactions: []
  storage: []
  overlap: []
requires: []
probed_on: []
relations: []
