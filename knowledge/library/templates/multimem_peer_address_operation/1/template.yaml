name: multimem_peer_address_operation
version: 1
level_from: 3
level_to: 4
change: vertical
refines: transfer
produces:
- transfer
- sync
object:
  type: multimem_peer_address_operation
  description: A multicast virtual address applies one vector operation to corresponding
    bytes in each registered peer allocation.
variables:
- name: operation
  kind: structure
  binding: compile
  role: boundary
  domain:
  - replicate_store
  - sum_load
  meaning: Copy one vector to all registered peers, or sum corresponding FP32 vectors
    from those peers.
constraints:
- id: c0
  expr: p.size_bytes % 16 == 0 and p.address_alignment_bytes >= 16
  meaning: Source realization uses full 16-byte vectors only.
  cls: semantic
preconditions:
- id: pre0
  expr: p.multicast_membership_matches_collective and p.peer_allocations_live and
    p.sm90_multimem_supported
  meaning: Virtual address membership, peer lifetime and hardware gates are explicit.
  cls: semantic
- id: pre1
  expr: p.all_sources_ready_before_operation and p.all_readers_retired_before_source_reuse
  meaning: Upstream stream publication and downstream retirement protect peer payload.
  cls: semantic
- id: pre2
  expr: p.sum_rounding_admitted or operation == 'replicate_store'
  meaning: SUM mode requires admitted peer reduction arithmetic.
  cls: semantic
program:
  description: Bind corresponding peer offsets through a multicast allocation. For
    each independent 16-byte vector, replicate_store loads its bits from one ordinary
    source and uses multimem.st.global.v4.f32 at the multicast destination, writing
    identical bits to every member. sum_load executes multimem.ld_reduce.global.add.v4.f32
    at the multicast source and stores the resulting four FP32 sums to an ordinary
    destination. Peer ready and completion stream-memory operations bracket the source
    realization; a result at one rank versus all ranks is a caller consumer-set choice.
backward_map: 'Expand the multicast address to its member allocations: replicate_store
  copies identical source bits to every peer and sum_load adds each peer FP32 value
  once per coordinate.'
obligations:
- name: membership
  statement: Multicast registration denotes exactly the intended peer addresses for
    every vector.
  method: test
- name: payload_lifetime
  statement: Ready signals follow input writes and retirement signals follow all relevant
    reads.
  method: test
- name: operation_values
  statement: Vector store preserves bits or vector load performs the requested peer
    SUM under the numerical policy.
  method: test
effects:
  transactions: []
  storage: []
  overlap: []
scope:
  predicate: p.size_bytes % 16 == 0 and p.address_alignment_bytes >= 16 and p.multicast_membership_matches_collective
    and p.peer_allocations_live and p.sm90_multimem_supported and p.all_sources_ready_before_operation
    and p.all_readers_retired_before_source_reuse and p.sum_rounding_admitted or operation
    == 'replicate_store'
  text: NVIDIA SM90+ NVLink SHARP multicast allocations with explicit registered membership
    and full 16-byte vectors. SUM load is FP32 only; replicate store transports bit
    patterns. Distinct from CTA-cluster shared multicast and contraction instruction
    selection.
requires: []
probed_on: []
relations: []
signature:
  algorithm: A multicast virtual address applies one vector operation to corresponding
    bytes in each registered peer allocation.
  storage: Source-bound physical buffer; exact byte count and capacity supplied by
    binding.
  boundary: Coordinate identity and storage lifetime.
  resources:
  - smem
  - reg
numeric_risk: Address/storage transformation preserves values; arithmetic changes
  require separate obligations.
summary: When peer buffers have corresponding offsets and a registered multicast address,
  replace software fanout stores or peer-load sums with the corresponding multimem
  address operation. Choose operation from the collective contract, keep stream ready/retired
  handshakes, and reject unregistered peers or scalar tails. Two peers containing
  [1,2,3,4] and [10,20,30,40] produce [11,22,33,44] in SUM mode.
