name: ordered_affine_prefix
version: 1
level_from: 3
level_to: 4
change: vertical
refines: scan
produces:
- scan
object:
  type: ordered_affine_prefix
  description: When a recurrence has state-independent affine coefficients, replace
    serial token updates with an ordered associative prefix over affine maps; retain
    order because the combine is not commutative.
variables:
- name: chunk_size
  kind: numeric
  binding: compile
  role: software
  domain:
    lo: 1
    hi: 65536
  meaning: Free positive tile extent; scan tree and hardware menu separately constrained.
constraints: []
preconditions:
- id: pre0
  expr: p.coefficients_independent_of_prior_state and p.affine_coordinatewise_state
    and p.ordered_scan and p.rounding_admitted
  meaning: Coefficients may depend on input but not unknown state. Ordered associativity
    is required, not commutativity.
  cls: semantic
program:
  description: Represent token t by (a_t,b_t) for s_t=a_t*s_(t-1)+b_t. Compose earlier
    (a0,b0) then later (a1,b1) as (a1*a0,a1*b0+b1). Inclusive ordered scan yields
    (A_t,B_t), then s_t=A_t*s_initial+B_t. Chunk scans seed with the preceding aggregate;
    padded tail tokens are identity(1,0). A segment reset replaces its first coefficient
    a by zero so prior history cannot cross it. Real/complex diagonal coordinates
    scan independently; nonlinear output projections/gates occur after recovery, not
    inside this affine scan.
backward_map: Ordered diagonal real/complex affine recurrences; each prefix pair denotes
  the same function of initial state. General matrix transitions, state-dependent
  coefficients and nonlinear recurrence are outside this version.
obligations:
- name: composition
  statement: Substitution of s1=a0*s+b0 into s2=a1*s1+b1 gives composed coefficients;
    associative function composition preserves chronological order.
  method: proof
- name: tail_and_reset
  statement: Identity padding leaves final state unchanged; zero a at reset annihilates
    prior-state influence.
  method: proof
- name: chunk_carry
  statement: Seed every chunk with its exact previous aggregate before exposing outputs.
  method: proof
effects:
  transactions: []
  storage: []
  overlap: []
scope:
  predicate: (p.coefficients_independent_of_prior_state and p.affine_coordinatewise_state
    and p.ordered_scan and p.rounding_admitted)
  text: Ordered diagonal real/complex affine recurrences; each prefix pair denotes
    the same function of initial state. General matrix transitions, state-dependent
    coefficients and nonlinear recurrence are outside this version.
requires: []
probed_on: []
relations: []
signature:
  algorithm: When a recurrence has state-independent affine coefficients, replace
    serial token updates with an ordered associative prefix over affine maps; retain
    order because the combine is not commutative.
  boundary: Ordered diagonal real/complex affine recurrences; each prefix pair denotes
    the same function of initial state. General matrix transitions, state-dependent
    coefficients and nonlinear recurrence are outside this version.
  resources:
  - registers
numeric_risk: Floating-point reassociation, casts and approximate functions require
  an admitted numerical contract.
summary: When a recurrence has state-independent affine coefficients, replace serial
  token updates with an ordered associative prefix over affine maps; retain order
