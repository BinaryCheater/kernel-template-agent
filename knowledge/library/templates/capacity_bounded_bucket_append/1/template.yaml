  "summary": "When grouping points into bounded voxels, separate bucket identity assignment from point reservation, and expose the retained extent rather than the unsaturated reservation counter. Three points in one bucket with capacity2 reserve0,1,2: two payloads exist and count must clamp3 to2. The third point can still report that bucket ID; it is not a retained-slot identifier."
