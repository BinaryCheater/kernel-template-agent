name: launch_cancellation_work_reuse
version: 1
level_from: 4
level_to: 5
change: vertical
refines: work_assign
produces: [work_assign, sync]
object:
  type: cancelled_launch_work_owner
  description: An active cooperative worker group takes exclusive ownership of a launch group atomically cancelled before hardware dispatch.
variables:
  - {name: participants, kind: numeric, binding: compile, role: boundary, domain: {lo: 1, hi: 4096}, meaning: Number of response-reader arrivals protecting the single shared cancellation response before reuse.}
constraints:
  - {id: c_readers, expr: "participants == p.response_readers and p.response_slots == 1", meaning: This single-slot version waits for exactly the actual reader arrivals., cls: semantic}
  - {id: c_backend, expr: "p.cancel_removes_launch and p.success_ids_unique", meaning: A successful cancellation removes one not-yet-dispatched group and returns an exclusively owned work identity., cls: implementation}
preconditions:
  - {id: pre_response, expr: "p.success_checked_before_coordinates and p.stop_after_observed_failure", meaning: Failed responses are not decoded and no new query follows an observed failure., cls: implementation}
  - {id: pre_slot, expr: "p.slot_published_before_read and p.slot_reused_after_all_readers", meaning: All participating roles see the same response before the producer can overwrite it., cls: semantic}
  - {id: pre_work, expr: "p.independent_groups and p.group_decode_bijective and p.group_launch_fair", meaning: Independent native launch identities decode to the intended work groups and remaining uncancelled groups eventually dispatch., cls: semantic}
program:
  description: >-
    A natively dispatched worker first processes its own launch group's work. Its
    controller acquires the one response slot and submits a cancellation request
    for a not-yet-dispatched group. After asynchronous response completion, readers
    first inspect success. On success only, decode the cancelled launch identity,
    translate it to the cooperative group's work and retain all local-role offsets;
    release the response after every reader has finished and process that work.
    On failure, terminate this worker's reuse loop without decoding coordinates
    or issuing another request after that failure is observed. Uncancelled pending
    groups retain their native launch ownership.
backward_map: Replace each successfully cancelled identity's reused iteration by the native launch group it removed; preserve each logical group's work and erase responses and worker reuse.
obligations:
  - {name: exclusive_owner, statement: Every launch identity is either natively dispatched or successfully cancelled once and assigned to exactly one active worker group., method: exhaustive}
  - {name: response_lifetime, statement: Every required role observes the same completed response before its shared slot is overwritten., method: test}
  - {name: failure_guard, statement: No coordinate query uses a failed response and no cancellation request is issued after that failure is observed., method: exhaustive}
  - {name: target_progress, statement: Backend cancellation and native dispatch implement the stated ownership and fairness premises for the selected launch., method: unspecified}
effects:
  transactions: []
  storage:
    - {id: response, level: smem, scope: cta, bytes: "p.response_bytes"}
  overlap: []
scope:
  predicate: "p.independent_groups and p.cancel_removes_launch and p.success_ids_unique and p.success_checked_before_coordinates and p.stop_after_observed_failure and p.slot_published_before_read and p.slot_reused_after_all_readers and p.group_decode_bijective and p.group_launch_fair"
  text: >-
    Finite launches of cooperative work groups that may reuse an active worker to
    process a group cancelled before native dispatch. Cancellation ownership differs
    from a software atomic-counter queue: failed cancellation need not imply that
    every pending group is absent. Native launch remains responsible for uncancelled
    work. This version has one response slot, all-reader release and no speculative
    queries following an observed failure. Physical launch count and latency are unpriced.
requires: []
probed_on: []
relations: []
signature:
  algorithm: Reuse an active worker for an exclusively cancelled not-yet-dispatched launch group.
  reuse: Active group resources survive across multiple logical launch identities.
  storage: One shared response protected until all readers release it.
  boundary: Requires successful-response coordinate guards and target cancellation semantics.
  resources: [issue, smem]
numeric_risk: Reassigns independent cooperative groups; within-group reduction and arithmetic ordering remain separate.
summary: >-
  When the full grid already names cooperative work groups and active groups finish at different times, consider reusing a worker by cancelling an unstarted group. Preserve exclusive launch ownership, protect the response through all readers, query coordinates only after success and stop after an observed failure. The pinned CLC route has one response slot with224 readers for one CTA or416 for two; its unconditional coordinate-query IR still needs guarded-lowering evidence or a corrected implementation before reuse.
