name: sign_embedded_predicate
version: 1
level_from: 3
level_to: 4
change: vertical
refines: store
produces: [map, store, access]
object:
  type: nonnegative_payload_with_sign_predicate
  description: Store a Boolean predicate in the otherwise unused sign of a finite nonnegative floating payload.
variables:
  - {name: predicate_decode, kind: structure, binding: compile, role: software, domain: [sign_bit, nonnegative_comparison], meaning: "Decode the predicate by sign bit, or by c>=0 only when zero-payload ambiguity cannot change any observed result."}
constraints: []
preconditions:
  - {id: pre_payload, expr: "p.payload_finite_nonnegative and p.payload_magnitude_representation_admitted", meaning: "Payload values have no semantic negative sign or NaNs; any storage conversion of their magnitudes is numerically admitted.", cls: semantic}
  - {id: pre_storage, expr: "p.sign_encoding_preserved_through_storage_and_transfers and p.payload_predicate_coordinates_and_generation_match", meaning: "The sign encoding survives every relevant transfer/cast, and predicate and magnitude belong to the same element/generation.", cls: implementation}
  - {id: pre_zero, expr: "predicate_decode == 'sign_bit' or p.all_consumers_insensitive_to_predicate_when_payload_zero", meaning: "Numerical comparison cannot distinguish dropped -0 from kept +0, so it requires every consumer to be insensitive at zero.", cls: semantic}
  - {id: pre_consumer, expr: "p.every_consumer_decodes_sign_semantics_before_using_payload and p.no_unadmitted_sign_canonicalization", meaning: "Consumers use the encoded sign deliberately; no unrelated activation, clamp, absolute value or arithmetic destroys it before the last predicate user.", cls: semantic}
program:
  description: >-
    For payload v>=0 and keep predicate m, encode magnitude abs(v) with a
    positive sign when m is true and a negative sign otherwise. Set the sign
    explicitly for zero as well, rather than inheriting an input negative zero.
    Store c instead of separate payload and predicate arrays. Decode
    magnitude as abs(c). Decode m as not signbit(c), or as c>=0 only under the
    zero-insensitivity premise. A kept-only payload consumer may use max(c,0)
    under the declared finite/zero semantics. Preserve the signed value for any
    later predicate consumer; creating a kept-only view does not replace it.
    An encoded payload is not an ordinary signed numerical intermediate until
    its predicate meaning has been decoded. Original signed/NaN payload domains
    require a different representation.
backward_map: Recover the original magnitude and predicate from abs/signbit; in comparison mode recover observationally equivalent consumer results under the explicit zero-insensitivity premise.
obligations:
  - {name: encoding_and_zero, statement: "Positive payloads recover magnitude/predicate exactly; zero uses preserved sign-bit decoding or a verified zero-insensitive consumer contract.", method: test}
  - {name: representation_lifetime, statement: "Storage conversion and transfer preserve the required sign until all predicate consumers finish, with matching coordinates/generations.", method: test}
  - {name: consumer_equivalence, statement: "Every consumer decodes the sign before use, and its magnitude rounding/zero behavior satisfies the original computation.", method: test}
effects:
  transactions: []
  storage:
    - {id: encoded_payload, level: dram, scope: kernel, bytes: "p.elements * p.payload_element_bytes"}
  overlap: []
scope:
  predicate: "p.payload_finite_nonnegative and p.payload_magnitude_representation_admitted and p.sign_encoding_preserved_through_storage_and_transfers and p.payload_predicate_coordinates_and_generation_match and (predicate_decode == 'sign_bit' or p.all_consumers_insensitive_to_predicate_when_payload_zero) and p.every_consumer_decodes_sign_semantics_before_using_payload and p.no_unadmitted_sign_canonicalization"
  text: >-
    Finite nonnegative floating payloads with an available sign channel and
    consumers aware of the encoding. Source FA2 uses signed probabilities for
    dropout diagnostics and backward: ReLU conversion gives kept probabilities
    while signed FP32 values feed a centered derivative. This does not promise
    exact Boolean recovery from numerical comparison at zero, admit negative
    original payloads, or authorize moving the encoding across arbitrary math.
requires: []
probed_on: []
relations: []
signature:
  algorithm: Carry a Boolean in the sign of a finite nonnegative payload and decode it at each consumer.
  reuse: One stored value carries both magnitude and predicate, with no separate predicate tensor.
  storage: One floating array, with its sign retained until all predicate consumers finish.
  boundary: Nonnegative finite payload, signed-zero handling and encoding-aware consumers.
  resources: [dram, registers]
numeric_risk: Casting a small negative encoded value to negative zero loses predicate information under c>=0 even if its sign bit survives; zero-insensitivity must cover every downstream use.
summary: >-
  When a nonnegative payload must travel with a Boolean mask, use its unused
  sign: kept v, dropped -v. Decode magnitude with abs and the predicate with
  signbit. A comparison-based consumer may use c>=0 only if the lost distinction
  between +0 and -0 cannot affect its result. Keep a signed copy until the last
  predicate user; clamping it first destroys the checkpoint.
