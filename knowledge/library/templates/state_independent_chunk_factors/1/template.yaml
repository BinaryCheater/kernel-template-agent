name: state_independent_chunk_factors
version: 1
level_from: 3
level_to: 4
change: vertical
refines: map
produces:
- map
- store
- contract
object:
  type: parallel_feedback_factor_preparation_before_serial_state_chain
  description: Move state/value-independent chunk feedback work out of a serial recurrent chain, optionally
    storing folded low-rank state/output factors for a later ordered consumer.
variables:
- name: factor_supply
  kind: structure
  binding: compile
  role: software
  domain:
  - on_chain
  - prepared_workspace
  meaning: Compute chunk feedback next to its state consumer, or prepare independent chunks in parallel
    and publish all factor records before the serial state chain.
constraints:
- id: c_records
  expr: p.chunk_tokens == 16 and p.key_features == 128 and p.chunk_head_records >= 1 and p.factor_element_bytes
    == 2 and p.diagonal_element_bytes == 4
  meaning: First concrete binding:16-token,128-key factors, two-byte operand records and FP32 diagonal
    records. Counts describe logical useful chunk/head payloads.
  cls: implementation
preconditions:
- id: pre_factors
  expr: p.verified_chunk_feedback_factors_and_boundary_defined
  meaning: Each chunk has state-independent EK, EQ, E_end, K_restore, causal C and weighted feedback T
    with R=T*(V-EK*H). H_next=diag(E_end)*H+K_restore^T*R and Y=EQ*H+C*R under the admitted chunk feedback
    contract.
  cls: implementation
- id: pre_independence
  expr: p.prepared_factors_independent_of_incoming_state_and_values
  meaning: Prepare only W=K_restore^T*T and P=C*T plus EK,EQ,E_end; these depend on matching Q/K/gates/beta
    and normalization parameters, not incoming H or original V. No precomputed state-dependent residual
    may be reused for another H.
  cls: implementation
- id: pre_generations
  expr: p.factor_inputs_metadata_and_original_values_have_coherent_generations
  meaning: Q/K/gates/beta/normalization and sequence/chunk order remain coherent through preparation and
    all readers; original V remains available to the chain. Changed inputs require regeneration before
    reuse.
  cls: implementation
- id: pre_layout
  expr: p.workspace_encoder_and_all_native_consumer_maps_match
  meaning: Each prepared payload has a declared logical-to-physical map. Store, global layout, TMA image
    and each MMA reader compose to the same coordinates, including different instruction readers. Local
    writer/reader self-consistency alone is insufficient.
  cls: implementation
- id: pre_publish
  expr: p.prep_completes_before_chain_and_all_workspace_readers_retire_before_reuse
  meaning: Prepared mode finishes every factor write and async store, then publishes through an ordered
    kernel/stream dependency before chain reads. Scratch is private to an invocation or its prior consumers
    have retired; this version does not use a cross-kernel flag ring.
  cls: implementation
- id: pre_chain
  expr: p.unique_sequence_state_shards_and_ordered_chunk_consumption
  meaning: Each sequence/head/value shard has one state chain, consumes chunks in logical order, and finishes
    old-state projections before replacement. Value shards own disjoint state/output elements and share
    read-only factors.
  cls: implementation
- id: pre_numeric
  expr: p.folded_factor_casts_and_state_operand_recipe_admitted
  meaning: Folding T into W/P and workspace stores change association/rounding. Preserve the explicit
    state-operand conversion used in X/output and the declared carried-state recipe; both supplies meet
    the admitted error policy rather than bitwise equivalence.
  cls: implementation
- id: pre_backend
  expr: p.factor_supply_width_target_dtype_and_workspace_capacity_supported
  meaning: Selected on-chain or prepared route is implemented for this target/shape/dtype; actual chunk
    prefix fits capacity and producer/consumer use matching sequence origins. Dispatch occupancy thresholds
    are tuning policy, not legality or speed guarantees.
  cls: implementation
program:
  description: In on_chain, form feedback factors and corrected residual R at the sequential state consumer
    under its declared arithmetic. In prepared_workspace, prepare independent chunk/head records EK,EQ,W=K_restore^T*T,P=C*T,E_end
    without reading H or V, encode each record for the later native readers, finish async stores and publish
    the complete workspace. Then each sequence/head/value shard walks its chunk prefix in order. With
    H_operand=the declared conversion of incoming H, form X=EK*H_operand and Z=V-X, output Y=(EQ*H_operand+P*Z)*resolved_query_scale,
    and H_next=diag(E_end)*H+W*Z under the declared state arithmetic. Capture projections from old H before
    replacing it. Retain original V instead of storing value-dependent U/O factors. Read-only factors
    may serve multiple disjoint value shards. Retire every reader before reusing prepared storage. Whole-workspace
    publication here is an ordered launch boundary, not concurrent chain-first execution.
backward_map: Substitute W=K_restore^T*T and P=C*T. Associativity recovers R=T*(V-EK*H_operand), then
  original output and state contractions under the admitted reassociation/cast policy. Preparing factors
  early is legal because they do not depend on H or V.
obligations:
- name: independent_preparation
  statement: Every moved operation depends only on coherent chunk inputs, never a state generation or
    value residual.
  method: proof
- name: factor_composition
  statement: Folded W/P with original V preserves output and outgoing-state equations for each ordered
    chunk.
  method: test
- name: reader_coordinate_agreement
  statement: Each native reader recovers the same labeled logical factor coordinates from the workspace
    image.
  method: test
- name: publication_and_lifetime
  statement: All factors and metadata publish before chain consumers and all readers retire before workspace
    or old-state overwrite.
  method: test
effects:
  transactions: []
  storage:
  - id: prepared_logical_payload
    level: dram
    scope: kernel
    bytes: p.chunk_head_records * ((3 * p.chunk_tokens * p.key_features + p.chunk_tokens * p.chunk_tokens)
      * p.factor_element_bytes + p.key_features * p.diagonal_element_bytes)
    when: factor_supply == 'prepared_workspace'
    note: EK,EQ,W transposed records, P and E_end only. Allocation alignment, capacity slack, metadata,
      original V and state are separate.
  overlap: []
scope:
  predicate: p.chunk_tokens == 16 and p.key_features == 128 and p.chunk_head_records >= 1 and p.factor_element_bytes
    == 2 and p.diagonal_element_bytes == 4 and (p.verified_chunk_feedback_factors_and_boundary_defined)
    and (p.prepared_factors_independent_of_incoming_state_and_values) and (p.factor_inputs_metadata_and_original_values_have_coherent_generations)
    and (p.workspace_encoder_and_all_native_consumer_maps_match) and (p.prep_completes_before_chain_and_all_workspace_readers_retire_before_reuse)
    and (p.unique_sequence_state_shards_and_ordered_chunk_consumption) and (p.folded_factor_casts_and_state_operand_recipe_admitted)
    and (p.factor_supply_width_target_dtype_and_workspace_capacity_supported)
  text: KDA BT16 SM100-family decomp prepares all chunk/head factors, then one chain CTA per sequence/head/value-half
    (64 of128 value rows). The fused engine is the on-chain alternative. Runtime route n_seq*heads*2<=SM_count
    is a source policy only. No concurrent flag-ring publication, generic parallel prefix scan, arbitrary
    chunk widths or guaranteed performance gain is claimed.
requires: []
probed_on: []
relations:
- type: requires
  target: chunked_delta_feedback@2
  note: Supplies channelwise feedback factor equations and numerical boundaries; the schedule adds independent
    preparation and whole-workspace publication.
signature:
  algorithm: Parallel preparation of state-independent low-rank chunk factors before an ordered recurrent
    consumer.
  storage: EK,EQ,W,P,E_end workspace; original values remain the chain inputs.
  boundary: State/value independence, matching all native coordinate readers, whole-workspace publication
    and sequential state identity.
  resources:
  - dram
  - smem
  - tensor
  - registers
numeric_risk: W/P factor folding introduces different rounding from an on-chain inverse/residual path.
  A workspace permutation valid for one reader can silently shift key channels for another.
summary: When the serial state chain is short on parallel work, prepare its Q/K/gate-only chunk factors
  independently and store low-rank W/P records. Keep values unmaterialized until the chain, publish the
  workspace before consumption, and preserve exact chunk/state and native layout identities.
