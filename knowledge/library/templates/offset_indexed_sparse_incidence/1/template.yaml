    },
    {
      "name": "output_identity",
      "statement": "Competing input contributors share the same deduplicated output identity.",
      "method": "proof"
    },
    {
      "name": "mask_publication",
      "statement": "Masks begin at zero, competing bits use atomic OR, and map/mask writes complete before consumption.",
      "method": "proof"
    }
  ],
