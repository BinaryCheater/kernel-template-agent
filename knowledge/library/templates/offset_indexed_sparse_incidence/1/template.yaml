    "description": "For each input and kernel offset, evaluate the integer convolution coordinate transform and bounds/divisibility predicate. Deduplicate valid output coordinates into output identities. Store pair[offset,output]=input, otherwise -1; set bit offset%32 in word offset//32 for each present pair. Consumers sum feature[input,c]*weight[offset,c,o] only for present entries. Native format instead compacts input/output pairs per offset. Submanifold format restricts output identities to existing input sites."
  },
  "backward_map": "Erase auxiliary organization and recover the visible results under the stated contract.",
