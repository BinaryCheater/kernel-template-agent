name: opposite_order_topk_merge
version: 1
level_from: 2
level_to: 3
change: vertical
refines: reduce
produces:
- reduce
- store
- sync
object:
  type: opposite_order_topk_merge
  description: Two bounded top-k lists in opposite order merge by pairwise maximum
    into a bitonic candidate list.
variables:
- name: capacity
  kind: numeric
  binding: compile
  role: software
  domain:
    lo: 1
    hi: 65536
  meaning: Power-of-two retained candidate count, at least the requested k.
constraints: []
preconditions:
- id: pre0
  expr: p.capacity_power_of_two and p.common_total_key_order and p.input_blocks_partition_candidates
  meaning: Local top-k and retained state use the same total order over distinct original
    occurrences.
  cls: semantic
- id: pre1
  expr: p.left_list_ascending_and_right_list_descending and p.padding_below_all_valid_keys
  meaning: Merge inputs are oppositely ordered and padding cannot win.
  cls: semantic
- id: pre2
  expr: p.requested_k <= capacity and p.enough_valid_candidates
  meaning: Retained count covers requested outputs.
  cls: semantic
program:
  description: Scan disjoint input blocks. Retain each block top capacity keys under
    one total order. Sort the running retained list ascending, take the next block
    top list descending, and replace running state elementwise by max(left[i],right[i]).
    This bitonic sequence contains the largest capacity keys of their union; sort/bitonic-merge
    it before the next iteration. Finally sort retained keys descending and keep requested
    k. Source total key packs monotone floating value in high bits and reverse original
    index in low16 bits, so smaller expert index wins equal supplied floating-bit
    values.
backward_map: Expand the stream into the union of all original candidates; retained
  state is its top-capacity multiset and final prefix is the requested exact top-k.
obligations:
- name: pairwise_union
  statement: Opposite sorted lists pairwise maxima retain the largest capacity elements
    of their union.
  method: proof
- name: key_identity
  statement: Packed keys preserve value order, original identity and admitted tie/exception
    semantics.
  method: test
effects:
  transactions: []
  storage: []
  overlap: []
scope:
  predicate: (p.capacity_power_of_two and p.common_total_key_order and p.input_blocks_partition_candidates)
    and (p.left_list_ascending_and_right_list_descending and p.padding_below_all_valid_keys)
    and (p.requested_k <= capacity and p.enough_valid_candidates)
  text: Power-of-two bounded exact top-k, disjoint input blocks and common total keys.
    Floating signed zero and NaN must follow explicit key semantics; mathematical
    equality of differently encoded values is not inferred. Source expert count<32768
    bounds low16 index encoding.
requires: []
probed_on: []
relations: []
signature:
  algorithm: Two bounded top-k lists in opposite order merge by pairwise maximum into
    a bitonic candidate list.
  storage: Binding-specific counters, partials or output ranges.
  boundary: Tile prefixes and logical membership.
  resources: []
numeric_risk: Integer counts must not overflow; ordering/rounding policy belongs to
  the bound operation.
summary: When streaming exact top-k should keep only k-sized state, merge opposite-sorted
  retained and block top lists by pairwise max, then bitonic-sort the result. This
  needs neither a multi-run cursor nor an append/threshold buffer. Keep score/index
  key order identical at every block, and exclude padded zeros from valid keys.
