name: butterfly_reduce_scatter_chunks
version: 1
level_from: 3
level_to: 4
change: vertical
refines: reduce
produces:
- reduce
- store
- sync
object:
  type: butterfly_reduce_scatter_chunks
  description: A warp subgroup reduces vector-valued partials while scattering disjoint
    result chunks among its lanes.
variables:
- name: lanes
  kind: numeric
  binding: compile
  role: software
  domain:
    lo: 1
    hi: 65536
  meaning: Power-of-two subgroup lanes spanning the reduction axis.
- name: values
  kind: numeric
  binding: compile
  role: software
  domain:
    lo: 1
    hi: 65536
  meaning: Vector components contributed by each subgroup lane.
constraints:
- id: c0
  expr: values % lanes == 0 and values >= lanes and p.lanes_power_of_two
  meaning: Each recursive half has an integral chunk.
  cls: semantic
- id: c1
  expr: p.subgroup_mapping_exact and p.lanes_participate
  meaning: Peer shuffles stay within the logical subgroup and every required lane
    participates.
  cls: semantic
preconditions:
- id: pre0
  expr: p.combine_associative_commutative_under_contract and p.valid_partial_states
  meaning: The combine and state contract admit the butterfly order.
  cls: semantic
program:
  description: Start each of lanes logical lanes with values partial states. At each
    descending XOR peer bit halve the live component vector. Lower-half owners keep
    the lower half and send the upper half; upper-half owners keep the upper half
    and send the lower half. Combine received peer states componentwise with the retained
    states. Repeat until each lane owns values/lanes complete states, the contiguous
    component range [lane*values/lanes,(lane+1)*values/lanes). Publish only these
    states for subsequent cross-warp combining.
backward_map: Gather the disjoint per-lane output chunks to reconstruct the vector
  reduction of every original lane partial.
obligations:
- name: component_membership
  statement: Each final component contains each subgroup input exactly once with no
    component mixing.
  method: proof
- name: shuffle_and_state
  statement: Physical XOR peers, active mask and any coupled statistical state implement
    the logical exchange.
  method: test
effects:
  transactions: []
  storage: []
  overlap: []
scope:
  predicate: values % lanes == 0 and values >= lanes and p.lanes_power_of_two and
    p.subgroup_mapping_exact and p.lanes_participate and p.combine_associative_commutative_under_contract
    and p.valid_partial_states
  text: Power-of-two warp subgroups with divisible vector length; combine may be a
    coupled state such as count/mean/M2 provided its merge contract is satisfied.
    Source BDIMX divides 32, lanes=32/BDIMX and NumVals divisible by lanes.
requires: []
probed_on: []
relations: []
signature:
  algorithm: A warp subgroup reduces vector-valued partials while scattering disjoint
    result chunks among its lanes.
  storage: Source-bound physical buffer; exact byte count and capacity supplied by
    binding.
  boundary: Coordinate identity and storage lifetime.
  resources:
  - smem
  - reg
numeric_risk: Address/storage transformation preserves values; arithmetic changes
  require separate obligations.
summary: When each lane holds several outer-reduction statistics, reduce and scatter
  vector chunks before writing shared partials. Choose subgroup width and vector length;
  BDIMX=8,NumVals=8 gives four reduction lanes and two final components per lane,
  reducing shared payload fourfold. Reject component counts not divisible by subgroup
  width or shuffles crossing another output column.
