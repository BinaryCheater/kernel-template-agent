    "text": "Concrete source has512 threads, one atomic per warp plus lane prefixes, four8192-value stages per batch,4096 packed candidate slots and exact top-k fallback. Failed batch retries stages; failed stage compaction loads old candidates and the full8192 stage into registers before writing back k records, with a census barrier covering all old reads. This is bounded storage protocol, not a substitute for a valid compaction algorithm."
  },
