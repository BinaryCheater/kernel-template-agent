      "meaning": "If even one stage does not fit, rollback it and compact from the prior committed records plus complete current stage; no input is silently truncated.",
      "cls": "implementation"
    },
    {
      "id": "pre_5",
      "expr": "p.commit_or_compaction_publishes_count_after_records and p.retry_protocol_terminates",
