  "program": {
    "description": "Snapshot the conceptual committed prefix length c. Each participant reserves a disjoint range for its batch hits and only writes when that range fits the physical candidate buffer. Collectively wait until all claims and writes are complete. If every range fits, publish the appended count and release input stages. Otherwise sum every batch reservation, restore count=c, discard speculative suffix writes and retry each still-live stage. A stage that fits commits; a stage that does not fit has its reservations rolled back and is processed directly with the complete committed prefix by a semantics-preserving compactor. Only after the whole retry finishes may the input ring be refilled. Speculative writes beyond c are dead after rollback; they cannot overwrite the old prefix."
  },
  "backward_map": "Every successful fast batch appends its records once; every failed batch has no visible committed effect before its original input is retried exactly once. Compaction consumes the full declared logical input, so physical candidate capacity never causes silent loss.",
  "obligations": [
    {
      "name": "logical_equivalence",
      "statement": "Every successful fast batch appends its records once; every failed batch has no visible committed effect before its original input is retried exactly once. Compaction consumes the full declared logical input, so physical candidate capacity never causes silent loss.",
      "method": "proof"
    },
    {
      "name": "protocol",
      "statement": "Native participants, counters, visibility and scratch lifetimes implement the declared complete dataflow.",
      "method": "test"
    }
  ],
