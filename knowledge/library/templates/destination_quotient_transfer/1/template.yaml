      "method": "exhaustive"
    },
    {
      "name": "expand_exact",
      "statement": "Expansion recovers each original source/destination delivery exactly once, including its weight.",
      "method": "exhaustive"
    },
    {
      "name": "publish",
      "statement": "Payload and metadata arrive before any forwarded read or buffer reuse.",
      "method": "exhaustive"
    }
  ],
