{
  "name": "counted_overlap_depth_binning",
  "version": 1,
  "level_from": 2,
  "level_to": 3,
  "change": "vertical",
  "refines": "map",
  "produces": [
    "map",
    "access"
  ],
  "object": {
    "type": "counted_overlap_depth_binning",
    "description": "When one primitive contributes to several screen tiles, duplicate its identity into disjoint prefix-reserved ranges and sort composite tile/depth keys for ordered tile consumers."
  },
  "variables": [
    {
      "name": "tile_size",
      "kind": "numeric",
      "binding": "compile",
      "role": "software",
      "domain": {
        "lo": 1,
        "hi": 1024
      },
      "meaning": "Screen tile side in pixels; legality also constrained by consumer launch/storage."
    },
    {
      "name": "depth_bits",
      "kind": "numeric",
      "binding": "compile",
      "role": "software",
      "domain": [
        32
      ],
      "meaning": "Source float depth occupies low 32 bits of composite key."
    }
  ],
  "constraints": [],
  "preconditions": [
    {
      "id": "pre_0",
      "expr": "p.count_emit_same_predicate and p.prefix_sum_exact",
      "meaning": "Count and emit use identical overlap and clipping predicates; integer scan does not overflow.",
      "cls": "semantic"
    },
    {
      "id": "pre_1",
      "expr": "p.positive_finite_depth and p.key_fields_fit",
      "meaning": "Unsigned float bits preserve positive finite depth order and composite image/tile fields fit int64.",
      "cls": "semantic"
    },
    {
      "id": "pre_2",
      "expr": "p.consumer_order_required and p.valid_primitive_ids",
      "meaning": "Consumer needs front-to-back order and duplicate records preserve original primitive identity.",
      "cls": "semantic"
    }
  ],
  "program": {
    "description": "Count accepted tile intersections for each primitive using the selected bounding-box or ellipse support predicate. Inclusive-scan counts; primitive i emits exactly its count records starting at prefix[i-1] or zero for i=0. Each record pairs original primitive ID with key=(image,tile,positive-depth-bits). Sort paired keys/IDs by tile then depth. Construct each tile range from changes of key prefix, or lower_bound each active tile prefix and append a terminal total-count sentinel. Consumers read each duplicate only for its tile."
  },
  "backward_map": "Erase auxiliary organization and recover the visible results under the stated contract.",
  "obligations": [
    {
      "name": "count_emit",
      "statement": "Same predicate and traversal produce exactly the reserved count, including clipping and zero-radius paths.",
      "method": "proof"
    },
    {
      "name": "identity_pairing",
      "statement": "Sorting permutes keys and IDs together and each accepted primitive/tile pair appears exactly once.",
      "method": "proof"
    },
    {
      "name": "ordering",
      "statement": "Key encoding preserves image/tile grouping and positive finite depth order without field overlap.",
      "method": "proof"
    },
    {
      "name": "range_recovery",
      "statement": "Each tile range is the exact contiguous sorted run, including empty tiles and final sentinel.",
      "method": "proof"
    }
  ],
  "effects": {
    "transactions": [],
    "storage": [],
    "overlap": []
  },
  "scope": {
    "predicate": "p.count_emit_same_predicate and p.prefix_sum_exact and p.positive_finite_depth and p.key_fields_fit and p.consumer_order_required and p.valid_primitive_ids",
    "text": "NVIDIA CUDA tile-intersection preprocessing for Gaussian splatting. Rectangular and ellipse overlap are separate support predicates. Sparse active-tile output must include every emitted tile. Equal depths do not establish a stable primitive-ID order unless the downstream contract supplies it. Resource effects: Two overlap passes plus scan and paired radix sort; O(total_intersections) key/ID storage, avoiding all-primitives scans per tile. Sparse range output uses active_tiles+1 offsets."
  },
  "requires": [],
  "probed_on": [],
  "relations": [],
  "signature": {
    "algorithm": "When one primitive contributes to several screen tiles, duplicate its identity into disjoint prefix-reserved ranges and sort composite tile/depth keys for ordered tile consumers.",
    "storage": "Two overlap passes plus scan and paired radix sort; O(total_intersections) key/ID storage, avoiding all-primitives scans per tile. Sparse range output uses active_tiles+1 offsets.",
    "boundary": "Counts [2,0,1] give inclusive prefix [2,2,3], emit ranges [0,2),[2,2),[2,3). A Gaussian crossing two tiles emits two records with the same Gaussian ID; deduplicating that ID globally removes a required tile contribution. Negative/NaN depth cannot use this unsigned-bit ordering unchanged.",
    "resources": []
  },
  "numeric_risk": "Preserve the supplied arithmetic contract; reassociation, quantization and approximate search require separate permission.",
  "summary": "When one primitive contributes to several screen tiles, duplicate its identity into disjoint prefix-reserved ranges and sort composite tile/depth keys for ordered tile consumers. Counts [2,0,1] give inclusive prefix [2,2,3], emit ranges [0,2),[2,2),[2,3). A Gaussian crossing two tiles emits two records with the same Gaussian ID; deduplicating that ID globally removes a required tile contribution. Negative/NaN depth cannot use this unsigned-bit ordering unchanged."
}
