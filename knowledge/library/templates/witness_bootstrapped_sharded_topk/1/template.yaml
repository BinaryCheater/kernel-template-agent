    "text": "Pinned DeepSelect BF16 cluster2/3/4/8/16, initial window32768 per CTA, k<=MAX_TOPK512/1024, arbitrary ties and complete disjoint slices. Source NaN handling is separate. Bootstrap windows visit the only partial tail first; short slices use the direct complete-window branch. Local candidate buffer4096 and input stages8192 use reservation rollback before exact compaction; that independent storage choice is reservation_rollback_retry@1."
