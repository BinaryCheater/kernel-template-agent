    "type": "witness_bootstrapped_sharded_topk",
    "description": "When one row is split among workers that initially hold fewer than k local winners, obtain k global rank witnesses from a shared bootstrap sample before filtering each shard. Raise a local threshold only after that worker has its own k retained witnesses."
  },
