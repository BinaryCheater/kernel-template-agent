    {
      "id": "pre_3",
      "expr": "p.local_threshold_raises_only_after_exact_local_topk and p.local_topk_inputs_complete",
      "meaning": "A worker may replace its retained records by exact local top-k only after at least k actual records are available.",
      "cls": "implementation"
    },
    {
      "id": "pre_4",
      "expr": "p.final_selection_covers_all_retained_workers and p.arbitrary_tie_identity_admitted and p.nan_inputs_excluded",
      "meaning": "Final global top-k is exact over the complete retained union; arbitrary tied identities are legal.",
      "cls": "implementation"
    }
  ],
  "program": {
    "description": "Select exact global top-k from the union of initial per-worker windows and distribute those winner records to their original workers. Let b be its kth value. For the rest of each disjoint shard retain records strictly greater than b; discarded ties are permitted because the retained bootstrap winners already supply k witnesses. A worker can compact its complete local candidates to k once at least k exist; thereafter it may raise its filter threshold to the least local winner. Discarding below either threshold is safe: the bootstrap threshold has k global witnesses, and any raised local threshold has k local witnesses. Finally select exact global top-k over every retained worker candidate, including workers that never reached k locally."
  },
  "backward_map": "Reinsert each discarded record: its discard had k distinct actually retained-or-dominating witnesses in the global union. Local exact top-k substitution preserves the global top-k value multiset, so final selection returns an allowed full-row top-k.",
  "obligations": [
    {
      "name": "logical_equivalence",
      "statement": "Reinsert each discarded record: its discard had k distinct actually retained-or-dominating witnesses in the global union. Local exact top-k substitution preserves the global top-k value multiset, so final selection returns an allowed full-row top-k.",
      "method": "proof"
    },
    {
      "name": "protocol",
      "statement": "Native participants, counters, visibility and scratch lifetimes implement the declared complete dataflow.",
      "method": "test"
    }
  ],
