name: score_replication_or_exchange
version: 1
level_from: 3
level_to: 4
change: vertical
refines: contract
produces:
- contract
- reduce
- store
- sync
object:
  type: two_feature_owners_score_supply
  description: Keep two disjoint output-feature owners and choose duplicated complete scores or key-sharded
    scores with shared weight exchange.
variables:
- name: score_supply
  kind: structure
  binding: compile
  role: software
  domain:
  - replicate_full_scores
  - key_shards_exchange
  meaning: Trade repeated complete score/normalization work for key-sharded score production plus common-frame
    P exchange.
constraints:
- id: c_shape
  expr: p.owners == 2 and p.query_rows >= 1 and p.value_features >= 2 and p.value_features % 2 == 0 and
    p.key_tile >= 1
  meaning: Two owners have equal nonempty output-feature slices.
  cls: semantic
- id: c_shard
  expr: score_supply != 'key_shards_exchange' or p.key_tile % 2 == 0
  meaning: Sharded score production uses equal nonempty key halves.
  cls: implementation
- id: c_weight
  expr: p.weight_element_bytes == 2
  meaning: This binding exchanges FP16/BF16 probabilities.
  cls: implementation
- id: c_capacity
  expr: score_supply != 'key_shards_exchange' or 2 * p.query_rows * p.key_tile + 8 * p.query_rows <= p.exchange_capacity_bytes
  meaning: Weight tile and a two-owner FP32 row table fit the exchange allocation; max and final mass
    tables reuse the same bytes only after old readers retire.
  cls: resource
preconditions:
- id: pre_identity
  expr: p.same_query_key_values_masks_and_score_components_for_both_owners and p.complete_score_before_exponentiation
  meaning: Both owners use identical logical operands, masks and full score-component sums before normalization.
  cls: semantic
- id: pre_output
  expr: p.two_feature_slices_disjoint_complete_and_each_reads_all_keys
  meaning: Output ownership is two disjoint feature halves, and both halves contract every logical key.
  cls: semantic
- id: pre_numeric
  expr: p.fp16_or_bf16_weight_cast_and_fp32_output_state and p.mass_uses_cast_weights_with_admitted_sum_order
    and p.redundant_score_paths_numerically_compatible
  meaning: Both paths use the same declared P cast and rounded-weight mass definition; score/reduction
    differences satisfy the numerical policy.
  cls: implementation
- id: pre_online
  expr: p.old_numerator_and_mass_corrected_before_new_terms and p.gain_absent_and_empty_row_state_defined
  meaning: Each online reference change corrects only old contributions; there is no hidden gain and empty
    rows have defined state/finalization.
  cls: semantic
- id: pre_exchange
  expr: score_supply != 'key_shards_exchange' or (p.key_shards_disjoint_complete and p.common_max_published_before_exponents
    and p.p_exchange_exact_coordinate_map_and_generation and p.published_weights_visible_until_all_readers_retire
    and p.mass_shards_combined_once_in_common_reference)
  meaning: Sharded scores agree on one row frame, publish a complete P tile and sum the matching mass
    shards exactly once.
  cls: implementation
- id: pre_replicas
  expr: score_supply != 'replicate_full_scores' or p.replicas_use_same_reference_and_complete_mass_without_cross_replica_sum
  meaning: Replicas each form the full row normalization and must not add identical complete masses together.
  cls: implementation
- id: pre_backend
  expr: p.selected_score_supply_implemented_and_resources_fit and p.aliased_score_weight_latent_and_statistic_storage_lifetimes_valid
  meaning: The actual consumer implements the selected score layout, fits registers/shared capacity and
    retires every reader before rope/P, latent or max/mass storage reuse.
  cls: implementation
program:
  description: Keep owner j responsible for output features [j*Dv/2,(j+1)*Dv/2). With replicate_full_scores
    each owner computes the complete QK score tile including every latent/rope component, applies the
    same logical mask, forms its full online max and casts all exponent weights to T. Each replica accumulates
    the full rounded-weight mass and contracts all keys for its own value slice. No inter-owner P exchange
    or denominator sum is needed. With key_shards_exchange, each owner computes one key half, exchanges
    local maxima and obtains a common online row reference before exponentiating. Correct each old feature
    numerator and local mass to that frame. Cast local P to the same T, accumulate only that key half
    mass, and publish the local P half into its original row/key coordinates in shared memory. After publication
    each owner reads the entire shared P across both halves and contracts all keys for its value slice.
    At finalization sum the two mass shards once in their common frame; normalize each uniquely owned
    feature output by that full mass. The replicated path instead uses its already complete mass, never
    the sum of two complete replicas. Keep latent data alive through both score and value readers; an
    aliased rope/P region may be overwritten only after all rope readers retire. Empty rows use the declared
    nondividing branch.
backward_map: Concatenate the two feature slices. In either path each output feature has the complete
  same-key weight/value sum; common-frame shard masses combine to the full mass already present in either
  replica.
obligations:
- name: score_and_output_identity
  statement: Full scores and masks match before exponentiation, and each unique output feature consumes
    every key once.
  method: proof
- name: mass_multiplicity
  statement: Sharded mass is combined once after frame alignment; replicated complete masses are never
    summed together.
  method: test
- name: exchange_and_alias
  statement: P writes/read coordinates and generations agree; maxima publish before exponents, weights
    before PV, and all readers retire before rope/P or latent reuse.
  method: test
- name: numeric_and_resources
  statement: The backend supports both selected score paths and their actual numeric, register/shared-memory
    and barrier contracts.
  method: test
effects:
  transactions: []
  storage:
  - id: shared_weight_tile
    level: smem
    scope: cta
    bytes: 2 * p.query_rows * p.key_tile
    when: score_supply == 'key_shards_exchange'
  - id: max_mass_tables
    level: smem
    scope: cta
    bytes: 8 * p.query_rows
    when: score_supply == 'key_shards_exchange'
  overlap: []
scope:
  predicate: (p.same_query_key_values_masks_and_score_components_for_both_owners and p.complete_score_before_exponentiation)
    and (p.two_feature_slices_disjoint_complete_and_each_reads_all_keys) and (p.fp16_or_bf16_weight_cast_and_fp32_output_state
    and p.mass_uses_cast_weights_with_admitted_sum_order and p.redundant_score_paths_numerically_compatible)
    and (p.old_numerator_and_mass_corrected_before_new_terms and p.gain_absent_and_empty_row_state_defined)
    and (score_supply != 'key_shards_exchange' or (p.key_shards_disjoint_complete and p.common_max_published_before_exponents
    and p.p_exchange_exact_coordinate_map_and_generation and p.published_weights_visible_until_all_readers_retire
    and p.mass_shards_combined_once_in_common_reference)) and (score_supply != 'replicate_full_scores'
    or p.replicas_use_same_reference_and_complete_mass_without_cross_replica_sum) and (p.selected_score_supply_implemented_and_resources_fit
    and p.aliased_score_weight_latent_and_statistic_storage_lifetimes_valid)
  text: Two cooperative feature owners in one CTA, FP16/BF16 weights, FP32 numerator state and explicitly
    rounded-weight mass. Source classic MLA uses two 128-thread groups in a 256-thread CTA, 64 packed
    query rows, and shared latent values for score and PV. FP8 KV is first decoded and forces the replicated
    score path. Other owner counts, ungained high-precision mass definitions, probability gains and native
    asynchronous group protocols need separate bindings. Storage formulas describe the exchange regions,
    not total kernel allocation.
requires: []
probed_on: []
relations: []
signature:
  algorithm: Duplicate complete QK/P locally or partition QK by keys and exchange P, while output feature
    ownership remains fixed.
  reuse: Both feature owners need all weights; duplication avoids the exchange, while sharding avoids
    redundant score evaluation.
  storage: Key-shard exchange needs a full shared weight tile and one aliased two-owner max/mass table;
    source can also reuse retired rope storage.
  boundary: Complete scores, full-key PV, common online frame and distinct replicated versus sharded mass
    multiplicities.
  resources:
  - tensor
  - registers
  - smem
numeric_risk: Rounded-P mass, shared max combination and different score/reduction association can change
  the result. Equal real-number weights alone do not prove equal native casts or replica states.
summary: When two disjoint value-feature owners both need a complete probability tile, choose whether
  to recompute that tile in both owners or compute key halves once and exchange the weights. Replication
  spends score/normalization work to avoid P publication and shared reads. Sharding requires a common
  row reference, a complete P exchange and exactly one sum of mass shards. Both owners still read all
  keys; adding two already-complete replica denominators halves the output incorrectly.
