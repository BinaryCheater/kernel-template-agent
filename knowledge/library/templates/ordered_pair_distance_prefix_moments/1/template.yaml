      "meaning": "Absolute depth difference can be replaced by ordered subtraction; ordering is semantic.",
      "cls": "semantic"
    }
  ],
  "program": {
    "description": "Maintain A=sum previous weights and B=sum previous weight*depth, initially zero. For current (w,z), accumulate D+=2*w*(z*A-B), then A+=w,B+=w*z. This is sum over both orientations of all distinct sample pairs w_i*w_j*abs(z_i-z_j). For alpha compositing w=alpha*T_before and A=1-T_before only when initial T=1 and no inconsistent skipped-T updates."
  },
  "backward_map": "Erase auxiliary organization and recover the visible results under the stated contract.",
  "obligations": [
    {
      "name": "pair_expansion",
      "statement": "At prefix j, D equals twice sum_i<k<=j w_i*w_k*(z_k-z_i); A,B are prefix moments.",
      "method": "proof"
    },
    {
      "name": "ordering",
      "statement": "Without sorted evaluated depth, signed subtraction cannot replace absolute difference.",
      "method": "proof"
    }
  ],
