    "description": "When weighted samples are ordered by nondecreasing scalar depth, replace quadratic pairwise absolute-distance accumulation by prefix weight and weighted-depth moments."
  },
  "variables": [],
  "constraints": [],
  "preconditions": [
    {
      "id": "pre_0",
