name: replicated_cluster_partials
version: 1
level_from: 4
level_to: 5
change: vertical
refines: reduce
produces:
- transfer
- sync
- reduce
object:
  type: replicated_small_tuple_cluster_allreduce
  description: Replicate every warp partial to all cluster CTAs so each can form the complete statistic
    and continue its own output shard.
variables:
- name: peers
  kind: numeric
  binding: compile
  role: software
  domain:
  - 2
  - 4
  - 8
  meaning: CTAs sharing the reduction domain; native witness8, smaller groups require neutral inactive
    receiver lanes and supported launch.
- name: warps_per_cta
  kind: numeric
  binding: compile
  role: software
  domain:
    lo: 1
    hi: 8
  meaning: Sending warps per CTA; native witness4; total sender count must fit32 receiver lanes.
- name: phases
  kind: numeric
  binding: compile
  role: boundary
  domain:
    lo: 1
    hi: 8
  meaning: Finite dependent reductions in the fused graph, with separate tables/barriers; native dual-normalization
    witness2, not a free reassociation of stages.
constraints:
- id: c_slots
  expr: peers * warps_per_cta <= 32
  meaning: One receiver warp can fold every sender slot.
  cls: implementation
- id: c_phases
  expr: phases >= 1
  meaning: At least one finite allreduce invocation with a dedicated bank.
  cls: implementation
preconditions:
- id: pre_partition
  expr: p.local_partials_cover_disjoint_complete_domain and p.tuple_components_and_reduce_order_explicit
  meaning: Each sender warp owns an exact disjoint contribution; four FP32 tuple components have declared
    combine/order semantics.
  cls: implementation
- id: pre_cluster
  expr: p.cluster_launch_and_remote_async_store_supported and p.all_ctas_resident_and_matching_phases
  meaning: All peers share a supported resident cluster and enter the same finite dependent phases without
    divergent exits.
  cls: implementation
- id: pre_slots
  expr: p.sender_slot_equals_rank_times_warps_plus_warp and p.one_identical_tuple_store_per_sender_per_destination
  meaning: Every source rank/warp has an exclusive slot in every destination; each destination receives
    one identical completed16-byte tuple per sender, including its own rank.
  cls: implementation
- id: pre_visibility
  expr: p.barriers_initialized_and_cluster_published_before_stores and p.expected_bytes_equals_16_times_sender_count
    and p.transaction_completion_orders_payload_reads
  meaning: Each destination transaction barrier expects exactly16*peers*warps bytes and completes only
    after those payload stores become readable.
  cls: implementation
- id: pre_banks
  expr: p.each_phase_has_dedicated_barrier_and_partial_bank and p.no_phase_bank_reuse_before_all_readers_retire
  meaning: The finite phase sequence uses distinct banks/barriers, initially phase0; this version does
    not recycle banks by parity.
  cls: implementation
- id: pre_reads
  expr: p.each_consuming_warp_reduces_each_live_slot_once and p.inactive_reduction_lanes_are_initialized_zero
  meaning: Each consuming warp combines one tuple from every sender; unused warp lanes are neutral and never
    read outside the allocated slot table.
  cls: implementation
- id: pre_lifetime
  expr: p.all_remote_accesses_complete_before_cluster_exit_or_storage_reuse and p.final_cluster_retirement_join_matches
  meaning: No peer exits or reuses distributed shared memory before every remote writer and reader retires.
  cls: implementation
- id: pre_numeric
  expr: p.fp32_partial_and_tuple_reduction_rounding_admitted and p.dependent_phase_inputs_preserve_requested_checkpoints
  meaning: The local and tuple reduction trees meet the numeric contract; downstream dependent statistics
    use their specified rounded inputs rather than algebraically expanded substitutes.
  cls: implementation
program:
  description: Allocate phases private per-CTA tables [peers*warps_per_cta,4] of FP32 and one fresh transaction
    barrier per phase. Initialize barriers and complete the cluster publication join. In each phase, each
    warp first reduces its own four components by the declared warp tree. Destination CTA leader expects16*peers*warps_per_cta
    bytes. For every destination d, one sender lane issues an asynchronous16-byte remote shared store
    of that tuple to slot rank*warps_per_cta+warp and completes bytes on destination d barrier. Each receiving
    CTA waits for its own barrier, then each consuming converged warp folds all live slots, zeroing unused lanes
    when sender count<32. The resulting tuple is available to each local output shard. Preserve dependent-phase
    checkpoints and use a different table/barrier for the next phase. After the last phase, a cluster
    retirement join precedes CTA exit or any table reuse. There is no elected global statistic owner and
    no second result-broadcast phase.
backward_map: For each phase erase replicated transports and view each receiver result as the same declared
  fold of the original disjoint sender partials. Replicas enable local consumers but do not add contributions
  to the logical sum.
obligations:
- name: sender_destination_bijection
  statement: Every receiver slot maps to exactly one rank/warp sender, with identical tuple data at all
    receivers.
  method: exhaustive
- name: transaction_census
  statement: Exactly one16-byte completion per sender/destination matches each destination expected byte
    count; publication precedes reads.
  method: test
- name: phase_lifetime
  statement: Dependent phases use distinct banks and matching checkpoints, and terminal retirement protects
    all remote accesses.
  method: test
- name: numeric_tree
  statement: Local and receiver reduction trees plus subsequent normalization satisfy admitted finite-precision
    behavior.
  method: test
effects:
  transactions: []
  storage:
  - id: replicated_tuple_tables
    level: smem
    scope: cta
    bytes: 16 * peers * warps_per_cta * phases
  - id: phase_barriers
    level: smem
    scope: cta
    bytes: 8 * phases
  overlap: []
scope:
  predicate: (peers * warps_per_cta <= 32) and (phases >= 1) and (p.local_partials_cover_disjoint_complete_domain
    and p.tuple_components_and_reduce_order_explicit) and (p.cluster_launch_and_remote_async_store_supported
    and p.all_ctas_resident_and_matching_phases) and (p.sender_slot_equals_rank_times_warps_plus_warp
    and p.one_identical_tuple_store_per_sender_per_destination) and (p.barriers_initialized_and_cluster_published_before_stores
    and p.expected_bytes_equals_16_times_sender_count and p.transaction_completion_orders_payload_reads)
    and (p.each_phase_has_dedicated_barrier_and_partial_bank and p.no_phase_bank_reuse_before_all_readers_retire)
    and (p.each_consuming_warp_reduces_each_live_slot_once and p.inactive_reduction_lanes_are_initialized_zero)
    and (p.all_remote_accesses_complete_before_cluster_exit_or_storage_reuse and p.final_cluster_retirement_join_matches)
    and (p.fp32_partial_and_tuple_reduction_rounding_admitted and p.dependent_phase_inputs_preserve_requested_checkpoints)
  text: Native FlashInfer gated-residual-next-RMSNorm uses H8192,8 CTAs,4 warps per CTA,4 FP32 components
    and2 dedicated phases. CLUSTER_N8 gives exactly32 sender slots; scalar statistics use one live tuple
    component and three zeros. Smaller peer/warp settings are inferred bindings requiring explicit zero
    lanes. This is a finite cluster allreduce, not the global-counter repeated allreduce, row-owned attention
    merge or an indefinitely reused ring.
requires: []
probed_on: []
relations: []
signature:
  algorithm: All-to-all publication of tiny warp partials followed by redundant complete reduction in
    each CTA.
  storage: Dedicated sender-indexed tuple table and transaction barrier per phase in each CTA.
  boundary: Exact sender byte census, cluster initialization/retirement, no cross-phase reuse and preserved
    dependent inputs.
  resources:
  - smem
  - registers
  - issue
numeric_risk: Replicating a statistic must not multiply its logical contribution. Reassociation of FP32
  sums and replacement of a rounded residual by expanded moment identities can change downstream normalization.
summary: When several CTAs own disjoint columns of one row and each needs a tiny shared statistic before
  continuing, replicate each warp partial to every peer and reduce locally. This avoids choosing a statistic
  owner and broadcasting its result, at the cost of peers-squared tuple traffic and replicated scratch.
  Match every16-byte store to the receiver transaction barrier, give dependent reductions separate banks
  and retire the cluster before reuse.
