{
  "name": "tile_max_topk_cover",
  "version": 1,
  "level_from": 2,
  "level_to": 3,
  "change": "vertical",
  "refines": "reduce",
  "produces": [
    "map",
    "reduce"
  ],
  "object": {
    "type": "topk_over_tiled_row",
    "description": "Select a union of whole tiles by their exact maxima before selecting individual values."
  },
  "variables": [
    {
      "name": "tile_width",
      "kind": "numeric",
      "binding": "compile",
      "role": "software",
      "domain": [
        1024
      ],
      "meaning": "Elements per source tile; final tile is masked."
    },
    {
      "name": "retained_tiles",
      "kind": "numeric",
      "binding": "runtime",
      "role": "software",
      "domain": {
        "lo": 1,
        "hi": 2147483647
      },
      "meaning": "Number of highest-maximum tiles whose complete valid contents enter final selection."
    }
  ],
  "constraints": [
    {
      "id": "c_cover",
      "expr": "retained_tiles >= min(p.k, p.tile_count) and retained_tiles <= p.tile_count",
      "meaning": "Keep at least one tile-maximum witness for each required rank, or keep all tiles.",
      "cls": "semantic"
    }
  ],
  "preconditions": [
    {
      "id": "pre_row",
      "expr": "p.k > 0 and p.k <= p.length and p.tiles_partition_valid_row and p.nan_inputs_excluded",
      "meaning": "Nonempty disjoint tiles partition all valid finite ordered values.",
      "cls": "semantic"
    },
    {
      "id": "pre_max",
      "expr": "p.tile_maxima_exact_and_attained and p.selected_tiles_are_highest_maxima",
      "meaning": "Each tile summary is its attained maximum, not an arbitrary upper bound.",
      "cls": "semantic"
    },
    {
      "id": "pre_select",
      "expr": "p.complete_selected_tiles_gathered and p.final_selector_exact_topk and p.arbitrary_tie_identity_admitted and p.padding_never_selected",
      "meaning": "Gather every valid value in selected tiles, preserve original identities and allow arbitrary boundary ties.",
      "cls": "semantic"
    }
  ],
  "program": {
    "description": "Compute an attained exact maximum for each disjoint tile. Keep retained_tiles tiles with largest maxima. Gather their complete valid contents, retaining original indices, and run exact top-k over this union. An omitted value cannot exceed its tile maximum; when tiles are omitted, at least k selected distinct tiles each supply an actual value no smaller than that maximum. Hence the selected union contains some allowed global top-k. Sorting retained tile IDs for locality does not change that union. A separate full-row sum or normalization still visits every input; selected tiles alone do not preserve logsumexp."
  },
  "backward_map": "Reinsert each omitted tile: every omitted value is dominated or tied by at least k distinct attained maxima already in retained tiles.",
  "obligations": [
    {
      "name": "rank_cover",
      "statement": "The retained union contains an allowed global top-k under arbitrary tied identity.",
      "method": "proof"
    },
    {
      "name": "gather_identity",
      "statement": "All valid members of each selected tile are gathered once at original coordinates; padding cannot win.",
      "method": "test"
    }
  ],
  "effects": {
    "transactions": [],
    "storage": [],
    "overlap": []
  },
  "scope": {
    "predicate": "retained_tiles >= min(p.k, p.tile_count) and retained_tiles <= p.tile_count and p.k > 0 and p.k <= p.length and p.tiles_partition_valid_row and p.nan_inputs_excluded and p.tile_maxima_exact_and_attained and p.selected_tiles_are_highest_maxima and p.complete_selected_tiles_gathered and p.final_selector_exact_topk and p.arbitrary_tie_identity_admitted and p.padding_never_selected",
    "text": "Source LiLiCorr uses width1024, retained_tiles=min(k,ceil(V/1024)); its Triton branch requires this count to be a power of two. Tile-ID sorting and repeated argmax implement gather and final selection. Source finite -3e38 padding requires valid selected winners strictly above that sentinel; global smallest-index tie identity is not established."
  },
  "requires": [],
  "probed_on": [],
  "relations": [],
  "signature": {
    "algorithm": "Attained tile maxima supply rank witnesses for whole-tile top-k pruning.",
    "storage": "One maximum per tile and retained_tiles*tile_width gathered values.",
    "boundary": "Every retained tile maximum has an actual distinct witness; arbitrary tie identity.",
    "resources": [
      "dram",
      "registers"
    ]
  },
  "numeric_risk": "NaNs or a finite padding sentinel that can win invalidate rank comparisons. Full-row logsumexp remains a separate reduction over all tiles.",
  "summary": "When exact top-k scans a large row but k is small, retain the k highest-maximum tiles and select from their complete contents. The attained maxima certify rank coverage without a heuristic threshold. Choose tile width and retained count subject to the witness bound; ties may choose any valid identities."
}
