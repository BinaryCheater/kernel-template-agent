  "numeric_risk": "Lexicographic maximum is associative and each shard winner dominates every record it replaces. Complement log1p avoids rounding the largest 32-bit hash to u=1. This proof preserves a declared finite-hash selector, not cryptographic quality or an exact categorical law. Native underflow/division may create score ties or infinities; source requires a matching policy. Host partition/endpoint witnesses are checks/keyed_race.json.",
  "summary": "When weighted token selection must repeat for the same key and context despite changed launch partition, derive each race score from original token identity, then reduce shard winners with the same score/ID order."
