  "program": {
    "description": "Given branches Y_j=X*W_j^T with equal X,K and compatible arithmetic, concatenate W_j along output features to Wcat. Compute Z=X*Wcat^T at the admitted common intermediate precision. The output column intervals partition Z and map back to the original Y_j. Expose each as a view only if its consumer accepts that stride; otherwise materialize the declared dense result, applying only its original dtype conversion/epilogue. A consumer may directly read its slice without saving a separate full matrix. Changing GEMM dimensions can select a different accumulation algorithm, so exact or error-bounded numerical admission is required independently of the real-arithmetic identity."
