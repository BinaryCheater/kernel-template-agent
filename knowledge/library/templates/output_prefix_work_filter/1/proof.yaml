template: output_prefix_work_filter@1
version: 1
relation: Retained units cover exactly the original visible output domain with unchanged coordinates and arithmetic; discarded units have empty intersection with that domain.
rank: Remaining base units in each finite worker sequence.
assumes:
  - {name: partition, statement: The base schedule partitions visible outputs and prefixes are immutable legal bounds.}
  - {name: padding, statement: Every executed padded access is safe and padded stores have no observable effect.}
  - {name: agreement, statement: Peers and all pipeline roles share the retained sequence and invalid work is checked before metadata reads.}
guarantees: []
models: []
note: >-
  A nonnegative interval beginning at r intersects [0,v) iff r<v, so the whole-unit
  predicate cannot discard a visible output. The base partition gives uniqueness;
  retaining an extra initial interval adds no visible duplicate. Peer agreement
  keeps cooperative transfers and arrival generations aligned. Scalar replay covers
  zero/full/partial prefixes, multiple peer counts and worker strides, and retains a
  peer-local predicate disagreement and terminal metadata-overrun counterexample.
  The original source needs a validity-first metadata guard; generated pipeline
  progress, exact lane mapping and padded access safety remain backend obligations.
  No registered proof checker or GPU execution is claimed.
