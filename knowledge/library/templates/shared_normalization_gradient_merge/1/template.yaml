name: shared_normalization_gradient_merge
version: 1
level_from: 3
level_to: 4
change: vertical
refines: reduce
produces:
- reduce
- map
- store
object:
  type: shared_normalized_row_gradient_fan_in
  description: Merge consumer gradients in FP32 before the shared raw-row normalization pullback and one
    final narrow cast.
variables:
- name: gradient_merge_storage
  kind: structure
  binding: compile
  role: software
  domain:
  - owned_accumulator
  - fp32_partials
  meaning: Keep the ordered consumer sum in one group owner or materialize exact per-consumer FP32 slots
    for a later ordered merge. Pullback and final-cast stages stay the same.
constraints:
- id: c_shape
  expr: p.consumer_count >= 1 and p.channels >= 1 and p.live_rows >= 0
  meaning: Every live shared row has at least one consumer and complete positive channel extent; empty
    token domains write nothing.
  cls: semantic
preconditions:
- id: pre_shared
  expr: p.one_raw_normalized_row_shared_by_exact_consumer_group
  meaning: One raw row x is normalized once and shared by exactly the enumerated consumer group. Each
    consumer supplies its complete gradient D_j with respect to that same normalized row; no consumer
    is omitted or counted twice.
  cls: semantic
- id: pre_stage
  expr: p.forward_rounding_and_normalization_gradient_convention_explicit
  meaning: Forward supplies cast_narrow(x*r), with saved forward r. Backward convention applies the smooth
    normalization pullback r*(D-y*dot(D,y)) with y=x*r at the declared FP32 stages, not the derivative
    of a discrete quantizer. Epsilon and statistic domain match forward.
  cls: semantic
- id: pre_generation
  expr: p.raw_row_saved_r_and_local_gradients_share_one_forward_generation
  meaning: Raw row, saved r, consumer gradients and head-group map refer to one forward generation; normalized
    narrow activations cannot reconstruct the unrounded y. Replayed r is interchangeable only with an
    explicit equality contract.
  cls: implementation
- id: pre_order
  expr: p.complete_fp32_consumer_gradients_merge_in_fixed_group_order
  meaning: Initialize from the first gradient then add subsequent consumer IDs in fixed ascending order
    in FP32. No per-consumer narrow cast, atomics or schedule-dependent reassociation occurs before the
    shared pullback. Singleton groups bypass addition without changing the final stages.
  cls: implementation
- id: pre_dot
  expr: p.complete_row_dot_tree_and_fp32_operation_recipe_explicit
  meaning: The complete normalized channel row participates in dot(D,y). Dot tree, product/add/FMA grouping,
    subtraction, final scaling, FTZ and final cast follow the admitted recipe. Group-sum order and channel-dot
    order are different contracts.
  cls: implementation
- id: pre_workspace
  expr: gradient_merge_storage != 'fp32_partials' or p.partial_slots_publish_before_read_and_live_through_final_merge
  meaning: Materialized per-consumer partials have exact token/group/consumer/channel coordinates and
    nonoverlapping writers. Reducers read only published live slots; buffers remain immutable until all
    required rows are reduced.
  cls: implementation
- id: pre_owned
  expr: gradient_merge_storage != 'owned_accumulator' or p.one_owner_holds_group_accumulator_through_pullback
  meaning: A unique group owner serially merges all consumer contributions in its FP32 accumulator and
    retains it through the complete-row pullback; accumulator capacity and internal barriers are supported.
  cls: implementation
- id: pre_output
  expr: p.output_strides_tail_masks_and_unique_raw_gradient_owner_valid
  meaning: One owner writes each raw gradient element after the pullback and one final narrow cast. Raw/normalized/output
    strides are distinct, chunk tails are masked and packed sibling gradients are disjoint.
  cls: implementation
- id: pre_backend
  expr: p.selected_target_group_ratio_and_norm_programs_implemented
  meaning: The selected backend implements normalized preparation, saved-statistic application and raw
    pullback for the shape and head ratio. Source host orchestration fallback still executes tensor operations
    on the GPU; it is not CPU numerical execution.
  cls: implementation
program:
  description: For each shared raw row, enumerate its consumers in the fixed group order. With owned_accumulator,
    initialize D from consumer0 and add each later FP32 D_j into the unique owner accumulator. With fp32_partials,
    store each D_j in its exclusive row/consumer/channel slot, publish all required slots and perform
    the same ascending FP32 additions later. Use original raw x and saved forward r to form unrounded
    FP32 y=x*r. Compute the complete-row dot s=dot(D,y) with the declared channel tree, then dx=r*(D-y*s)
    with explicit product/subtract/scaling stages. Round dx once into the output format. Do not substitute
    forward narrow cast(x*r) for y or independently cast/pull back consumers before merging. Preserve
    raw input, saved statistic, normalized operand and output coordinate/stride identities; tail tokens
    and empty domains do not create consumers.
backward_map: Each raw row is shared, so its incoming smooth gradient is the sum of exactly its consumer
  gradients. Apply the shared normalization Jacobian J=r*I-r^3*x*x^T once to that sum, respecting the
  fixed finite-precision realization. Original raw/statistic generation identifies the same Jacobian used
  by the source backward convention.
obligations:
- name: consumer_fan_in
  statement: Every consumer gradient contributes exactly once to its shared raw row in the prescribed
    FP32 order.
  method: test
- name: pullback_stage
  statement: The admitted raw/statistic Jacobian and complete-row dot are applied after fan-in and before
    the sole final cast.
  method: proof
- name: storage_ownership
  statement: Owned accumulators or published FP32 partial slots supply identical admitted inputs to the
    pullback and remain valid through their last reader.
  method: test
- name: numeric_recipe
  statement: Forward/statistic reconstruction and backward FP32 operation trees, no-FTZ behavior and final
    rounding match the native stage contract.
  method: test
effects:
  transactions: []
  storage:
  - id: materialized_consumer_gradients
    level: dram
    scope: kernel
    bytes: p.live_rows * p.consumer_count * p.channels * 4
    when: gradient_merge_storage == 'fp32_partials'
    note: One FP32 consumer-gradient tensor. Q and K have separate instances. Native fused path keeps
      its accumulators in TMEM; this effect counts only materialized partials.
  overlap: []
scope:
  predicate: (p.consumer_count >= 1 and p.channels >= 1 and p.live_rows >= 0) and (p.one_raw_normalized_row_shared_by_exact_consumer_group)
    and (p.forward_rounding_and_normalization_gradient_convention_explicit) and (p.raw_row_saved_r_and_local_gradients_share_one_forward_generation)
    and (p.complete_fp32_consumer_gradients_merge_in_fixed_group_order) and (p.complete_row_dot_tree_and_fp32_operation_recipe_explicit)
    and (gradient_merge_storage != 'fp32_partials' or p.partial_slots_publish_before_read_and_live_through_final_merge)
    and (gradient_merge_storage != 'owned_accumulator' or p.one_owner_holds_group_accumulator_through_pullback)
    and (p.output_strides_tail_masks_and_unique_raw_gradient_owner_valid) and (p.selected_target_group_ratio_and_norm_programs_implemented)
  text: FlashInfer deterministic KCP GDN SM100/103/107, BF16 raw/forward/output rows, 128 channels and
    HV/Hqk contiguous consumers. Forward r is FP32 inverse sqrt of complete sum of squares plus1e-6. Native
    fused mode uses a persistent chunk/QK-head owner and TMEM ordered group sum; host-orchestrated mode
    writes per-value-head FP32 partials and reduces token blocks before the same pullback. This defines
    the smooth normalization gradient convention through the narrow activation stage; it does not differentiate
    the discrete BF16 quantizer or promise bitwise equality under alternate trees.
requires: []
probed_on: []
relations: []
signature:
  algorithm: Sum gradients from all consumers of one normalized row before its shared normalization pullback.
  storage: Group-owned FP32 accumulator or per-consumer FP32 materialization; raw x and saved forward
    r survive through pullback.
  boundary: Group identity, complete channel dot, original versus rounded normalized rows, fixed operation
    order and one final cast.
  resources:
  - tensor
  - dram
  - registers
  - shared
numeric_risk: Casting per-head gradients early, substituting BF16 normalized rows for raw x*r, or changing
  either group addition or channel-dot order changes the raw gradient. Saved-r equality is a stage identity,
  not a consequence of matching shapes.
summary: When a normalized input row is shared across several consumers, choose where to hold their FP32
  gradient sum, then apply one shared normalization pullback using raw inputs and saved statistics before
  the final narrow cast. Preserve consumer order separately from the complete-channel dot tree.
