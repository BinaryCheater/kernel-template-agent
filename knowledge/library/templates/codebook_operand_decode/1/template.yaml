{
  "name": "codebook_operand_decode",
  "version": 1,
  "level_from": 3,
  "level_to": 4,
  "change": "vertical",
  "refines": "contract",
  "produces": [
    "map",
    "transfer",
    "contract"
  ],
  "object": {
    "type": "indexed_vector_with_scale_sign_offset",
    "description": "Packed index selects a scalar/vector codebook entry; optional sign map and group scale/offset reconstruct the logical operand coordinates."
  },
  "variables": [
    {
      "name": "vector_width",
      "kind": "numeric",
      "binding": "compile",
      "role": "boundary",
      "domain": [
        1,
        4,
        8
      ],
      "meaning": "Logical values per codebook index, fixed by storage format."
    },
    {
      "name": "decode_site",
      "kind": "structure",
      "binding": "compile",
      "role": "software",
      "domain": [
        "standalone_output",
        "at_contraction"
      ],
      "meaning": "Materialize reconstructed values or consume the same codebook interpretation inside a dot product with an explicitly admitted arithmetic policy."
    }
  ],
  "constraints": [],
  "preconditions": [
    {
      "id": "pre_format",
      "expr": "p.indices_in_codebook_range and p.table_and_sign_decoder_fixed and p.coordinate_maps_complete",
      "meaning": "Code indices, table byte/component order, sign expansion and output coordinates are format-defined; no linear code approximation is substituted.",
      "cls": "semantic"
    },
    {
      "id": "pre_meta",
      "expr": "p.scale_offset_groups_match_indices and p.metadata_generation_immutable_and_visible",
      "meaning": "Every decoded component uses the matching table, sign, local/global scale and optional offset generation.",
      "cls": "implementation"
    },
    {
      "id": "pre_numeric",
      "expr": "p.selected_decode_contraction_recipe_supported and p.scale_offset_cast_and_integer_accumulation_policy_admitted",
      "meaning": "Standalone half casts and fused integer/scaled accumulation need their own numerical admission; neither is automatically bitwise equivalent.",
      "cls": "implementation"
    }
  ],
  "program": {
    "description": "Unpack each indexI for its original vector coordinate. Fetch table vectorT[I,j],j=0..vector_width-1. Obtain sign_j from the exact explicit or encoded sign-map table, or use+1 when signs are embedded inT. Decodevalue_j=gain_group*sign_j*T[I,j]+offset_group with the original scale/cast order. In standalone_output write the declared output dtype. In at_contraction form dot products over exactly the same logical components using the admitted codebook/integer accumulation recipe and preserve every required scale/offset term; do not treatI as a uniformly spaced numeric code."
  },
  "backward_map": "Expand each codebook index and metadata record into its vector values at original coordinates; the contraction consumes that declared representation under its numerical policy.",
  "obligations": [
    {
      "name": "table_identity",
      "statement": "Indices, byte/component order and sign-map expansion reconstruct the exact format-defined codebook vectors.",
      "method": "exhaustive"
    },
    {
      "name": "metadata_owner",
      "statement": "All vector components use matching gain/offset and original coordinates with no repeated or missing contribution.",
      "method": "test"
    },
    {
      "name": "numeric_boundary",
      "statement": "Standalone and fused decode recipes implement their explicitly declared scaling, rounding and accumulation policy.",
      "method": "test"
    }
  ],
  "effects": {
    "transactions": [],
    "storage": [],
    "overlap": []
  },
  "scope": {
    "predicate": "p.indices_in_codebook_range and p.table_and_sign_decoder_fixed and p.coordinate_maps_complete and p.selected_decode_contraction_recipe_supported",
    "text": "Pinned GGUF nonuniform scalar IQ4 and vector IQ1/IQ2/IQ3 operand formats, with immutable format codebooks and explicit sign/metadata maps. Source IQ2_XXS uses256 eight-byte vectors and128 sign masks; IQ4_NL uses16 signed scalar entries. This rule decodes existing representations; it does not train codebooks or prove quantization error against original weights."
  },
  "requires": [],
  "probed_on": [],
  "relations": [],
  "signature": {
    "algorithm": "Index-table vector expansion with original sign/scale/offset metadata, optionally consumed inside a dot.",
    "storage": "Packed indices and immutable format codebook; decoded intermediate optional.",
    "boundary": "Vector component order, parity-compressed signs, hierarchical scale and offset ownership.",
    "resources": []
  },
  "numeric_risk": "Nonuniform table indices are not affine levels. Fused integer and standalone half decode differ in intermediate rounding and scale application; preserve each recipe explicitly.",
  "summary": "When low-bit weights index a nonuniform scalar/vector codebook, retain the table and sign-map semantics through decode. Choose standalone expansion or an admitted fused codebook dot while preserving coordinate, scale and offset identity. This exposes codebook reuse and materialization choices without pretending the index bits are uniformly spaced signed integers."
}
