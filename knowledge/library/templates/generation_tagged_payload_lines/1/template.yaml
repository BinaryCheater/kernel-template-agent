    "description": "Map step g to circular slot g%S. Wait for retired credit before writing. Emit payload with expected generation g+1 in every designated tag field. Receiver repeatedly loads line and tests all expected tags; cooperative variants vote across flag lanes and reload payload after successful vote. Reduce/copy only matching payload. Retire slot after all readers finish. On finite tag rollover, clean every stale line tag including unused tail lines before allowing alias; otherwise require nonwrapping generation epoch."
  },
  "backward_map": "Erase auxiliary organization and recover the visible results under the stated contract.",
  "obligations": [
    {
      "name": "ready",
      "statement": "No payload from an older generation may be accepted for g; the hardware visibility premise connects matching tags to data.",
      "method": "proof"
    },
    {
      "name": "reuse",
      "statement": "Credits prevent overwrite while any reader holds the old slot.",
      "method": "proof"
    },
    {
      "name": "rollover",
      "statement": "Unused lines cannot retain a tag that aliases a later live generation.",
      "method": "proof"
    }
  ],
